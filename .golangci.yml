version: "2"

# SCOPE. Every go-lint step in .github/workflows/ci.yml is scoped to pocketbase/,
# and scripts/ci/go_test_shard.py runs with cwd=pocketbase. So docker/healthcheck --
# the workspace's other module, 26 lines -- is linted by nothing, deliberately.
#
# Running this config over it reports four findings, one of which is real: the
# `defer resp.Body.Close()` in main.go never runs, because os.Exit(1) follows it.
# A 26-line container healthcheck does not earn its own CI lint surface, and
# kindred#2663 closed the dangerous half by making its go.mod able to trigger the
# Go steps -- a `go` directive bumped there hard-fails every Go command in
# pocketbase/, so that one IS watched. Ruled 2026-09-01, kindred#2663.

run:
  # No `go:` pin. Left unset it derives from pocketbase/go.mod, so the language
  # version the linters target cannot drift from the one the compiler uses --
  # a pinned "1.26" would have silently gone stale the moment go.mod moved.
  timeout: 10m
  build-tags:
    - pocketbase

linters:
  default: none
  enable:
    # Core linters
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    # Code quality
    - misspell
    - unconvert
    - whitespace
    - nakedret
    - prealloc
    - goprintffuncname
    # Additional linters
    - bodyclose
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - lll
    - revive
    # Safety linters
    - nilerr
    - noctx
    - errorlint
    - forcetypeassert
    - usetesting
    - exhaustive
    - wrapcheck

  settings:
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
      # `Call` is goconst's own default. Setting this key replaces the default
      # rather than adding to it, so it has to be restated to be kept.
      #
      # CompositeLit was here too until kindred#2669's sibling PR, and it was a
      # wider suppression than it read: exclude-types filters COUNTED
      # occurrences, not just reported ones. A string appearing twice in
      # assignments and three times in composite literals reports "5
      # occurrences" with CompositeLit counted, and goes completely silent
      # without it -- the total falls below min-occurrences, so the two
      # assignment sites stop reporting as well. Measured with a probe package.
      #
      # The 468 findings that exclusion hid are 460 in sync/, 5 in campminder/
      # (fixed in kindred#2666) and 3 in lodging/. So the honest shape is a
      # path exclusion for sync/ -- see the exclusions block below, next to the
      # gocyclo and dupl entries that scope that same package for the same
      # reason -- which keeps the rule live for every other package and for
      # everything written from here on. kindred#2665 owns the sync/ backlog.
      exclude-types:
        - Call
      # Matches the repo's standing policy that these linters do not apply to
      # tests (see the _test.go exclusion below), and goconst 1.10 added the
      # option to express it directly.
      ignore-tests: true
    misspell:
      locale: US
      extra-words:
        - typo: "cancelled"
          correction: "cancelled"
        # CampMinder ships a custom field literally named "Housing Accomodation"
        # (one m) alongside the correctly-spelled "Housing Accommodation". Both
        # are real field names we must match on, so the typo is data, not a bug.
        - typo: "accomodation"
          correction: "accomodation"
        # CampMinder ships the SVI plate field under the British spelling
        # "SVI-licence plate number" (kindred#2258). The American spelling
        # matched nothing for the table's entire history, so the field name
        # is data, not a bug -- matched literally in staff_vehicle_info.go
        # and pinned by staff_vehicle_info_test.go.
        - typo: "licence"
          correction: "licence"
        # CampMinder ships a staff-application custom field literally named
        # "App-Weakensses" (kindred#2271). It is a retired-2025 field, matched
        # literally in staff_applications.go's retiredAppFieldReasons and
        # pinned by staff_applications_test.go, so the typo is data, not a bug.
        - typo: "weakensses"
          correction: "weakensses"
    lll:
      line-length: 120
    nakedret:
      max-func-lines: 30
    dupl:
      threshold: 100
    wrapcheck:
      ignore-package-globs:
        # PocketBase router event methods (e.JSON, e.NoContent, etc.) are terminal HTTP responses
        - github.com/pocketbase/pocketbase/tools/router
        # PocketBase hook chain propagation — e.Next() passes through the middleware chain, already has context
        - github.com/pocketbase/pocketbase/tools/hook
        # CampMinder client errors are wrapped by callers (ExecuteWithRetry adds context)
        - github.com/camp/kindred/pocketbase/campminder
      ignore-sig-regexps:
        # context.Err() returns well-known sentinels (context.Canceled, context.DeadlineExceeded)
        - "context\\.Context"
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc

  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party
      - testdata
      - pb_data
      - pb_public
      - backups
      - node_modules
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - forcetypeassert
      # noctx 0.5.0 (golangci-lint 2.11) began flagging httptest.NewRequest.
      # Passing a context to a request a test constructs and serves in-process
      # buys nothing, and all 22 findings in this repo are that one message.
      # Scoped by text rather than added to the block above, so an un-contexted
      # http.Get in a test helper that talks to something real still reports.
      - path: _test\.go
        linters:
          - noctx
        text: "httptest.NewRequest"
      - path: _test\.go
        linters:
          - revive
        text: "unused-parameter"
      # Sync package name conflicts with stdlib; renaming 91 files is out of scope
      - path: sync/
        linters:
          - revive
        text: "var-naming: avoid package names"
      # Sync package has inherently complex data synchronization logic
      - path: sync/
        linters:
          - gocyclo
          - dupl
      # goconst, scoped to the package that actually earns it. 460 of the 468
      # composite-literal findings are here, and they are overwhelmingly schema
      # vocabulary -- PocketBase field and collection names (`year` x52,
      # `status` x47, `name` x39, `cm_id` x25), each universally understood at
      # its call site and no clearer behind a constant. kindred#2665 carries the
      # full distribution and the argument; kindred#2666 took the subset that is
      # a real wire contract. Kept separate from the block above because this
      # one is a backlog with an owner, not a standing property of the package.
      - path: sync/
        linters:
          - goconst

output:
  show-stats: true
