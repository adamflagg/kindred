version: "2"

run:
  go: "1.26"
  timeout: 10m
  build-tags:
    - pocketbase

linters:
  default: none
  enable:
    # Core linters
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    # Code quality
    - misspell
    - unconvert
    - whitespace
    - nakedret
    - prealloc
    - goprintffuncname
    # Additional linters
    - bodyclose
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - lll
    - revive
    # Safety linters
    - nilerr
    - noctx
    - errorlint
    - forcetypeassert
    - usetesting
    - exhaustive
    - wrapcheck

  settings:
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US
      extra-words:
        - typo: "cancelled"
          correction: "cancelled"
        # CampMinder ships a custom field literally named "Housing Accomodation"
        # (one m) alongside the correctly-spelled "Housing Accommodation". Both
        # are real field names we must match on, so the typo is data, not a bug.
        - typo: "accomodation"
          correction: "accomodation"
    lll:
      line-length: 120
    nakedret:
      max-func-lines: 30
    dupl:
      threshold: 100
    wrapcheck:
      ignore-package-globs:
        # PocketBase router event methods (e.JSON, e.NoContent, etc.) are terminal HTTP responses
        - github.com/pocketbase/pocketbase/tools/router
        # PocketBase hook chain propagation — e.Next() passes through the middleware chain, already has context
        - github.com/pocketbase/pocketbase/tools/hook
        # CampMinder client errors are wrapped by callers (ExecuteWithRetry adds context)
        - github.com/camp/kindred/pocketbase/campminder
      ignore-sig-regexps:
        # context.Err() returns well-known sentinels (context.Canceled, context.DeadlineExceeded)
        - "context\\.Context"
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc

  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party
      - testdata
      - pb_data
      - pb_public
      - backups
      - node_modules
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - forcetypeassert
      - path: _test\.go
        linters:
          - revive
        text: "unused-parameter"
      # Sync package name conflicts with stdlib; renaming 91 files is out of scope
      - path: sync/
        linters:
          - revive
        text: "var-naming: avoid package names"
      # Sync package has inherently complex data synchronization logic
      - path: sync/
        linters:
          - gocyclo
          - dupl

output:
  show-stats: true
