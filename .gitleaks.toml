# Gitleaks configuration for Kindred
# https://github.com/gitleaks/gitleaks
#
# This config allowlists known development credentials, test fixtures,
# and example data that are intentionally in the codebase.

title = "Kindred Gitleaks Config"

[extend]
# Extend the default gitleaks config
useDefault = true

[[allowlists]]
description = "Global allowlist for development and test patterns"

# Allowlist specific secret values that are intentionally public
# These are LOCAL DEVELOPMENT ONLY credentials, never used in production
regexes = [
    # Local dev PocketBase password (documented in .env.example)
    '''campbunking123''',

    # Test API keys used in unit tests
    '''test-key-\d+''',
    '''test_api_key_\d+''',
    '''fake[-_]?key''',
    '''dummy[-_]?key''',
    '''mock[-_]?key''',

    # Local dev email
    '''admin@camp\.local''',

    # Example/placeholder values
    '''your[-_].*[-_]here''',
    '''example\.com''',
    '''your[-_]?password''',
    '''changeme''',
    '''placeholder''',

    # Definition-note keys (bunking/financial_aid/definitions.py, key="..."): snake_case identifiers the
    # generic-api-key rule's entropy check trips on once a digit is in them. Exact keys only, never a pattern.
    '''\bround1_phases\b''',
]

# Allowlist paths that contain intentional test/example secrets
# NOTE: git-crypt encrypted files are dynamically added by CI from .gitattributes
paths = [
    # Test files
    '''tests/.*''',
    '''.*_test\.go$''',
    '''.*\.test\.(ts|tsx|js|jsx)$''',
    '''.*\.spec\.(ts|tsx|js|jsx)$''',
    '''.*fixtures.*''',
    '''.*__mocks__.*''',

    # Documentation with examples
    '''docs/.*''',
    '''.*\.md$''',

    # API specs with example tokens
    '''.*\.yaml$''',
    '''.*\.yml$''',

    # Example/sample files
    '''.*\.example.*''',
    '''.*\.sample.*''',

    # PocketBase internal data (should be gitignored, but just in case)
    '''pocketbase/pb_data/.*''',

    # Generated type definitions
    '''.*types\.d\.ts$''',

    # Shell scripts with dev setup
    '''scripts/.*\.sh$''',
]

# Allowlist specific commits if needed (add commit SHAs here)
# commits = []

# Stopwords - strings that if found in the secret will cause it to be ignored
stopwords = [
    "example",
    "sample",
    "test",
    "fake",
    "mock",
    "dummy",
    "placeholder",
    "localhost",
    "127.0.0.1",
]

# Definition-note keys in the financial-aid definitions registry. Each note is registered as
# `key="snake_case_identifier",` on a line of its own, and the generic-api-key rule's entropy check reads
# some of them (round1_phases, first, in 6a5e16cf) as API keys. Scoped to that one file AND that exact
# match shape, so a real credential anywhere else, or any other line in the file, is still caught.
# (Verified with gitleaks 8.30.1 in `detect` mode, the mode CI runs; `gitleaks dir` skips the AND and
# allowlists the whole file, so don't rely on this config for `dir` scans of these two files.)
[[allowlists]]
description = "Definition-note keys in bunking/financial_aid/definitions.py"
condition = "AND"
paths = ['''^bunking/financial_aid/definitions\.py$''']
regexTarget = "match"
regexes = ['''^key="[a-z][a-z0-9_]*"$''']

# Hand-written API type aliases in frontend/src/types/api-types.ts: `export type ApiX = X` lines, where the
# generic-api-key rule reads a digit-bearing alias (ApiAidRound3ApprovalIn, first in 1c2c267d) as a key.
# Same scoping: that one file AND that exact match shape.
[[allowlists]]
description = "Type aliases in frontend/src/types/api-types.ts"
condition = "AND"
paths = ['''^frontend/src/types/api-types\.ts$''']
regexTarget = "match"
regexes = ['''^Api[A-Za-z0-9]+ = [A-Za-z0-9]+$''']
