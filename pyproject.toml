[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kindred"
version = "1.0.0"
description = "Kindred finds campers who belong together and places them in the right cabins."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Kindred Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Web framework
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.1",
    # Database
    "pocketbase>=0.17.3",
    # HTTP clients
    "httpx>=0.28.1",
    "aiohttp>=3.14.3",
    "requests>=2.34.2",
    # AI/ML
    "openai>=2.53.0",
    "ortools>=9.15.6755",
    # Data processing
    "pandas>=3.0.5",
    "tzdata>=2026.3",
    "networkx>=3.6.1",
    # Configuration & validation
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3",
    # Auth
    "PyJWT[crypto]>=2.13.0",
    # CLI & utilities
    "rich>=15.0.0",
    "tqdm>=4.70.0",
    # Scheduling
    "APScheduler>=3.11.3",
    "croniter>=6.2.4",
    # File processing
    "openpyxl>=3.1.5",
    # System
    "psutil>=7.2.2",
    "rapidfuzz>=3.14.5",
    # Phonetic & fuzzy matching
    "jellyfish>=1.2.1",
    "nicknames>=1.0.1",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.15.4",
    "playwright>=1.62.0",
    # Linting & formatting
    "ruff>=0.16.0",
    # Type checking
    "mypy>=2.3.0",
    "types-requests>=2.33.0.20260712",
    "types-PyYAML>=6.0.12.20260724",
    "types-psutil>=7.2.2.20260518",
    "pandas-stubs>=3.0.5.260730",
    # Security
    "pip-audit>=2.10.1",
    # Code metrics
    "radon>=6.0.1",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bunking*", "campminder*", "config*", "scripts*"]
exclude = ["tests*", "docs*", "htmlcov*"]

[tool.ruff]
# See ruff.toml

# Native TOML configuration (pytest 9.0+)
# Note: [tool.pytest] and [tool.pytest.ini_options] cannot coexist
[tool.pytest]
minversion = "9.0"

# Strict mode - catch configuration and marker issues early
strict = true
strict_config = true
strict_markers = true

# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Command-line defaults
addopts = [
    "-v",
    "--tb=short",
    "--color=yes",
    "--strict-markers",
    "-ra",  # Show extra test summary for all except passed
]

# Markers for categorizing tests
markers = [
    "unit: Unit tests that run without external dependencies",
    "integration: Tests that require database or external services",
    "e2e: End-to-end tests",
    "performance: Performance and load tests",
    "slow: Tests that take more than 30 seconds",
    "mock: Tests that use mocks extensively",
    "requires_config: Tests that need specific config files",
    "ai_required: Tests that require AI API tokens (skip in CI)",
    "pocketbase_required: Tests that require PocketBase connection (skip in CI)",
]

# Note: For test timeouts, use pytest-timeout plugin with --timeout flag
# Note: Performance profiling scripts should be excluded with --ignore when needed

[tool.coverage.run]
source = ["scripts/sync", "bunking"]
omit = [
    "*/test/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
# docs/plans/ is gitignored local-only scratch (.gitignore:330) — working
# probe scripts that are never shipped and never imported. The pre-push hook
# runs `mypy . --explicit-package-bases`, which walks them anyway and blocks
# the push for anyone who happens to have one on disk.
exclude = "^docs/plans/"
# Strict mode - catch type errors, async/sync mismatches, missing attributes
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true

# Third-party packages without type stubs
[[tool.mypy.overrides]]
module = [
    "pocketbase.*",
    "networkx.*",
    "openai.*",
    "jellyfish.*",
    "fuzzywuzzy.*",
    "Levenshtein.*",
]
ignore_missing_imports = true

# OR-Tools 9.15 ships partial type stubs that don't cover CamelCase compat aliases
[[tool.mypy.overrides]]
module = ["ortools.*"]
follow_imports = "skip"

# Test files - allow some flexibility
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
