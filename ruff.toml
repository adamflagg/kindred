# Ruff configuration for the bunking project

# Include all Python files
include = ["*.py", "*.pyi"]

# Exclude virtual environments and build directories
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "frontend/node_modules",
    "pocketbase/pb_data",
    "scripts/archive",
    "docs/reference/skeleton-*.py",  # Documentation skeletons, not meant to run
]

# Target Python 3.14+
target-version = "py314"

# Line length
line-length = 120

# Lint configuration
[lint]
# Enable pycodestyle, pyflakes, and additional checks
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
    "T20",  # flake8-print
    "N",    # pep8-naming
    "FURB", # refurb (modernization)
    "PT",   # flake8-pytest-style
    "PERF", # perflint (performance anti-patterns)
    "DTZ",  # flake8-datetimez (timezone safety)
    "S",    # flake8-bandit (security)
    "PLC0415", # import-outside-toplevel (catches new sloppy in-function imports)
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B007",  # unused-loop-control-variable (fix as you go, not critical)
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends pattern)
    "B017",  # assert-raises-exception (acceptable in test contexts)
    "B904",  # raise-without-from-inside-except (noisy for HTTPException pattern)
    "SIM102", # collapsible-if (readability preference, not a bug)
    "SIM105", # try-except-pass vs contextlib.suppress (style preference)
    "SIM108", # if-else-block-instead-of-if-exp (readability preference)
    "SIM117", # multiple-with-statements (readability preference)
    "RUF001", # ambiguous-unicode-character-string (deliberate × symbol)
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "DTZ007", # strptime without %z - codebase uses naive datetimes for date-only arithmetic
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Per-file ignores
[lint.per-file-ignores]
# Tests use late imports for mock-after-import-time and conditional skip imports — PLC0415 ignored.
"tests/**/*.py" = ["E402", "T201", "N806", "RUF005", "RUF059", "S101", "S105", "S106", "S107", "S108", "S110", "S112", "S113", "S311", "S324", "S603", "S607", "DTZ001", "DTZ005", "PT011", "PERF401", "PLC0415"]
"scripts/**/*.py" = ["T20", "S", "DTZ005", "PERF401", "N999"]  # N999: script names can have hyphens (not Python module names)
"scripts/cleanup_orphaned_configs.py" = ["E402"]
"scripts/populate_new_solver_config.py" = ["E402"]
"test_solver_hang.py" = ["E402"]
"test_solver_without_isolation.py" = ["E402"]
"docs/**/*.py" = ["S"]
"api/services/test_*.py" = ["S101", "DTZ005", "PLC0415"]  # Co-located tests — same late-import policy as tests/
"bunking/sync/bunk_request_processor/resolution/strategies/school_disambiguation.py" = ["S101"]
"bunking/sync/bunk_request_processor/processing/deduplicator.py" = ["S101"]
"api/services/metrics_sql_repository.py" = ["S608"]  # f-string SQL uses parameterized ?'s only

# Allow fix for all enabled rules when using --fix
fixable = ["ALL"]
unfixable = []

# Configure import sorting
[lint.isort]
known-first-party = ["bunking", "campminder", "data", "exports", "analysis", "config"]

# Format configuration (ruff format replaces Black)
[format]
# Use double quotes for strings (consistent with project style)
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Auto-detect line ending style
line-ending = "auto"
