# Kindred Multi-Container CI Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

services:
  pocketbase:
    environment:
      - SKIP_CAMPMINDER=true
  init:
    environment:
      - AUTH_MODE=bypass
  api:
    environment:
      - AUTH_MODE=bypass
      - CI=true
      - GITHUB_ACTIONS=true
  caddy:
    ports:
      - "8080:8080"
    labels: []
    networks:
      - kindred-internal
      - kindred-ci

networks:
  kindred-ci:
    driver: bridge
  # Override web-proxy from base file to not be external
  # Must explicitly set external: false (compose merges properties, not replaces)
  web-proxy:
    external: false
