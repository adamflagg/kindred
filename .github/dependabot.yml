# Dependabot version updates configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Security: cooldown delays updates by 3 days after publication, giving the
# community time to catch compromised releases before auto-merge picks them up.

# Commit-message prefixes type a bump by what it changes, never as `fix`: a
# bump is not a bug fix, and typing them `fix` put 18 of v6.3.0's 50 "Bug
# Fixes" here. `build(deps)` for what ships in an image (a patch release,
# "Build" in the changelog), `chore(deps)` for dev-only tooling (skipped from
# the changelog), `ci(deps)` for Actions. Always the `deps` scope, whatever the
# ecosystem. tests/unit/scripts/test_commit_type_config.py holds this.

version: 2
updates:
  # Python dependencies.
  #
  # `uv`, NOT `pip`. The pip ecosystem edits pyproject.toml and does not know
  # `uv.lock` exists, so every bump raised the declared floor and left the lock
  # pinned to the old version. CI and CD install with `uv sync --frozen`, which
  # applies the lock WITHOUT validating it against pyproject.toml -- so those
  # bumps changed the manifest and not one byte of what actually runs, silently.
  # Five packages had drifted this way by 1e56a3ae, including an aiohttp bump
  # merged as `fix(deps)`. See #1864.
  #
  # The uv ecosystem updates pyproject.toml and uv.lock together, which removes
  # the cause rather than the symptom.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      # Group all production dependencies together
      python-prod:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest*"
          - "ruff"
          - "mypy*"
          - "coverage*"
          - "pip-audit"
          - "playwright"
          - "radon"
          - "types-*"
        update-types:
          - "minor"
          - "patch"
      # Group all dev/test dependencies together
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy*"
          - "coverage*"
          - "pip-audit"
          - "playwright"
          - "radon"
          - "types-*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5

  # Go dependencies (pocketbase)
  - package-ecosystem: "gomod"
    directory: "/pocketbase"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "chore(deps)"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5

  # PocketBase npm dependencies (JS migrations + eslint)
  - package-ecosystem: "npm"
    directory: "/pocketbase"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    commit-message:
      # pocketbase/package.json holds devDependencies only (eslint); nothing
      # here reaches the image, so a bump is dev tooling either way.
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      pb-npm:
        patterns:
          - "*"
        exclude-patterns:
          - "eslint"
          - "@eslint/*"
        update-types:
          - "minor"
          - "patch"
      pb-eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # All minor/patch updates in one PR to avoid package-lock.json conflicts.
      # The lockstep families below are excluded so they group on ALL update
      # types, majors included -- see the comment on them.
      npm-all:
        patterns:
          - "*"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
      # Lockstep families. Each of these pins its siblings to an EXACT version
      # (e.g. @vitest/coverage-v8@5.0.0 requires vitest@"5.0.0"), so a major
      # split across separate PRs produces N PRs that each fail `npm ci` with
      # ERESOLVE and can never merge in any order. Omitting `update-types`
      # makes the group cover every type, so a major arrives as one installable
      # PR. Same shape as pb-eslint in the /pocketbase ecosystem above.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
      typescript-eslint:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5

  # Root npm dependencies (commitlint, cytoscape types)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      root-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "docker"
    # Go minor bumps start at pocketbase/go.mod, by hand: it picks the minor and
    # every build uses the latest patch of it. The golang stages float on
    # `golang:X.Y-<variant>`, so a patch needs no PR, and a minor bump here alone
    # would fail scripts/ci/check-go-version-alignment.sh, which enforces the
    # rest (go.work, docker/healthcheck/go.mod, every golang stage, setup-go).
    ignore:
      - dependency-name: "golang"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
