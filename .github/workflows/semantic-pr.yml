name: Semantic PR Title

# The PR title becomes the squash commit on main, so it is the commit message
# that picks the changelog group and the version bump. This check lints it with
# commitlint.config.js -- the same config the local commit-msg hook uses -- so
# there is one list of types and scopes, not a copy here that drifts. The old
# check kept its own list and never applied commitlint's length or full-stop
# rules to a title at all.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      # The `type-override` label waives the type-vs-files step; adding or
      # removing it must re-run the check.
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read  # the type-vs-files step lists the PR's changed files

jobs:
  lint-title:
    # The ruleset requires a status check with exactly this name. Renaming the
    # job does not fail anything -- it leaves every PR waiting on a check that
    # never reports.
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install commitlint
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Lint the PR title
      env:
        # A title is attacker-controlled text: it reaches the shell through the
        # environment, never through expression interpolation inside `run:`.
        PR_TITLE: ${{ github.event.pull_request.title }}
        # Lets commitlint.config.js skip its bot-bump ignore for everyone else.
        # Derived from the author's account type, not from anything they typed.
        PR_AUTHOR_IS_BOT: ${{ github.event.pull_request.user.type == 'Bot' }}
      run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose

    - name: Hold the type to the changed files
      # When every changed file is CI machinery, agent tooling or tests, the type
      # must say so (scripts/ci/check_title_type.py). Anything else is left to
      # judgment. The `type-override` label waives it.
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      # Explicit `shell: bash` is what turns on pipefail. Without it, a failed
      # `gh api` feeds the checker an empty list, which decides nothing: a pass.
      shell: bash
      run: |
        gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' \
          | python3 scripts/ci/check_title_type.py

    # Lives in this job, not in ci.yml, because this workflow re-runs when a PR
    # body is edited (`edited`) and ci.yml does not -- and the body becomes the
    # squash commit message on main, so a private name written there lands in
    # the public history. Title, body and commit messages are scanned for the
    # guide repo's name (GUIDE_REPO secret); only WHICH part matched is printed.
    # Fork and Dependabot PRs get no secret, so it skips with a notice.
    - name: No private names in the PR's text
      env:
        GUIDE_REPO: ${{ secrets.GUIDE_REPO }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      # Title and body are read from the event payload at run time, never from
      # `env:`, whose values print in the public log header. `shell: bash`
      # turns on pipefail, so a failed `gh api` cannot read as an empty list.
      shell: bash
      run: |
        terms="$RUNNER_TEMP/pr-text-terms"
        : > "$terms"
        if [ -n "$GUIDE_REPO" ]; then
          printf '%s\n%s\n' "$GUIDE_REPO" "${GUIDE_REPO#*/}" >> "$terms"
        fi
        PR_TEXT_TERMS_FILE="$terms" bash scripts/ci/check-pr-text-private-names.sh
