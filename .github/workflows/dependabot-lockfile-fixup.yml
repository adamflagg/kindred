name: Dependabot Lock File Fix-up

# Dependabot sometimes updates direct dependencies without fully regenerating
# the lock file's transitive dependency tree. This causes version mismatches
# (e.g., @tanstack/react-query 5.91 expecting query-core 5.91, but lock file
# still pinning query-core 5.90). This workflow detects and fixes that.

on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: write
  pull-requests: read

jobs:
  fixup:
    name: Fix Lock Files
    if: github.actor == 'dependabot[bot]' || startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout Dependabot branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.head_ref }}
          # RELEASE_TOKEN (PAT) instead of GITHUB_TOKEN so that the push
          # triggers downstream workflows (CI). GITHUB_TOKEN pushes are
          # silently ignored by GitHub Actions to prevent infinite loops.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Regenerate npm lock files
        id: npm-fixup
        run: |
          changed=false

          for dir in frontend pocketbase .; do
            lockfile="$dir/package-lock.json"
            [ -f "$lockfile" ] || continue

            echo "=== Checking $dir ==="

            # npm install --package-lock-only doesn't always catch transitive
            # version mismatches (e.g., react-query@5.94 wanting query-core@5.94
            # but lockfile still pinning query-core@5.90). Delete and regenerate
            # from scratch to guarantee a fully resolved tree.
            (cd "$dir" && rm package-lock.json && npm install --package-lock-only --ignore-scripts)
            if git diff --quiet -- "$lockfile"; then
              echo "✅ $dir: lock file is consistent"
            else
              echo "⚠️  $dir: lock file was stale, regenerated"
              changed=true
            fi
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Regenerate uv.lock
        id: uv-fixup
        run: |
          changed=false

          if [ -f uv.lock ]; then
            echo "=== Checking uv.lock ==="

            # --locked fails if uv.lock is out of sync with pyproject.toml
            if uv lock --locked; then
              echo "✅ uv.lock is consistent"
            else
              echo "⚠️  uv.lock inconsistent, regenerating..."
              uv lock
              changed=true
            fi
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push fixes
        if: steps.npm-fixup.outputs.changed == 'true' || steps.uv-fixup.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage each lock file individually — git add fails entirely if any
          # pathspec doesn't match, so we can't combine them in one command
          git add uv.lock 2>/dev/null || true
          git add package-lock.json 2>/dev/null || true
          git add */package-lock.json 2>/dev/null || true

          # Safety: exit cleanly if nothing was staged despite detection
          if git diff --cached --quiet; then
            echo "No lock file changes to commit"
            exit 0
          fi
          git commit -m "fix(deps): regenerate lock files for consistency

          Dependabot updated direct dependencies but the lock file's transitive
          dependency tree was stale. Regenerated to resolve version mismatches."

          git push
