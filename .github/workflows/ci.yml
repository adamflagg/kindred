name: CI - Tests & Linting

on:
  # Allow manual triggering
  workflow_dispatch:
  # Run on pushes to main only (feature branches use pull_request trigger)
  push:
    branches:
      - main
    tags-ignore:
      - '**'  # Skip CI on tag pushes (already tested on branch)
  # Run on pull requests targeting main (covers all feature branch pushes)
  # Note: No paths-ignore here - we need CI Summary to always report for branch protection
  # The detect-changes job handles optimization by skipping jobs when only docs change
  pull_request:
    branches: [main]

# Permissions needed for Dependabot PRs (paths-filter needs to read commits)
permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR title is the only commit message gate that matters: squash merge uses
  # the PR title as the commit message on main, so per-commit lint on PR
  # branches is dead weight (commits get collapsed). Local lefthook
  # commit-msg hook still runs for human discipline.
  pr-title-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          perf
          refactor
          docs
          style
          test
          build
          config
          chore
          ci
          revert
        scopes: |
          frontend
          api
          sync
          pb
          solver
          docker
          ci
          auth
          google
          security
          logging
          release
          config
          deps
          deps-dev
          tests
          scripts
          docs
          metrics
          graph
          data
          rbac
        requireScope: true
        subjectPattern: ^.+$
        subjectPatternError: "PR title must follow: type(scope): description"

  # Detect what changed to optimize CI runs
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
      migrations: ${{ steps.filter.outputs.migrations }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docker: ${{ steps.filter.outputs.docker }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Check for file changes
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
      id: filter
      with:
        filters: |
          backend:
            - 'api/**/*.py'
            - 'bunking/**/*.py'
            - 'campminder/**'
            - 'pocketbase/**'
            - 'scripts/**/*.py'
            - 'pyproject.toml'
            - 'ruff.toml'
            - 'uv.lock'
            - 'go.mod'
            - 'go.sum'
            - '.golangci.yml'
          python:
            - 'api/**/*.py'
            - 'bunking/**/*.py'
            - 'campminder/**/*.py'
            - 'scripts/**/*.py'
            - 'pyproject.toml'
            - 'ruff.toml'
            - 'uv.lock'
            - 'tests/**'
            - 'conftest.py'
          go:
            - 'pocketbase/**/*.go'
            - 'go.mod'
            - 'go.sum'
            - '.golangci.yml'
          migrations:
            - 'pocketbase/pb_migrations/**'
            - 'pocketbase/main.go'
            - 'scripts/ci/validate_migrations.py'
          frontend:
            - 'frontend/**'
            - 'package*.json'
            - 'tsconfig*.json'
          scripts:
            - 'scripts/**/*.sh'
            - '.shellcheckrc'
          docker:
            - 'docker/**'
            - 'docker-compose*.yml'
            - '.hadolint.yaml'
          actions:
            - '.github/workflows/**'
            - '.github/actions/**'
            - 'zizmor.yml'

  # Secret scanning (runs unconditionally on all pushes/PRs)
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0  # Full history for better scanning
        persist-credentials: false

    - name: Install gitleaks
      run: |
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz | \
          sudo tar xz -C /usr/local/bin gitleaks

    - name: Run Gitleaks
      run: gitleaks detect --source . --config .gitleaks.toml --verbose

  # Python linting (parallel with other lint jobs)
  python-lint:
    name: Python Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true

    - name: Install Python dependencies
      run: uv sync --frozen

    - name: Python formatting check
      run: uv run ruff format --check .

    - name: Python linting
      run: uv run ruff check .

    - name: Python type check (mypy)
      run: uv run mypy . --explicit-package-bases

    - name: Security audit (pip-audit)
      run: |
        ARGS="--desc"
        while IFS= read -r line; do
          id="${line%%#*}"
          id="${id// /}"
          [ -n "$id" ] && ARGS="$ARGS --ignore-vuln $id"
        done < .pip-audit-ignore
        uv run pip-audit $ARGS

    - name: JSON config validation
      run: |
        echo "Validating JSON config files..."
        for f in config/*.json bunking/*.json; do
          if [ -f "$f" ]; then
            python -m json.tool "$f" > /dev/null && echo "✓ $f" || { echo "✗ $f is invalid JSON"; exit 1; }
          fi
        done

  # Go linting (parallel with other lint jobs)
  go-lint:
    name: Go Lint
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.scripts == 'true' ||
      needs.detect-changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: pocketbase/package-lock.json

    - name: Setup Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.26.3'
        cache: true
        cache-dependency-path: pocketbase/go.sum

    - name: Cache apt packages
      uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
      with:
        packages: shellcheck
        version: shellcheck-v1

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Go formatting check
      if: needs.detect-changes.outputs.backend == 'true'
      run: |
        if [ -n "$(gofmt -l pocketbase)" ]; then
          echo "Go files need formatting. Please run: gofmt -w pocketbase"
          gofmt -d pocketbase
          exit 1
        fi

    - name: Go vet
      if: needs.detect-changes.outputs.backend == 'true'
      working-directory: ./pocketbase
      run: go vet ./...

    - name: Go linting
      if: needs.detect-changes.outputs.backend == 'true'
      uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
      with:
        version: v2.9.0
        working-directory: pocketbase
        args: --config ../.golangci.yml

    - name: Go build check
      if: needs.detect-changes.outputs.backend == 'true'
      working-directory: ./pocketbase
      run: go build -o /dev/null ./...

    - name: Security audit (govulncheck)
      if: needs.detect-changes.outputs.backend == 'true'
      working-directory: ./pocketbase
      run: govulncheck ./...

    # PocketBase JS linting (migrations and hooks)
    - name: Install PocketBase JS linting dependencies
      if: needs.detect-changes.outputs.backend == 'true'
      working-directory: ./pocketbase
      run: npm ci

    - name: PocketBase JS linting
      if: needs.detect-changes.outputs.backend == 'true'
      working-directory: ./pocketbase
      run: npm run lint

    # Shell script linting (warning+ severity - info is too noisy)
    - name: Shell script linting (shellcheck)
      if: needs.detect-changes.outputs.scripts == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.docker == 'true'
      run: |
        echo "Checking shell scripts..."
        find scripts/ docker/ frontend/ tests/shell/ -maxdepth 3 \( -name '*.sh' -o -name 'pre-*' -o -name 'post-*' \) -print0 | \
          xargs -0 shellcheck --severity=warning

  # Frontend linting (parallel with other lint jobs)
  frontend-lint:
    name: Frontend Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: TypeScript type check
      working-directory: ./frontend
      run: npm run type-check

    - name: Prettier formatting check
      working-directory: ./frontend
      run: npm run format:check

    - name: TypeScript linting
      working-directory: ./frontend
      run: npm run lint

    - name: Security audit (npm)
      working-directory: ./frontend
      run: npm audit --audit-level=high

  # Docker linting (parallel with other lint jobs)
  docker-lint:
    name: Docker Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    # Dockerfile linting — mounts .hadolint.yaml so CI matches local (lefthook) config
    # Each file needs its own docker run because hadolint reads from stdin (< "$df")
    - name: Dockerfile linting (hadolint)
      run: |
        for df in docker/Dockerfile.api docker/Dockerfile.caddy docker/Dockerfile.pocketbase docker/Dockerfile.init; do
          echo "=== Linting $df ==="
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml" hadolint/hadolint < "$df"
        done

    # Caddyfile validation (stdin, no mounts - avoids self-hosted runner volume mount issues).
    # Both Caddyfiles use only stock directives now (rate-limit delegated to Traefik).
    - name: Caddyfile validation
      run: |
        docker run --rm -i caddy:2 caddy adapt --adapter caddyfile --config - < docker/Caddyfile > /dev/null
        docker run --rm -i caddy:2 caddy adapt --adapter caddyfile --config - < frontend/Caddyfile > /dev/null

  # GitHub Actions security and correctness linting
  security-lint:
    name: Actions Security Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Install and run actionlint
      run: |
        bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        echo "=== actionlint ==="
        ./actionlint -shellcheck="" -color

    - name: Install and run zizmor
      run: |
        pipx run zizmor --config zizmor.yml --min-severity medium .

  # Python tests (parallel)
  tests-python:
    name: Python Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true

    - name: Install Python dependencies
      run: uv sync --frozen

    - name: Create logs directory
      run: mkdir -p logs

    - name: Run Python unit tests (no external deps)
      env:
        SKIP_POCKETBASE_TESTS: true
      run: uv run pytest tests/unit/ -v --tb=short --ignore=tests/unit/api/

  # Go tests (parallel)
  tests-go:
    name: Go Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.26.3'
        cache: true
        cache-dependency-path: pocketbase/go.sum

    - name: Run Go tests
      working-directory: ./pocketbase
      run: go test -race ./... -v

  # Migration smoke test — catches schema/binary issues against a fresh DB
  tests-migrations:
    name: Migration Smoke Test
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.migrations == 'true' ||
      needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.26.3'
        cache: true
        cache-dependency-path: pocketbase/go.sum

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version-file: '.python-version'

    - name: Migration smoke test (fresh database)
      working-directory: ./pocketbase
      run: |
        echo "Building PocketBase..."
        go build -o pocketbase .

        echo "Testing migrations on fresh database..."
        # Use local test data directory so PocketBase discovers migrations via default path:
        # ./pb_test_data/../pb_migrations = ./pb_migrations
        rm -rf ./pb_test_data
        mkdir -p ./pb_test_data
        echo "Migrations directory contents:"
        ls -la pb_migrations/ | head -10

        # Run migrations (PocketBase auto-discovers ./pb_migrations from ./pb_test_data)
        echo "Running migrations..."
        ./pocketbase migrate up --dir ./pb_test_data 2>&1 | tee /tmp/pb_migrate.log

        echo "Starting PocketBase server..."
        ./pocketbase serve --dir ./pb_test_data --http 127.0.0.1:18999 > /tmp/pb_output.log 2>&1 &
        PB_PID=$!

        # Wait for startup (max 30s)
        for i in {1..30}; do
          if curl -sf http://127.0.0.1:18999/api/health >/dev/null 2>&1; then
            echo "✅ PocketBase started successfully - migrations applied"
            break
          fi
          # Check if process died (migration error)
          if ! kill -0 $PB_PID 2>/dev/null; then
            echo "❌ PocketBase crashed during startup - migration error:"
            echo "----------------------------------------"
            cat /tmp/pb_output.log
            echo "----------------------------------------"
            rm -rf ./pb_test_data
            exit 1
          fi
          sleep 1
        done

        # Check if PB is running after timeout
        if ! curl -sf http://127.0.0.1:18999/api/health >/dev/null 2>&1; then
          echo "❌ PocketBase failed to start within 30s:"
          echo "----------------------------------------"
          cat /tmp/pb_output.log
          echo "----------------------------------------"
          kill $PB_PID 2>/dev/null || true
          rm -rf ./pb_test_data
          exit 1
        fi

        # Create temporary superuser via CLI (required for fresh DB in PB v0.23+)
        echo "Creating temporary superuser for schema validation..."
        ./pocketbase superuser upsert ci@test.local ci_test_pass_123 --dir ./pb_test_data

        # Get auth token
        AUTH_TOKEN=$(curl -sf -X POST http://127.0.0.1:18999/api/collections/_superusers/auth-with-password \
          -H "Content-Type: application/json" \
          -d '{"identity":"ci@test.local","password":"ci_test_pass_123"}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")

        if [ -z "$AUTH_TOKEN" ]; then
          echo "❌ Failed to authenticate for schema validation"
          kill $PB_PID 2>/dev/null || true
          rm -rf ./pb_test_data
          exit 1
        fi

        # Validate schema via API
        echo "Validating migration schema..."
        curl -sf http://127.0.0.1:18999/api/collections \
          -H "Authorization: Bearer $AUTH_TOKEN" \
          > /tmp/collections.json

        set +e
        python3 ../scripts/ci/validate_migrations.py /tmp/collections.json
        VALIDATION_RESULT=$?
        set -e

        if [ $VALIDATION_RESULT -ne 0 ]; then
          echo "❌ Schema validation failed"
          echo "Migration log:"
          cat /tmp/pb_migrate.log || true
          echo "PocketBase output log:"
          cat /tmp/pb_output.log || true
          # Cleanup
          kill $PB_PID 2>/dev/null || true
          rm -rf ./pb_test_data
          exit 1
        fi

        # Cleanup on success
        kill $PB_PID 2>/dev/null || true
        rm -rf ./pb_test_data

        echo "✅ Migration smoke test passed"

  # Frontend tests (parallel)
  tests-frontend:
    name: Frontend Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm run test -- --run

  # Summary job - gate for PR merges
  summary:
    name: CI Summary
    needs: [pr-title-lint, detect-changes, secret-scan, python-lint, go-lint, frontend-lint, docker-lint, security-lint, tests-python, tests-go, tests-migrations, tests-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check status
      env:
        DETECT_CHANGES: ${{ needs.detect-changes.result }}
        PR_TITLE_LINT: ${{ needs.pr-title-lint.result }}
        SECRET_SCAN: ${{ needs.secret-scan.result }}
        PYTHON_LINT: ${{ needs.python-lint.result }}
        GO_LINT: ${{ needs.go-lint.result }}
        FRONTEND_LINT: ${{ needs.frontend-lint.result }}
        DOCKER_LINT: ${{ needs.docker-lint.result }}
        SECURITY_LINT: ${{ needs.security-lint.result }}
        TESTS_PYTHON: ${{ needs.tests-python.result }}
        TESTS_GO: ${{ needs.tests-go.result }}
        TESTS_MIGRATIONS: ${{ needs.tests-migrations.result }}
        TESTS_FRONTEND: ${{ needs.tests-frontend.result }}
      run: |
        # detect-changes: blocking — if this fails, all conditional jobs are skipped
        # and CI passes with zero validation (the paths-filter incident of March 2026)
        if [ "$DETECT_CHANGES" != "success" ]; then
          echo "::error::Change detection failed — no lint or test jobs ran. Check paths-filter action."
          exit 1
        fi
        # pr-title-lint: blocking — squash merge uses PR title as commit message on main
        if [ "$PR_TITLE_LINT" != "success" ] && [ "$PR_TITLE_LINT" != "skipped" ]; then
          echo "::error::PR title must follow conventional commit format: type(scope): description"
          exit 1
        fi
        if [ "$SECRET_SCAN" != "success" ]; then
          echo "Secret scanning failed! Check for leaked credentials."
          echo "   If these are intentional dev/test values, add them to .gitleaks.toml"
          exit 1
        fi
        # Lint jobs: success or skipped (when no relevant changes)
        if [ "$PYTHON_LINT" != "success" ] && [ "$PYTHON_LINT" != "skipped" ]; then
          echo "Python linting/type checks failed!"
          exit 1
        fi
        if [ "$GO_LINT" != "success" ] && [ "$GO_LINT" != "skipped" ]; then
          echo "Go linting failed!"
          exit 1
        fi
        if [ "$FRONTEND_LINT" != "success" ] && [ "$FRONTEND_LINT" != "skipped" ]; then
          echo "Frontend linting/type checks failed!"
          exit 1
        fi
        if [ "$DOCKER_LINT" != "success" ] && [ "$DOCKER_LINT" != "skipped" ]; then
          echo "Docker linting failed!"
          exit 1
        fi
        if [ "$SECURITY_LINT" != "success" ] && [ "$SECURITY_LINT" != "skipped" ]; then
          echo "Actions security lint failed!"
          exit 1
        fi
        if [ "$TESTS_PYTHON" != "success" ] && [ "$TESTS_PYTHON" != "skipped" ]; then
          echo "Python tests failed!"
          exit 1
        fi
        if [ "$TESTS_GO" != "success" ] && [ "$TESTS_GO" != "skipped" ]; then
          echo "Go tests failed!"
          exit 1
        fi
        if [ "$TESTS_MIGRATIONS" != "success" ] && [ "$TESTS_MIGRATIONS" != "skipped" ]; then
          echo "Migration smoke test failed!"
          exit 1
        fi
        if [ "$TESTS_FRONTEND" != "success" ] && [ "$TESTS_FRONTEND" != "skipped" ]; then
          echo "Frontend tests failed!"
          exit 1
        fi
        echo "All CI checks passed!"
