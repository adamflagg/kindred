name: CI - Tests & Linting

on:
  # Allow manual triggering
  workflow_dispatch:
  # Run on pushes to main only (feature branches use pull_request trigger)
  push:
    branches:
      - main
    tags-ignore:
      - '**'  # Skip CI on tag pushes (already tested on branch)
  # Run on pull requests targeting main (covers all feature branch pushes)
  # Note: No paths-ignore here - we need CI Summary to always report for branch protection
  # The detect-changes job handles optimization by skipping jobs when only docs change
  pull_request:
    branches: [main]

# Permissions needed for Dependabot PRs (paths-filter needs to read commits)
permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR title is the only commit message gate that matters: squash merge uses
  # the PR title as the commit message on main, so per-commit lint on PR
  # branches is dead weight (commits get collapsed). Local lefthook
  # commit-msg hook still runs for human discipline.
  pr-title-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          perf
          refactor
          docs
          style
          test
          build
          config
          chore
          ci
          revert
        scopes: |
          frontend
          api
          sync
          pb
          solver
          docker
          ci
          auth
          google
          security
          logging
          release
          config
          deps
          deps-dev
          tests
          scripts
          docs
          metrics
          graph
          data
          rbac
        requireScope: true
        subjectPattern: ^.+$
        subjectPatternError: "PR title must follow: type(scope): description"

  # Detect what changed to optimize CI runs
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      goLint: ${{ steps.filter.outputs.goLint }}
      python: ${{ steps.filter.outputs.python }}
      pythonLint: ${{ steps.filter.outputs.pythonLint }}
      go: ${{ steps.filter.outputs.go }}
      migrations: ${{ steps.filter.outputs.migrations }}
      frontendLint: ${{ steps.filter.outputs.frontendLint }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shell: ${{ steps.filter.outputs.shell }}
      guardSelfTests: ${{ steps.filter.outputs.guardSelfTests }}
      dockerLint: ${{ steps.filter.outputs.dockerLint }}
      docker: ${{ steps.filter.outputs.docker }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check for file changes
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      id: filter
      with:
        filters: |
          # go-lint's inputs, which are NOT the Python tree. It used to gate on
          # `backend`, a filter carrying api/**/*.py, bunking/**/*.py, ruff.toml
          # and uv.lock -- none of which any go-lint step reads -- so a
          # Python-only PR ran gofmt, go vet, golangci-lint, go build,
          # govulncheck and the PocketBase JS lint for nothing. And `backend`
          # matched no workflow file, so a PR editing only go-lint shipped
          # having never run it: kindred#2680 touched only ci.yml and tests/,
          # and reported `Go Lint: skipping` (merge commit 305fc137). A job that
          # cannot be triggered goes *skipped*, and ci-summary counts skipped as
          # OK. kindred#2663, same family as kindred#2653.
          goLint:
            # The whole module: gofmt/vet/golangci-lint/build/govulncheck run
            # over it, and `npm run lint` (= `eslint pb_migrations pb_hooks`)
            # reads eslint.config.js and both npm manifests, which live here
            # too. go.mod/go.sum are covered by this, not by any '**/*.go'.
            - 'pocketbase/**'
            # `go vet ./...` loads the WORKSPACE before it vets anything, so a
            # go.work-only change is a real input. go.work.sum is deliberately
            # absent: it is untracked, and a filter entry matching nothing is
            # what made the old root go.mod/go.sum entries look like coverage.
            - 'go.work'
            # The other workspace module's manifest. A `go` directive bumped
            # here -- or a deleted go.mod -- hard-fails every Go command inside
            # pocketbase/ with `requires go >= X (GOTOOLCHAIN=local)`. Its .go
            # sources are NOT listed: no go-lint step is scoped outside
            # pocketbase/, which is a recorded decision, see .golangci.yml.
            - 'docker/healthcheck/go.mod'
            # `Setup Node.js` carries NO `if:`, so it runs whenever the job does,
            # and node-version-file: '.nvmrc' picks the Node that then runs
            # `npm ci` and `npm run lint`. Nothing in this workflow matched
            # .nvmrc at all -- while .python-version matched three filters -- so
            # a Renovate nvm bump (renovate.json enables the `nvm` manager, and
            # .nvmrc has been bumped before) triggered no job that validates a
            # toolchain. `frontend` lists it too, for the surface it really
            # governs.
            - '.nvmrc'
            # Passed explicitly as `--config ../.golangci.yml`.
            - '.golangci.yml'
            # And the job's own definition: the gate, the eight step-level
            # `if:`s, the pinned golangci-lint version and the shellcheck
            # invocation all live here. Same reasoning and the same accepted
            # cost as the `go` filter below.
            - '.github/workflows/ci.yml'
          python:
            - 'api/**/*.py'
            - 'bunking/**/*.py'
            - 'campminder/**/*.py'
            - 'scripts/**/*.py'
            - 'pyproject.toml'
            - 'ruff.toml'
            - 'uv.lock'
            - 'tests/**'
            - 'conftest.py'
            - '.python-version'
            # The filter assertions in tests/unit/scripts/ read this file: they
            # are what stops a job's gate from drifting away from its own
            # inputs. Without this line, editing only ci.yml -- exactly the
            # change they police -- runs none of them. Same reasoning, and the
            # same accepted cost, as the `go` filter below. kindred#2653.
            - '.github/workflows/ci.yml'
            # And the Go lint config, for the same reason. `test_golangci_config.py`
            # (kindred#2671) asserts goconst is not disabled tree-wide and that its
            # path exclusions name exactly the packages we said they could -- but it
            # runs in tests-python, which watched no Go config, so a PR editing ONLY
            # this file ran none of the assertions that police it. #2671 escaped that
            # only because it also touched 'tests/**'. kindred#2663.
            - '.golangci.yml'
          # python-lint's inputs, which are a superset of the Python sources.
          # It used to gate on `backend`, a filter meant for another job: that
          # has no 'tests/**', so none of the 507 tracked test files could
          # trigger `ruff format --check .`, `ruff check .` or `mypy .`, and a
          # tests-only PR shipped unchecked -- observed live on kindred#2652,
          # which added four Python tests and reported `Python Lint: skipping`.
          # `backend` also bundles 'pocketbase/**', so a Go-only PR ran the full
          # Python lint job for nothing. kindred#2653.
          pythonLint:
            # ruff and mypy run over the whole tree, so every tracked .py must
            # be able to trigger them.
            - 'api/**/*.py'
            - 'bunking/**/*.py'
            - 'campminder/**/*.py'
            - 'scripts/**/*.py'
            - 'tests/**'
            - 'conftest.py'
            # Stubs are linted too: ruff.toml declares
            # `include = ["*.py", "*.pyi"]` and mypy reads .pyi natively. None
            # are tracked today -- this is here so the FIRST one added can
            # trigger the job, the same reasoning as 'bunking/*.json' below.
            # Unscoped because `ruff check .` and `mypy .` run from the repo
            # root, so a stub anywhere in the tree is a real input.
            - '**/*.pyi'
            # What the linters and the dependency audit are configured by.
            - 'pyproject.toml'
            - 'ruff.toml'
            - 'uv.lock'
            - '.python-version'
            # The `JSON config validation` step reads exactly these two globs.
            - 'config/*.json'
            - 'bunking/*.json'
            # The pip-audit step's ignore list: adding an ignored CVE has to be
            # able to re-run the audit that consumes it.
            - '.pip-audit-ignore'
            # And the job's own definition.
            - '.github/workflows/ci.yml'
          go:
            - 'pocketbase/**/*.go'
            # The module files, at their real path. These used to read 'go.mod'
            # and 'go.sum' -- the repo root, where no Go module has ever lived.
            # Only go.work sits there; the module is pocketbase/go.mod. So the
            # filter looked like it watched the module and matched nothing, and
            # a dependency bump -- which by definition changes no .go file --
            # left tests-go *skipped*, which the summary gate counts as OK.
            # kindred#2629 (PocketBase 0.39.11 -> 0.40.1: minimum Go to 1.27 and
            # the whole codebase onto encoding/json/v2, which upstream says not
            # to ship blindly) reached review having run zero Go tests.
            - 'pocketbase/go.mod'
            - 'pocketbase/go.sum'
            # go.work carries its own `go` directive, and it must be >= the one
            # in pocketbase/go.mod or every Go command fails to even load the
            # workspace. That is a Go-toolchain input like the module files.
            - 'go.work'
            - '.golangci.yml'
            # The sharder decides which tests run at all, so a change to it must
            # run them -- otherwise it ships without ever executing a Go test.
            # Same reasoning as validate_migrations.py under `migrations` below.
            - 'scripts/ci/go_test_shard.py'
            # And the same again for this file, which holds the shard count, the
            # shard args and the go flags. Without it, a PR that only widens the
            # matrix or edits `-race` leaves tests-go *skipped* -- and the summary
            # gate counts skipped as OK, so the new config ships having run zero
            # Go tests. Costs ~22 extra runs a quarter (measured over 90 days:
            # 24 commits touched ci.yml, only 2 of them alongside a .go change).
            - '.github/workflows/ci.yml'
          migrations:
            - 'pocketbase/pb_migrations/**'
            - 'pocketbase/main.go'
            - 'scripts/ci/validate_migrations.py'
            - '.python-version'
            # tests-migrations' `Setup Node.js` carries NO `if:`, so it runs
            # whenever the job does, and node-version-file: '.nvmrc' picks the
            # Node that then runs the pocketbase-types freshness check. It was
            # the fourth of the four .nvmrc-reading jobs and the only one still
            # unmatched after kindred#2682 -- its gate is `migrations || go`,
            # and neither carried .nvmrc. Same reasoning as `goLint` above.
            - '.nvmrc'
            # The four below are the remaining inputs to the pocketbase-types
            # freshness check (kindred#2278), which runs in tests-migrations.
            # Same reasoning as scripts/ci/validate_migrations.py above and
            # scripts/ci/go_test_shard.py under `go`: this job's `if:` reads
            # only `migrations` and `go`, and the summary gate counts a
            # skipped job as OK, so anything that can change the check's
            # verdict has to be able to trigger it. A migration is only the
            # most obvious way pocketbase-types.ts goes stale, not the only
            # one.
            #
            #   generate-types.js  -- implements the check; without this line
            #                         it ships having never once been run
            #   .prettierrc.json   -- feeds the fixed-point formatting, so it
            #                         decides the expected bytes
            #   package-lock.json  -- pins pocketbase-typegen and prettier; a
            #                         bump to either rewrites generated output
            #                         for every collection at once
            #   pocketbase-types.ts -- the guarded artifact; editing a
            #                          @generated file by hand IS the drift
            #                          this gate exists to catch
            - 'frontend/scripts/generate-types.js'
            - 'frontend/.prettierrc.json'
            - 'frontend/package-lock.json'
            - 'frontend/src/types/pocketbase-types.ts'
          # frontend-lint's real inputs. It shares its footprint with
          # tests-frontend below almost exactly -- eslint, prettier and tsc all
          # run over the whole frontend/ tree, same as vitest -- but gets its
          # own filter, matching the pythonLint/python and goLint/go split: a
          # future addition to just this job's inputs (a lint-only config
          # file, say) is then a one-line change here instead of a
          # re-derivation of a filter two jobs share.
          #
          # It used to gate on the shared `frontend` filter below, which
          # carried `package*.json` and `tsconfig*.json` -- both matching
          # nothing real. There is no root-level tsconfig, and the root
          # package.json (kindred#2663 audit) holds only
          # commitlint/markdownlint-cli2 devDependencies; `npm ci` here runs
          # with `working-directory: ./frontend`, reading
          # frontend/package.json and frontend/package-lock.json, both already
          # covered by `frontend/**`. Bumping a root devDependency ran the
          # whole eslint/prettier/tsc/npm-audit job for a file it never opens.
          frontendLint:
            - 'frontend/**'
            # `Setup Node.js` carries no `if:`, so it runs whenever the job
            # does -- same reasoning as `goLint` above.
            - '.nvmrc'
            # The job's own definition: the `npm audit --audit-level=high`
            # threshold and the step order all live here. Same reasoning and
            # the same accepted cost as `goLint` above. kindred#2663.
            - '.github/workflows/ci.yml'
          # tests-frontend's real inputs. vitest runs over the whole
          # frontend/ tree -- any source file a test imports, not only
          # `*.test.ts` files -- so this is the same set as `frontendLint`
          # above, kept separate for the same one-filter-per-job reason.
          frontend:
            - 'frontend/**'
            # The runtime pin for tsc, eslint, vitest and the vite build -- the
            # toolchain .nvmrc actually governs, constrained by
            # frontend/package.json's engines.node. See the note in `goLint`.
            - '.nvmrc'
            # The job's own definition: the 2-way shard matrix and the
            # `--shard=${{ matrix.shard }}/2` argument live here. Same
            # reasoning and the same accepted cost as `goLint` above.
            # kindred#2663.
            - '.github/workflows/ci.yml'
          # Every tracked shell script, because scripts/ci/shellcheck-all.sh lints
          # every tracked shell script. It was named `scripts` and matched only
          # 'scripts/**/*.sh', while the command it gated walked four fixed roots --
          # so four scripts under frontend/ and tests/shell/ could not trigger the
          # step that linted them, and .claude/hooks/worktree-guard.sh was linted by
          # nothing at all. kindred#2663 Gap C.
          shell:
            - '**/*.sh'
            # Listed explicitly, not left to the bare '**' above. Whether '*' crosses
            # a leading dot is picomatch's `dot` option, which dorny/paths-filter sets
            # today at the pinned SHA and an action bump could change. The Python
            # assertions ARE dot-permissive, so without this line they would keep
            # reporting .claude/hooks/worktree-guard.sh as covered while CI silently
            # stopped firing on it -- a false green in the test for false greens.
            - '.claude/**/*.sh'
            - '.shellcheckrc'
          # kindred#2370: scripts/dev/test-*.sh are the guard scripts' own
          # self-tests (e.g. test-verify-migration-history.sh pins the
          # unanchored-boundary regression from PR #2366) and, before this
          # filter existed, ran nowhere in CI -- the `shell` filter above
          # already matches this directory (it did so as `scripts/**/*.sh`
          # before kindred#2663 renamed and widened it), but the
          # only job reading that output is go-lint's shellcheck step
          # (syntax, not behavior). A dedicated filter makes the
          # guard-self-tests job's gate say what it actually depends on,
          # instead of relying on unrelated incidental coverage from a
          # filter meant for something else. `scripts/dev/**` (not just
          # `*.sh`) also covers scripts/dev/lib/pb-harness.sh, the shared
          # lib every guard here delegates its tool-absence contract to.
          # `.github/workflows/ci.yml` is included for the same reason the
          # `go` filter above includes it: the guard-self-tests job's own
          # shape (which scripts it runs, how) lives in this file, so a PR
          # that only edits the job -- like the one that first added it --
          # must still be able to trigger it. Without this line, that PR
          # would ship a job whose own CI run never proves it runs at all,
          # which is the exact failure kindred#2370 is about.
          # `pocketbase/pb_migrations/**` is included because
          # test-verify-consolidation.sh (wired into this same job) runs
          # end-to-end against the REAL migration tree, not a fixture --
          # a migrations-only PR can add a schema-free tail migration
          # (a pure data/RBAC rewrite like 1500000154) that breaks the
          # suite's drift assertion. Without this line, that PR would not
          # trigger guard-self-tests and would merge green; the red would
          # then surface on some later, unrelated PR that happens to touch
          # scripts/dev/ or ci.yml, misattributed to the wrong change.
          guardSelfTests:
            - 'scripts/dev/**'
            # kindred#2575: ALL workflows, not just ci.yml. TEST 11 of
            # test-copy-private-config.sh scans every workflow for a
            # clone-kindred-local call that forgot its allowlist, so watching
            # only ci.yml would let an allowlist change in cd.yml or
            # release.yml merge without ever running the test that checks it --
            # the same unwired-guard shape this filter exists to prevent.
            - '.github/workflows/**'
            - 'pocketbase/pb_migrations/**'
            # test-worktree-guard.sh lives under scripts/dev/ but its subject
            # is .claude/hooks/worktree-guard.sh. Without this line, editing
            # the hook alone would not run the suite that pins its behavior --
            # the exact unwired-guard shape kindred#2370 was about.
            - '.claude/hooks/**'
            # kindred#2575: test-copy-private-config.sh lives under scripts/ci/
            # (it is CI infrastructure, not a dev guard) and its TESTs 11-14
            # assert over the action and the workflows that call it. Without
            # these three lines, gutting the allowlist would not run the suite
            # that pins it -- the same unwired-guard shape as the line above.
            - 'scripts/ci/copy-private-config.sh'
            # TEST 21 asserts over .dockerignore's never-ship denylist.
            - '.dockerignore'
            - 'scripts/ci/test-copy-private-config.sh'
            - '.github/actions/**'
          # docker-lint's real inputs, NOT the broad `docker` filter below,
          # which go-lint's job- and step-level gates also read to catch
          # docker/init-entrypoint.sh for its shellcheck step -- a dependency
          # `shell`'s blanket '**/*.sh' already covers on its own since the
          # Gap C fix (kindred#2663; scripts/ci/shellcheck-all.sh now selects
          # by `git ls-files '*.sh'`, not a fixed set of roots). Widening the
          # shared `docker` filter to add ci.yml and frontend/Caddyfile would
          # also have widened go-lint's gate for no reason: that job's only
          # real dependency on `docker` is the .sh file `shell` already
          # matches independently. `docker` below is untouched -- go-lint
          # still reads it, so it stays alive and is not the orphaned-filter
          # shape this issue's suggested fix warns about.
          dockerLint:
            # The four Dockerfiles the `Dockerfile linting (hadolint)` step
            # lints, one `docker run` per file.
            - 'docker/Dockerfile.api'
            - 'docker/Dockerfile.caddy'
            - 'docker/Dockerfile.pocketbase'
            - 'docker/Dockerfile.init'
            # Mounted into the hadolint container as its config.
            - '.hadolint.yaml'
            # Both Caddyfiles the `Caddyfile validation` step adapts. The
            # second is NOT under docker/ -- `docker/**` alone never covered
            # it, before or after this filter existed.
            - 'docker/Caddyfile'
            - 'frontend/Caddyfile'
            # The job's own definition: HADOLINT_VERSION, the Dockerfile list
            # in the `for df in ...` loop, and both `caddy adapt` invocations
            # all live here. Same reasoning and the same accepted cost as
            # `goLint` above. kindred#2663.
            - '.github/workflows/ci.yml'
          docker:
            - 'docker/**'
            - 'docker-compose*.yml'
            - '.hadolint.yaml'
          actions:
            - '.github/workflows/**'
            - '.github/actions/**'
            - 'zizmor.yml'
            # Renovate's custom managers regex over the workflow files, and the
            # checker self-references so edits to either re-run the check.
            - 'renovate.json'
            - 'scripts/ci/check_renovate_managers.py'
            # The second customManager targets this file, and `go` is one of the
            # checker's EXPECTED_DEPS. `docker/**` matches it but gates a
            # different job, so without this line a PR bumping only the Go
            # directive -- exactly what renovate.json's `go` dashboard rule
            # produces -- would skip the check that proves the regex still
            # matches. tests/unit/scripts/test_ci_path_filters.py pins this.
            - 'docker/healthcheck/go.mod'

  # Secret scanning (runs unconditionally on all pushes/PRs)
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Full history for better scanning
        persist-credentials: false

    - name: Install gitleaks
      run: |
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz | \
          sudo tar xz -C /usr/local/bin gitleaks

    - name: Run Gitleaks
      run: gitleaks detect --source . --config .gitleaks.toml --verbose

  # Lodging-name guard (spec 3.8) -- the tripwire that fails the build if a
  # real camp unit name lands in source. Unconditional like secret-scan
  # above, not gated behind detect-changes: it scans six fixed roots
  # (pocketbase/ api/ bunking/ frontend/src/ scripts/ tests/) rather than the
  # PR diff, so a leak added under any of them must fail regardless of which
  # detect-changes filter the touched files happen to match. It also needs a
  # real git checkout -- `git rev-parse --show-toplevel` inside the script
  # exits 128 without one -- so actions/checkout below is load-bearing, not
  # boilerplate. kindred#2181: this was entirely unwired before, so nothing
  # ran it and nothing failed when it would have caught something.
  #
  # kindred#2551, Option B: the "Clone private config" step below gives this
  # job read access to config/lodging_registry.json via the same
  # KINDRED_LOCAL_DEPLOY_KEY secret CD already uses for branding assets --
  # this job needed no secrets before. The guard reads the registry to build
  # its own needle list (scripts/dev/lib/build_lodging_needles.py) rather
  # than a hand-maintained sample; nothing here writes to kindred-local, and
  # the key is scoped to that one repo. A fork's PR run has no access to this
  # secret and gets the guard's committed FALLBACK_NEEDLES sample instead --
  # the guard announces which mode it ran in either way (see the script's own
  # header). persist-credentials: false on the main checkout is unrelated and
  # stays: it stops the checked-out repo's own token from persisting, not
  # this action's ssh key, which the composite action removes itself when
  # done.
  #
  # DEPENDABOT PRs ALSO RUN THIS IN FALLBACK MODE, and they are not the rare
  # case forks are (kindred#2573). A Dependabot-triggered `pull_request` run
  # receives DEPENDABOT secrets, not Actions secrets, so
  # KINDRED_LOCAL_DEPLOY_KEY is empty there even though the branch is
  # in-repo -- and this workflow does run on Dependabot PRs (see the
  # permissions comment at the top of this file). On a repo where most of the
  # commit traffic is dependency bumps, "fallback sample" is therefore the
  # MAJORITY announcement, which is exactly why the step below asserts the
  # mode rather than leaving a reader to eyeball it: routine fallback traffic
  # would otherwise make a real regression indistinguishable from a Tuesday.
  lodging-guard:
    name: Lodging Name Guard
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Clone private config
      uses: ./.github/actions/clone-kindred-local
      with:
        deploy-key: ${{ secrets.KINDRED_LOCAL_DEPLOY_KEY }}
        # kindred#2575: the registry and nothing else. This job used to
        # receive the whole private config/ and local/ trees -- staff names,
        # branding, camp logos -- to read this one file, in a PUBLIC repo's
        # workspace. GATE 1 below still runs: this input makes a MISSING
        # registry a hard failure, but only the guard's own output can show
        # that the registry was actually USED.
        paths: config/lodging_registry.json

    - name: No hardcoded lodging unit names
      env:
        # NOT the secret -- a boolean DERIVED from it. `!= ''` is evaluated by
        # the runner and expands to the literal string "true" or "false"; the
        # key itself never reaches the shell, the environment or the log.
        HAVE_DEPLOY_KEY: ${{ secrets.KINDRED_LOCAL_DEPLOY_KEY != '' }}
      run: |
        guard_status=0
        OUT=$(./scripts/dev/verify-no-hardcoded-lodging.sh 2>&1) || guard_status=$?
        printf '%s\n' "$OUT"
        if [ "$guard_status" -ne 0 ]; then
          exit "$guard_status"
        fi

        # kindred#2573. The guard ANNOUNCES its needle source; until now nothing
        # READ that announcement, so the announcement was advisory and this job
        # was green either way. Both gates below close that, and the class they
        # close is kindred#1867's -- a guard reporting clean on a scan that did
        # not really happen -- one level up.
        #
        # GATE 1: the registry must have ARRIVED. Since kindred#2575 the action
        # itself hard-fails on a missing requested path, so the `|| true`
        # silence this gate was written against is gone and a rename in
        # kindred-local now goes red one step earlier. Keep the gate anyway: it
        # is the only check that the file is readable HERE, in this job's
        # workspace, which is what the guard below actually reads. A future
        # rewiring -- a changed allowlist, a copy landing somewhere else, a
        # permissions problem -- reaches the guard without touching the action.
        if [ "$HAVE_DEPLOY_KEY" = "true" ] && [ ! -r config/lodging_registry.json ]; then
          echo "::error::this run has the kindred-local deploy key, but config/lodging_registry.json is not readable in the workspace. The guard would silently fall back to its 15-term sample. Check the 'paths' allowlist passed to clone-kindred-local, and the copy step's output - do not delete this check."
          exit 1
        fi

        # GATE 2: if it arrived, the guard must have CONSUMED it. Covers the
        # other half -- a malformed registry, a builder crash, or any future
        # rewiring that leaves the file in place but the guard on the sample.
        if [ -r config/lodging_registry.json ]; then
          if ! printf '%s\n' "$OUT" | grep -q 'needle source = registry'; then
            echo "::error::config/lodging_registry.json is present but the guard did not use it: $(printf '%s\n' "$OUT" | grep 'needle source' || echo '(no announcement at all)')"
            exit 1
          fi
          echo "assert ok: the guard ran in registry mode"
        else
          echo "::notice::no private registry on this run - expected on fork PRs and on Dependabot PRs, neither of which receives Actions secrets. The guard ran on its FALLBACK sample, which covers a fraction of the registry."
        fi

    - name: Guard self-test
      run: ./scripts/dev/test-verify-no-hardcoded-lodging.sh

  # kindred#2370: scripts/dev/verify-migration-history.sh gates local
  # start_dev.sh boots and stands between a renumbered migration and a
  # corrupted local DB, but its own 15-test self-test
  # (test-verify-migration-history.sh) ran nowhere -- CI only wired
  # test-verify-no-hardcoded-lodging.sh above. TEST 14/15 there pin a real
  # defect PR #2366 introduced and fixed: an unanchored boundary regex that
  # made the guard report silently CLEAN on a real collision, the one
  # direction a collision predictor must never fail in.
  #
  # Gated on `guardSelfTests` (scripts/dev/**), not `migrations` or `go` --
  # a change to only a script under scripts/dev/ (the guard, its suite, or
  # the shared pb-harness.sh lib) touches none of those, so gating this job
  # on either would leave it exactly as unwired as the absence this issue
  # is about. See the `guardSelfTests` filter comment above.
  #
  # The other four self-tests found under scripts/dev/test-*.sh
  # (test-verify-consolidation.sh, test-migration-schema-diff.sh,
  # test-pb-harness.sh, test-worktree-guard.sh) were audited the same way and
  # are wired here too -- all four pass standalone against a scratch Go build
  # and a scratch sqlite3 DB, with no live PocketBase server or seeded dev DB
  # required, so none of them carry the flake risk that would make wiring them
  # a mistake. test-worktree-guard.sh needs neither: only bash and jq.
  guard-self-tests:
    name: Dev Guard Self-Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.guardSelfTests == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # migration-history's suite needs only sqlite3/python3 (both preinstalled
    # on ubuntu-latest), but the consolidation and pb-harness suites build a
    # scratch pocketbase binary via pb_harness_build_binary, so Go is a real
    # dependency of this job, not an unused setup step.
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: pocketbase/go.mod
        check-latest: true
        cache: true
        cache-dependency-path: pocketbase/go.sum

    - name: Migration history guard self-test
      run: ./scripts/dev/test-verify-migration-history.sh

    - name: Consolidation guard self-test
      run: ./scripts/dev/test-verify-consolidation.sh

    - name: Migration schema-diff guard self-test
      run: ./scripts/dev/test-migration-schema-diff.sh

    - name: PB harness lib self-test
      run: ./scripts/dev/test-pb-harness.sh

    - name: Worktree guard self-test
      run: ./scripts/dev/test-worktree-guard.sh

    # kindred#2575. Needs only bash, awk and coreutils, and builds its fixtures
    # in a mktemp dir -- no Go, no PocketBase, no private repo. TESTs 11-14 are
    # source-grep anchors over .github/, which is why the filter below watches
    # .github/actions/** as well as scripts/.
    - name: Private config copy self-test
      run: ./scripts/ci/test-copy-private-config.sh

  # Python linting (parallel with other lint jobs)
  python-lint:
    name: Python Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.pythonLint == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        # v9 flipped this default to false. Unpruned, the uv cache grows from
        # ~11 MB to hundreds of MB per entry, and this repo already sits at the
        # 10 GB Actions cache ceiling (CodeQL takes ~9.5 GB of it).
        prune-cache: true

    - name: Install Python dependencies
      run: uv sync --frozen

    - name: Python formatting check
      run: uv run ruff format --check .

    - name: Python linting
      run: uv run ruff check .

    - name: Python type check (mypy)
      # --num-workers 4: parallel checking is ~2.8x faster on a cold cache (CI
      # restores no .mypy_cache). 4 is the sweet spot for this import graph (beats
      # 8/12 even on >4 cores) and maps to the 4-vCPU ubuntu-latest runner. Output
      # is byte-identical to single-threaded. Pre-push stays single-threaded — a
      # warm cache makes worker-spawn overhead a net loss there. See #1660.
      run: uv run mypy . --explicit-package-bases --num-workers 4

    - name: Security audit (pip-audit)
      run: |
        ARGS="--desc"
        while IFS= read -r line; do
          id="${line%%#*}"
          id="${id// /}"
          [ -n "$id" ] && ARGS="$ARGS --ignore-vuln $id"
        done < .pip-audit-ignore
        uv run pip-audit $ARGS

    - name: JSON config validation
      run: |
        echo "Validating JSON config files..."
        for f in config/*.json bunking/*.json; do
          if [ -f "$f" ]; then
            python -m json.tool "$f" > /dev/null && echo "✓ $f" || { echo "✗ $f is invalid JSON"; exit 1; }
          fi
        done

  # Go linting (parallel with other lint jobs)
  go-lint:
    name: Go Lint
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.goLint == 'true' ||
      needs.detect-changes.outputs.shell == 'true' ||
      needs.detect-changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: pocketbase/package-lock.json

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # go-version-file, not a literal: setup-go pins GOTOOLCHAIN=local, so the
        # runner CANNOT fetch a newer toolchain the way a developer's machine
        # does. Whatever this step installs is the only toolchain the job has,
        # and if go.mod declares a higher minimum every Go command hard-fails
        # with "requires go >= X (running Y; GOTOOLCHAIN=local)". A floating
        # '1.26.x' therefore silently breaks the build the moment go.mod is
        # bumped ahead of the newest release the manifest happens to serve.
        # Reading the version from go.mod keeps ONE source of truth and makes a
        # future bump a one-line change there.
        go-version-file: pocketbase/go.mod
        check-latest: true
        cache: true
        cache-dependency-path: pocketbase/go.sum

    - name: Cache apt packages
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: shellcheck
        version: shellcheck-v1

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Go formatting check
      if: needs.detect-changes.outputs.goLint == 'true'
      run: |
        if [ -n "$(gofmt -l pocketbase)" ]; then
          echo "Go files need formatting. Please run: gofmt -w pocketbase"
          gofmt -d pocketbase
          exit 1
        fi

    - name: Go vet
      if: needs.detect-changes.outputs.goLint == 'true'
      working-directory: ./pocketbase
      run: go vet ./...

    - name: Go linting
      if: needs.detect-changes.outputs.goLint == 'true'
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        # v2.13.0 is the first release built with Go 1.27. Older binaries
        # abort with `package requires newer Go version go1.27 (application
        # built with go1.26)` -- a panic, not a lint finding.
        # renovate: datasource=github-releases depName=golangci/golangci-lint
        version: v2.13.2
        working-directory: pocketbase
        args: --config ../.golangci.yml

    - name: Go build check
      if: needs.detect-changes.outputs.goLint == 'true'
      working-directory: ./pocketbase
      run: go build -o /dev/null ./...

    - name: Security audit (govulncheck)
      if: needs.detect-changes.outputs.goLint == 'true'
      working-directory: ./pocketbase
      run: govulncheck ./...

    # PocketBase JS linting (migrations and hooks)
    - name: Install PocketBase JS linting dependencies
      if: needs.detect-changes.outputs.goLint == 'true'
      working-directory: ./pocketbase
      run: npm ci

    - name: PocketBase JS linting
      if: needs.detect-changes.outputs.goLint == 'true'
      working-directory: ./pocketbase
      run: npm run lint

    # Shell script linting (warning+ severity - info is too noisy)
    - name: Shell script linting (shellcheck)
      if: needs.detect-changes.outputs.shell == 'true' || needs.detect-changes.outputs.goLint == 'true' || needs.detect-changes.outputs.docker == 'true'
      run: bash scripts/ci/shellcheck-all.sh

  # Frontend linting (parallel with other lint jobs)
  frontend-lint:
    name: Frontend Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.frontendLint == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: TypeScript type check
      working-directory: ./frontend
      run: npm run type-check

    - name: Prettier formatting check
      working-directory: ./frontend
      run: npm run format:check

    - name: TypeScript linting
      working-directory: ./frontend
      run: npm run lint

    - name: Security audit (npm)
      working-directory: ./frontend
      run: npm audit --audit-level=high

  # Docker linting (parallel with other lint jobs)
  docker-lint:
    name: Docker Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.dockerLint == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Dockerfile linting — mounts .hadolint.yaml so CI matches local (lefthook) config
    # Each file needs its own docker run because hadolint reads from stdin (< "$df")
    - name: Dockerfile linting (hadolint)
      # Was untagged (implicitly :latest) and therefore unmanageable -- pinned so
      # Renovate can track it. The version lives in a variable because the
      # `# renovate:` marker regex matches a `VERSION=` assignment, not an
      # image reference buried in a docker run line.
      run: |
        # renovate: datasource=docker depName=hadolint/hadolint
        HADOLINT_VERSION=v2.15.1
        for df in docker/Dockerfile.api docker/Dockerfile.caddy docker/Dockerfile.pocketbase docker/Dockerfile.init; do
          echo "=== Linting $df ==="
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml" \
            "hadolint/hadolint:${HADOLINT_VERSION}" < "$df"
        done

    # Caddyfile validation (stdin, no mounts - avoids self-hosted runner volume mount issues).
    # Both Caddyfiles use only stock directives now (rate-limit delegated to Traefik).
    - name: Caddyfile validation
      run: |
        docker run --rm -i caddy:2 caddy adapt --adapter caddyfile --config - < docker/Caddyfile > /dev/null
        docker run --rm -i caddy:2 caddy adapt --adapter caddyfile --config - < frontend/Caddyfile > /dev/null

  # GitHub Actions security and correctness linting
  security-lint:
    name: Actions Security Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install and run actionlint
      # Pinned to a tagged release, not a mutable branch HEAD. actionlint publishes
      # per-release SHA256 checksums, so the archive is fetched directly and verified
      # against them rather than piping upstream's `download-actionlint.bash` into bash.
      # The version lives in ACTIONLINT_VERSION so Renovate can manage it; do not
      # restate the number in this comment, which Renovate would not update.
      # For the same reason this no longer records the release's upstream commit
      # (it did, kindred#2610, "for traceability"): a SHA is as version-specific
      # as the number and would go stale on the first Renovate bump. The checksum
      # verification below is the integrity control; the tag-to-commit mapping
      # stays recoverable from upstream.
      run: |
        set -euo pipefail
        # renovate: datasource=github-releases depName=rhysd/actionlint
        ACTIONLINT_VERSION="1.7.12"
        archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
        curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
        grep " ${archive}\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
        tar xzf "${archive}" actionlint
        echo "=== actionlint ==="
        ./actionlint -shellcheck="" -color

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'

    - name: Verify Renovate custom managers still match
      # A customManager regex that matches nothing produces NO Renovate error --
      # the run just goes green having managed nothing. Pure stdlib, no install.
      run: python3 scripts/ci/check_renovate_managers.py

    - name: Install and run zizmor
      run: |
        pipx run zizmor --config zizmor.yml --min-severity medium .

  # Python tests (parallel)
  tests-python:
    name: Python Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        # v9 flipped this default to false. Unpruned, the uv cache grows from
        # ~11 MB to hundreds of MB per entry, and this repo already sits at the
        # 10 GB Actions cache ceiling (CodeQL takes ~9.5 GB of it).
        prune-cache: true

    - name: Install Python dependencies
      run: uv sync --frozen

    - name: Create logs directory
      run: mkdir -p logs

    - name: Run Python unit tests (no external deps)
      env:
        SKIP_POCKETBASE_TESTS: true
      run: uv run pytest tests/ -v --tb=short

  # Go tests (sharded across a matrix)
  #
  # This was a single ~390s job and the whole critical path -- the next-slowest
  # job was ~156s. Almost none of that is test volume: the race detector costs
  # ~4.5x (measured back-to-back on one machine -- sync 60.8s -> 298.2s, lodging
  # 35.1s -> 136.6s), and it pays that serially, because the Go tree has exactly
  # one t.Parallel() in it -- inside a subtest, at that -- so no two top-level
  # tests ever overlap. Two packages carry it all (sync ~297s, lodging ~143s; the
  # other nine total ~15s), which is why this shards by individual test function
  # rather than by package -- a per-package split would leave sync as a 297s shard.
  #
  # Sharding at this level makes a coverage hole possible, so scripts/ci/
  # go_test_shard.py reads the inventory live from `go test -list` and fails the
  # shard if anything it selected produced no result. See its module docstring.
  #
  # The durable fix is t.Parallel() in sync and lodging (kindred#2281),
  # which would buy the same wall-clock without 4x the runner minutes.
  tests-go:
    name: Go Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Re-shard by editing this list and nothing else -- --total comes from
        # strategy.job-total, so the count cannot drift from the list. The list
        # must stay 0-based and contiguous, though: the values are passed through
        # as --shard, and the script rejects an index outside [0, total). A list
        # like [1,2,3,4] fails the last job loudly rather than skipping tests, and
        # test_tests_go_job_shards_and_derives_total_from_the_matrix catches it
        # before CI does.
        #
        # Three. Every shard pays the same ~88s `-race` compile plus ~12s of
        # checkout and setup-go, and none of that shards -- the setup-go cache
        # key derives from go.sum alone, so it holds whichever build variant
        # saved it first (a non-race one), Actions cache entries are immutable,
        # and the race objects are therefore recompiled every run. That ~100s
        # is a floor under every job in the matrix.
        #
        # With the suite parallelised (kindred#2281) the execution either side
        # of that floor is small, so returns collapse. Measured on this repo,
        # same tree, one afternoon:
        #
        #   shards   shard times (s)        wall    runner-seconds
        #   1x4      (serial, pre-2281)     ~191    ~764
        #   2        199, 199                199     398
        #   3        176, 173, 167           176     516
        #   4        158, 162, 131, 152      162     603
        #
        # 2 -> 3 buys 23s; 3 -> 4 buys 14s, which is inside the spread a single
        # 4-shard run already shows (131-162s, from uneven splits). Past 4 you
        # spend ~100s of runner time per job to shave seconds. Three is the
        # knee.
        #
        # Do not re-derive this from the pre-2281 numbers: those were measured
        # when the suite ran serially, and sharding was then buying real
        # execution time rather than mostly duplicating a compile.
        shard: [0, 1, 2]
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # go-version-file, not a literal: setup-go pins GOTOOLCHAIN=local, so the
        # runner CANNOT fetch a newer toolchain the way a developer's machine
        # does. Whatever this step installs is the only toolchain the job has,
        # and if go.mod declares a higher minimum every Go command hard-fails
        # with "requires go >= X (running Y; GOTOOLCHAIN=local)". A floating
        # '1.26.x' therefore silently breaks the build the moment go.mod is
        # bumped ahead of the newest release the manifest happens to serve.
        # Reading the version from go.mod keeps ONE source of truth and makes a
        # future bump a one-line change there.
        go-version-file: pocketbase/go.mod
        check-latest: true
        cache: true
        cache-dependency-path: pocketbase/go.sum

    - name: Run Go tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
      run: |
        python3 scripts/ci/go_test_shard.py \
          --shard ${{ matrix.shard }} \
          --total ${{ strategy.job-total }} \
          -- -race

  # Migration smoke test — catches schema/binary issues against a fresh DB
  tests-migrations:
    name: Migration Smoke Test
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.migrations == 'true' ||
      needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # go-version-file, not a literal: setup-go pins GOTOOLCHAIN=local, so the
        # runner CANNOT fetch a newer toolchain the way a developer's machine
        # does. Whatever this step installs is the only toolchain the job has,
        # and if go.mod declares a higher minimum every Go command hard-fails
        # with "requires go >= X (running Y; GOTOOLCHAIN=local)". A floating
        # '1.26.x' therefore silently breaks the build the moment go.mod is
        # bumped ahead of the newest release the manifest happens to serve.
        # Reading the version from go.mod keeps ONE source of truth and makes a
        # future bump a one-line change there.
        go-version-file: pocketbase/go.mod
        check-latest: true
        cache: true
        cache-dependency-path: pocketbase/go.sum

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'

    # Needed only for the pocketbase-types freshness check below (pocketbase-typegen
    # + prettier live in frontend/'s devDependencies).
    #
    # Placement buys nothing either way: steps within a job are strictly
    # serial, so setup-node + npm ci cost the same ~19s before the Go steps as
    # after them. They sit here because setup belongs with setup.
    #
    # What makes that ~19s affordable is that tests-migrations is not the
    # critical path -- measured on this PR's own run it finishes in ~63s
    # against tests-go's ~3m, so the cost lands in runner-seconds, not in
    # wall-clock to a green CI Summary. If that ever inverts, the fix is to
    # split the freshness check into its own job, not to move these two steps.
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Migration smoke test (fresh database)
      working-directory: ./pocketbase
      run: |
        echo "Building PocketBase..."
        go build -o pocketbase .

        echo "Testing migrations on fresh database..."
        # Use local test data directory so PocketBase discovers migrations via default path:
        # ./pb_test_data/../pb_migrations = ./pb_migrations
        rm -rf ./pb_test_data
        mkdir -p ./pb_test_data
        echo "Migrations directory contents:"
        ls -la pb_migrations/ | head -10

        # Run migrations (PocketBase auto-discovers ./pb_migrations from ./pb_test_data)
        echo "Running migrations..."
        ./pocketbase migrate up --dir ./pb_test_data 2>&1 | tee /tmp/pb_migrate.log

        echo "Starting PocketBase server..."
        ./pocketbase serve --dir ./pb_test_data --http 127.0.0.1:18999 > /tmp/pb_output.log 2>&1 &
        PB_PID=$!

        # Wait for startup (max 30s)
        for i in {1..30}; do
          if curl -sf http://127.0.0.1:18999/api/health >/dev/null 2>&1; then
            echo "✅ PocketBase started successfully - migrations applied"
            break
          fi
          # Check if process died (migration error)
          if ! kill -0 $PB_PID 2>/dev/null; then
            echo "❌ PocketBase crashed during startup - migration error:"
            echo "----------------------------------------"
            cat /tmp/pb_output.log
            echo "----------------------------------------"
            rm -rf ./pb_test_data
            exit 1
          fi
          sleep 1
        done

        # Check if PB is running after timeout
        if ! curl -sf http://127.0.0.1:18999/api/health >/dev/null 2>&1; then
          echo "❌ PocketBase failed to start within 30s:"
          echo "----------------------------------------"
          cat /tmp/pb_output.log
          echo "----------------------------------------"
          kill $PB_PID 2>/dev/null || true
          rm -rf ./pb_test_data
          exit 1
        fi

        # Create temporary superuser via CLI (required for fresh DB in PB v0.23+)
        echo "Creating temporary superuser for schema validation..."
        ./pocketbase superuser upsert ci@test.local ci_test_pass_123 --dir ./pb_test_data

        # Get auth token
        AUTH_TOKEN=$(curl -sf -X POST http://127.0.0.1:18999/api/collections/_superusers/auth-with-password \
          -H "Content-Type: application/json" \
          -d '{"identity":"ci@test.local","password":"ci_test_pass_123"}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")

        if [ -z "$AUTH_TOKEN" ]; then
          echo "❌ Failed to authenticate for schema validation"
          kill $PB_PID 2>/dev/null || true
          rm -rf ./pb_test_data
          exit 1
        fi

        # Validate schema via API. perPage is required: PocketBase's default
        # page size is 30, well under the ~69 collections the real migrations
        # produce, so an unpaginated call here silently truncates the dump.
        # validate_migrations.py never noticed -- every collection in its
        # REQUIRED_COLLECTIONS/REQUIRED_FIELDS happens to be an early one that
        # already fell inside the first 30 -- but kindred#1921's
        # fixture-schema-agreement step (below) walks every collection
        # newSyncTestApp builds, several of them late (lodging_* from
        # migration 1500000116+), which is what surfaced this. Pinned to
        # PocketBase's own MaxPerPage (tools/search/provider.go) rather than
        # some smaller headroom number: a perPage above MaxPerPage is
        # silently clamped down to it, never rejected, so this asks for
        # everything the API could ever return in one page and can't
        # under-ask again as collections keep being added.
        echo "Validating migration schema..."
        curl -sf "http://127.0.0.1:18999/api/collections?perPage=1000" \
          -H "Authorization: Bearer $AUTH_TOKEN" \
          > /tmp/collections.json

        set +e
        python3 ../scripts/ci/validate_migrations.py /tmp/collections.json
        VALIDATION_RESULT=$?
        set -e

        if [ $VALIDATION_RESULT -ne 0 ]; then
          echo "❌ Schema validation failed"
          echo "Migration log:"
          cat /tmp/pb_migrate.log || true
          echo "PocketBase output log:"
          cat /tmp/pb_output.log || true
          # Cleanup
          kill $PB_PID 2>/dev/null || true
          rm -rf ./pb_test_data
          exit 1
        fi

        # Stop the server on success, but leave ./pb_test_data/data.db on disk --
        # the pocketbase-types freshness check below reads the migrated schema
        # straight out of it. A trailing always() step removes it once that
        # check has run.
        kill $PB_PID 2>/dev/null || true

        echo "✅ Migration smoke test passed"

    # kindred#1921: the sync package's fixtures build their PocketBase
    # collections by hand (see newSyncTestApp in
    # pocketbase/sync/sync_testsupport_test.go) rather than replaying
    # pb_migrations, so a column a migration drops or renames can stay in the
    # fixture indefinitely -- go test ./... never notices. /tmp/collections.json
    # above is the real schema those same migrations just produced; this step
    # diffs the fixture's declared fields against it and fails on a field the
    # fixture has that production does not (drop/rename direction only).
    #
    # -count=1 disables the test result cache deliberately: Go's cache only
    # tracks files opened from within the package's own module tree, and
    # /tmp/collections.json lives outside it, so the cache can't see it
    # change between runs. KINDRED_PROD_SCHEMA_JSON is the same literal path
    # every time, and actions/setup-go's cache:true (keyed on
    # pocketbase/go.sum, which most PRs don't touch) restores GOCACHE across
    # separate CI runs. Without -count=1, once this test passes once with
    # unchanged Go source, a later PR that drops/renames a field in
    # pb_migrations -- without touching this test's .go file -- can get a
    # cached "ok" and never re-read that run's schema dump at all, silently
    # defeating the guard.
    - name: Fixture schema agreement (kindred#1921)
      working-directory: ./pocketbase
      env:
        KINDRED_PROD_SCHEMA_JSON: /tmp/collections.json
      run: go test -count=1 ./sync/... -run TestLodgingTestsupportFixtureFieldsExistInProductionSchema -v

    # kindred#2627: pocketbase/sync/grain.go declares, per service, the UNIQUE
    # index that enforces each guarded sweep's grain. The ruling on that issue is
    # that the index is asserted against a booted PocketBase's sqlite_master and
    # never a regex over pb_migrations -- a regex passes on a migration that never
    # applied. ./pb_test_data/data.db is the database the smoke test above just
    # migrated, so this reads the real applied schema with no second boot.
    #
    # -count=1 for the same reason as the step above: the DB lives outside the
    # module tree, so Go's test cache cannot see it change between runs and an
    # unrelated PR could otherwise get a cached "ok" for a schema it never read.
    - name: Grain declaration index agreement (kindred#2627)
      working-directory: ./pocketbase
      env:
        # Absolute, not ./pb_test_data/data.db: `go test` runs each test binary
        # with its own package directory as the working directory (pocketbase/sync),
        # not this step's working-directory. The test fails loudly on a relative
        # path rather than letting SQLite answer "unable to open database file".
        KINDRED_PROD_SCHEMA_DB: ${{ github.workspace }}/pocketbase/pb_test_data/data.db
      run: |
        set -o pipefail
        go test -count=1 ./sync/... -run TestDeclaredUniqueIndexesExistInBootedSchema -v 2>&1 \
          | tee "$RUNNER_TEMP/grain-index.log"
        # `go test -run <pattern>` exits 0 when the pattern matches NOTHING, and the
        # test SKIPS when KINDRED_PROD_SCHEMA_DB is unset -- so renaming the test or
        # typoing the env var would leave this step permanently green having asserted
        # nothing. Require the PASS line naming the test itself.
        if ! grep -q '^--- PASS: TestDeclaredUniqueIndexesExistInBootedSchema' "$RUNNER_TEMP/grain-index.log"; then
          echo "::error::TestDeclaredUniqueIndexesExistInBootedSchema did not run to PASS (renamed, filtered out, or skipped) -- this step asserted nothing"
          exit 1
        fi

    # kindred#2278: frontend/src/types/pocketbase-types.ts is @generated from
    # live PocketBase schema introspection (pocketbase-typegen), and nothing
    # else in this repo regenerates or diffs it -- a migration can add,
    # remove, or reshape a collection and the checked-in types silently fall
    # behind (13 collections' worth, before this check existed). This step
    # regenerates against the SAME migrated ./pb_test_data/data.db the smoke
    # test above just produced (no second boot) and diffs against the
    # checked-in file.
    #
    # Deliberately reads the SQLite file directly (pocketbase-typegen --db)
    # rather than hitting a live PocketBase over HTTP: introspecting the file
    # needs no running server, so this avoids a second boot entirely (the
    # migrate step above already produced a fully-migrated data.db) and
    # sidesteps app.OnServe() hooks -- notably the lodging-registry hook,
    # which errors without CAMPMINDER_SEASON_ID set (a local-dev-only
    # concern in this repo's normal boot path; CI carries no private
    # config, so the file the hook checks for never exists here, but staying
    # off the serve path removes the dependency entirely rather than relying
    # on that).
    #
    # frontend/scripts/generate-types.js formats to a fixed point (up to 5
    # prettier passes) rather than one --write: pocketbase-typegen's static
    # utility-type boilerplate hits a real prettier non-idempotency where
    # pass 1 and pass 2 land on different, otherwise-equivalent comment
    # placements. A single pass would make this check flap between "stale"
    # and "fresh" on zero actual schema drift.
    #
    # That script exits non-zero if prettier fails or if the output never
    # settles, rather than emitting its last attempt. Both used to be
    # warn-and-continue, which meant a tooling failure reached this step
    # disguised as schema drift and sent someone to "fix" a schema that was
    # fine. Anything that reaches the diff below has been normalized; a red
    # here therefore means drift and nothing else.
    - name: PocketBase types freshness (kindred#2278)
      run: |
        # --suffix=.ts is load-bearing, not cosmetic: prettier infers its
        # parser from the file extension and exits 2 with "No parser could be
        # inferred" on a bare mktemp name, which would fail this step on every
        # run. mktemp over a fixed /tmp path follows the same regen-and-diff
        # check in .lefthook.yml (api-types-freshness).
        FRESH=$(mktemp --suffix=.ts)
        trap 'rm -f "$FRESH"' EXIT

        node frontend/scripts/generate-types.js \
          --db pocketbase/pb_test_data/data.db \
          --output "$FRESH"

        if ! diff -u "$FRESH" frontend/src/types/pocketbase-types.ts; then
          echo ""
          echo "❌  frontend/src/types/pocketbase-types.ts is stale -- it doesn't match the schema produced by pocketbase/pb_migrations/."
          echo ""
          echo "   Regenerate it against a database built from THIS BRANCH's migrations:"
          echo ""
          echo "     cd pocketbase && go build -o pocketbase . \\"
          echo "       && rm -rf ./pb_types_tmp \\"
          echo "       && ./pocketbase migrate up --dir ./pb_types_tmp \\"
          echo "       && node ../frontend/scripts/generate-types.js \\"
          echo "            --db ./pb_types_tmp/data.db \\"
          echo "            --output ../frontend/src/types/pocketbase-types.ts \\"
          echo "       && rm -rf ./pb_types_tmp"
          echo ""
          echo "   Do NOT reach for a plain 'npm run generate-types' to fix this. That reads"
          echo "   pocketbase/pb_data/data.db -- your long-lived local dev database, which lags"
          echo "   behind main whenever you haven't started dev since a schema change merged."
          echo "   Regenerating from it does not just fail to fix the drift, it writes NEW drift:"
          echo "   fields that migrations already added get deleted from the types file."
          echo "   The scratch database above is built from pb_migrations/ alone, so it matches"
          echo "   what this check regenerates byte for byte."
          echo ""
          exit 1
        fi
        echo "✅ pocketbase-types.ts is current"

    - name: Clean up scratch database
      if: always()
      run: rm -rf pocketbase/pb_test_data

  # Frontend tests — sharded across 2 matrix jobs to cut wall-clock
  # (vitest --shard splits files; matrix gives each shard its own runner)
  tests-frontend:
    name: Frontend Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend tests (shard ${{ matrix.shard }}/2)
      working-directory: ./frontend
      run: npm run test -- --run --shard=${{ matrix.shard }}/2

  # Summary job - gate for PR merges
  summary:
    name: CI Summary
    needs: [pr-title-lint, detect-changes, secret-scan, lodging-guard, guard-self-tests, python-lint, go-lint, frontend-lint, docker-lint, security-lint, tests-python, tests-go, tests-migrations, tests-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check status
      env:
        DETECT_CHANGES: ${{ needs.detect-changes.result }}
        PR_TITLE_LINT: ${{ needs.pr-title-lint.result }}
        SECRET_SCAN: ${{ needs.secret-scan.result }}
        LODGING_GUARD: ${{ needs.lodging-guard.result }}
        GUARD_SELF_TESTS: ${{ needs.guard-self-tests.result }}
        PYTHON_LINT: ${{ needs.python-lint.result }}
        GO_LINT: ${{ needs.go-lint.result }}
        FRONTEND_LINT: ${{ needs.frontend-lint.result }}
        DOCKER_LINT: ${{ needs.docker-lint.result }}
        SECURITY_LINT: ${{ needs.security-lint.result }}
        TESTS_PYTHON: ${{ needs.tests-python.result }}
        TESTS_GO: ${{ needs.tests-go.result }}
        TESTS_MIGRATIONS: ${{ needs.tests-migrations.result }}
        TESTS_FRONTEND: ${{ needs.tests-frontend.result }}
      run: |
        # detect-changes: blocking — if this fails, all conditional jobs are skipped
        # and CI passes with zero validation (the paths-filter incident of March 2026)
        if [ "$DETECT_CHANGES" != "success" ]; then
          echo "::error::Change detection failed — no lint or test jobs ran. Check paths-filter action."
          exit 1
        fi
        # pr-title-lint: blocking — squash merge uses PR title as commit message on main
        if [ "$PR_TITLE_LINT" != "success" ] && [ "$PR_TITLE_LINT" != "skipped" ]; then
          echo "::error::PR title must follow conventional commit format: type(scope): description"
          exit 1
        fi
        if [ "$SECRET_SCAN" != "success" ]; then
          echo "Secret scanning failed! Check for leaked credentials."
          echo "   If these are intentional dev/test values, add them to .gitleaks.toml"
          exit 1
        fi
        if [ "$LODGING_GUARD" != "success" ]; then
          echo "::error::Lodging name guard failed! A camp unit name may have landed in source -- see docs/reference/lodging-registry.md."
          exit 1
        fi
        if [ "$GUARD_SELF_TESTS" != "success" ] && [ "$GUARD_SELF_TESTS" != "skipped" ]; then
          echo "::error::A scripts/dev/ guard self-test failed! See the guard-self-tests job."
          exit 1
        fi
        # Lint jobs: success or skipped (when no relevant changes)
        if [ "$PYTHON_LINT" != "success" ] && [ "$PYTHON_LINT" != "skipped" ]; then
          echo "Python linting/type checks failed!"
          exit 1
        fi
        if [ "$GO_LINT" != "success" ] && [ "$GO_LINT" != "skipped" ]; then
          echo "Go linting failed!"
          exit 1
        fi
        if [ "$FRONTEND_LINT" != "success" ] && [ "$FRONTEND_LINT" != "skipped" ]; then
          echo "Frontend linting/type checks failed!"
          exit 1
        fi
        if [ "$DOCKER_LINT" != "success" ] && [ "$DOCKER_LINT" != "skipped" ]; then
          echo "Docker linting failed!"
          exit 1
        fi
        if [ "$SECURITY_LINT" != "success" ] && [ "$SECURITY_LINT" != "skipped" ]; then
          echo "Actions security lint failed!"
          exit 1
        fi
        if [ "$TESTS_PYTHON" != "success" ] && [ "$TESTS_PYTHON" != "skipped" ]; then
          echo "Python tests failed!"
          exit 1
        fi
        if [ "$TESTS_GO" != "success" ] && [ "$TESTS_GO" != "skipped" ]; then
          echo "Go tests failed!"
          exit 1
        fi
        if [ "$TESTS_MIGRATIONS" != "success" ] && [ "$TESTS_MIGRATIONS" != "skipped" ]; then
          echo "Migration smoke test failed!"
          exit 1
        fi
        if [ "$TESTS_FRONTEND" != "success" ] && [ "$TESTS_FRONTEND" != "skipped" ]; then
          echo "Frontend tests failed!"
          exit 1
        fi
        echo "All CI checks passed!"
