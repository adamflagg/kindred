name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty for auto-bump from git-cliff)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  USERNAME: adamflagg

permissions:
  contents: write
  checks: read
  actions: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          *.githubapp.com:443
          9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
          agent.api.stepsecurity.io:443
          api.github.com:443
          apk.cgr.dev:443
          auth.docker.io:443
          check.trivy.dev:443
          customer-transient-data-277233109775.s3.us-west-2.amazonaws.com:443
          d-gj2h7tnxlh.execute-api.us-west-2.amazonaws.com:443
          deb.debian.org:443
          dhi.io:443
          files.pythonhosted.org:443
          get.trivy.dev:443
          ghcr.io:443
          github.com:22
          github.com:443
          mirror.gcr.io:443
          pkg-containers.githubusercontent.com:443
          prod.app-api.stepsecurity.io:443
          production.cloudflare.docker.com:443
          production.cloudfront.docker.com:443
          productionresultssa*.blob.core.windows.net:443
          proxy.golang.org:443
          pypi.org:443
          raw.githubusercontent.com:443
          registry-1.docker.io:443
          registry.npmjs.org:443
          release-assets.githubusercontent.com:443
          releases.astral.sh:443
          results-receiver.actions.githubusercontent.com:443
          storage.googleapis.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Configure git identity
      run: |
        git config user.name "adamflagg"
        git config user.email "115844481+adamflagg@users.noreply.github.com"

    - uses: kenji-miyake/setup-git-cliff@2778609c643a39a2576c4bae2e493b855eb4aee8 # v2

    - name: Check CD health (early warning)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Fail fast if CD has been consistently broken — saves waiting 15 min at "Ensure CD passed on HEAD"
        # Gets last 5 completed (non-cancelled) CD runs on main
        RUNS=$(gh run list \
          --workflow cd.yml \
          --branch main \
          --limit 10 \
          --json conclusion,status \
          --jq '[.[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure"))][:5]')

        TOTAL=$(echo "$RUNS" | jq 'length')
        FAILURES=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "failure")] | length')

        echo "CD health: $FAILURES failures in last $TOTAL completed non-cancelled runs"

        if [ "$TOTAL" -gt 0 ] && [ "$FAILURES" -ge 3 ]; then
          echo "::error::CD is unhealthy — $FAILURES/$TOTAL recent runs failed. Fix CD before releasing."
          echo "The release would fail anyway at 'Ensure CD passed on HEAD'. Check the CD workflow logs first."
          exit 1
        fi

        if [ "$FAILURES" -ge 1 ]; then
          echo "::warning::CD has $FAILURES/$TOTAL recent failures. Proceeding — 'Ensure CD passed on HEAD' will gate this."
        else
          echo "CD health OK"
        fi

    - name: Calculate version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # Get last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

        if [ -n "$INPUT_VERSION" ]; then
          # Custom version — normalize v prefix
          VER="$INPUT_VERSION"
          [[ "$VER" != v* ]] && VER="v$VER"
        else
          # Auto-bump via git-cliff
          VER=$(git cliff --bumped-version 2>/dev/null | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [[ -z "$VER" ]] && { echo "::error::git-cliff could not determine version"; exit 1; }
          [[ "$VER" != v* ]] && VER="v$VER"
        fi

        # Check tag doesn't already exist
        if git rev-parse "$VER" &>/dev/null; then
          echo "::error::Tag $VER already exists"
          exit 1
        fi

        echo "version=$VER" >> "$GITHUB_OUTPUT"
        echo "### Version: $VER" >> "$GITHUB_STEP_SUMMARY"

    - name: Generate changelog
      id: changelog
      run: |
        git cliff --unreleased --strip header > RELEASE_NOTES.md
        echo "### Release Notes" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Ensure CI passed on HEAD
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        HEAD_SHA=$(git rev-parse HEAD)
        echo "Checking CI Summary for $HEAD_SHA..."

        # Check if CI Summary already passed
        EXISTING=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
          --jq '[.check_runs[] | select(.name == "CI Summary" and .conclusion == "success")] | sort_by(.started_at) | last | .id' 2>/dev/null || echo "")

        if [ -n "$EXISTING" ]; then
          echo "CI Summary already passed"
          exit 0
        fi

        # Check if a CI workflow is already running on main (e.g., push-triggered)
        # We check workflow runs, not check-runs, because the CI Summary job
        # won't appear until its dependencies complete.
        CI_IN_PROGRESS=$(gh run list --workflow ci.yml --branch main --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
        CI_QUEUED=$(gh run list --workflow ci.yml --branch main --status queued --json databaseId --jq 'length' 2>/dev/null || echo "0")

        if [ "$CI_IN_PROGRESS" = "0" ] && [ "$CI_QUEUED" = "0" ]; then
          # No CI running — dispatch one
          echo "No CI running on main, dispatching CI..."
          gh workflow run ci.yml --ref main
        else
          echo "CI already running on main (in_progress: $CI_IN_PROGRESS, queued: $CI_QUEUED), waiting..."
        fi

        # Poll for a successful CI Summary (up to ~7.5 min)
        # Note: After dispatching, the new CI may cancel an in-progress push-triggered CI
        # (same concurrency group). The cancelled run produces a failed CI Summary.
        # We must keep polling until either a success appears or all runs finish as failures.
        for i in {1..30}; do
          sleep 15

          # Check for any successful CI Summary
          SUCCESS=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI Summary" and .conclusion == "success")] | length' 2>/dev/null || echo "0")

          if [ "$SUCCESS" != "0" ]; then
            echo "CI Summary passed"
            exit 0
          fi

          # Check if any CI Summary is still pending/in-progress
          PENDING=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI Summary" and .status != "completed")] | length' 2>/dev/null || echo "0")

          TOTAL=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI Summary")] | length' 2>/dev/null || echo "0")

          if [ "$TOTAL" != "0" ] && [ "$PENDING" = "0" ]; then
            # All CI Summary checks completed, none succeeded
            echo "::error::All CI Summary checks failed (total: $TOTAL, none succeeded)"
            exit 1
          fi

          echo "  Attempt $i/30: waiting for CI... (total: $TOTAL, pending: $PENDING)"
        done

        echo "::error::CI did not complete within 7.5 minutes"
        exit 1

    - name: Ensure CD passed on HEAD
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        HEAD_SHA=$(git rev-parse HEAD)
        echo "Waiting for CD to complete on HEAD ($HEAD_SHA)..."

        # Check if a CD run exists for HEAD
        CD_RUN=$(gh run list --workflow cd.yml --branch main --json headSha,status,conclusion,databaseId \
          --jq "[.[] | select(.headSha == \"$HEAD_SHA\")] | first" 2>/dev/null || echo "null")

        if [ "$CD_RUN" = "null" ] || [ -z "$CD_RUN" ]; then
          echo "::error::No CD run found for HEAD ($HEAD_SHA). CD should auto-trigger on push to main."
          echo "If the commit was just pushed, wait a moment and re-run this workflow."
          exit 1
        fi

        CD_STATUS=$(echo "$CD_RUN" | jq -r '.status')
        CD_CONCLUSION=$(echo "$CD_RUN" | jq -r '.conclusion')
        CD_RUN_ID=$(echo "$CD_RUN" | jq -r '.databaseId')
        echo "Found CD run #${CD_RUN_ID}: status=$CD_STATUS conclusion=$CD_CONCLUSION"

        if [ "$CD_STATUS" = "completed" ] && [ "$CD_CONCLUSION" = "success" ]; then
          echo "CD already passed on HEAD"
          exit 0
        fi

        if [ "$CD_STATUS" = "completed" ]; then
          echo "::error::CD run #${CD_RUN_ID} completed with conclusion=$CD_CONCLUSION (expected success)"
          exit 1
        fi

        # CD still running — poll until completion (up to ~20 min for CD builds)
        echo "CD still running, polling..."
        for i in {1..80}; do
          sleep 15
          CD_RUN=$(gh run list --workflow cd.yml --branch main --json headSha,status,conclusion,databaseId \
            --jq "[.[] | select(.headSha == \"$HEAD_SHA\")] | first" 2>/dev/null || echo "null")

          CD_STATUS=$(echo "$CD_RUN" | jq -r '.status')
          CD_CONCLUSION=$(echo "$CD_RUN" | jq -r '.conclusion')

          if [ "$CD_STATUS" = "completed" ]; then
            if [ "$CD_CONCLUSION" = "success" ]; then
              echo "CD passed on HEAD (after $i polls)"
              exit 0
            else
              echo "::error::CD run #${CD_RUN_ID} completed with conclusion=$CD_CONCLUSION"
              exit 1
            fi
          fi

          echo "  Attempt $i/80: CD status=$CD_STATUS..."
        done

        echo "::error::CD did not complete within 20 minutes"
        exit 1

    - name: Install crane and authenticate to GHCR
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Find SHA-tagged images in registry
      id: find-images
      run: |
        # After the CD gate, CD has completed successfully on HEAD.
        HEAD_SHA_TAG="sha-$(git rev-parse HEAD | cut -c1-7)"
        CHOSEN_TAG=""
        LOOKBACK="false"

        echo "Checking for HEAD images: ${HEAD_SHA_TAG}..."
        if crane manifest "${REGISTRY}/${USERNAME}/kindred-api:${HEAD_SHA_TAG}" > /dev/null 2>&1; then
          echo "Found images at HEAD (${HEAD_SHA_TAG})"
          CHOSEN_TAG="${HEAD_SHA_TAG}"
        else
          # CD passed but skipped the build (e.g., docs-only changes).
          # Walk back to find the most recent build. This is safe because non-built
          # commits only changed docs/config — the application code is identical.
          echo "HEAD images not found (CD skipped build), searching recent commits..."
          for SHA in $(git log --format=%H -20 --skip=1 HEAD); do
            TAG="sha-$(echo "$SHA" | cut -c1-7)"
            if crane manifest "${REGISTRY}/${USERNAME}/kindred-api:${TAG}" > /dev/null 2>&1; then
              CHOSEN_TAG="$TAG"
              LOOKBACK="true"
              echo "Found images at ${TAG} (commit ${SHA})"
              break
            fi
            echo "  No images at ${TAG}"
          done
        fi

        if [ -z "$CHOSEN_TAG" ]; then
          echo "::error::No SHA-tagged images found in the last 20 commits."
          echo "A CD run with an actual build is required before releasing."
          exit 1
        fi

        # Verify all 3 promoted images exist at the chosen tag
        for IMAGE in kindred-pocketbase kindred-api kindred-init; do
          if ! crane manifest "${REGISTRY}/${USERNAME}/${IMAGE}:${CHOSEN_TAG}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${CHOSEN_TAG} not found — incomplete build at that commit."
            exit 1
          fi
        done

        echo "All 3 images verified at ${CHOSEN_TAG}"
        echo "sha_tag=${CHOSEN_TAG}" >> "$GITHUB_OUTPUT"
        echo "lookback=${LOOKBACK}" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry (for docker push)
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hardened Images registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: dhi.io
        username: ${{ secrets.DHI_USERNAME }}
        password: ${{ secrets.DHI_TOKEN }}

    - name: Clone private config for branding assets
      uses: ./.github/actions/clone-kindred-local
      with:
        deploy-key: ${{ secrets.KINDRED_LOCAL_DEPLOY_KEY }}

    - name: Prepare local assets for Docker build
      run: |
        mkdir -p local/assets
        if [ -f local/assets/camp-logo.png ]; then
          echo "Local assets found (from kindred-local)"
        else
          echo "No local assets — using default branding"
        fi

    - name: Rebuild caddy with release version
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        DOCKER_TAG=${VERSION#v}
        MINOR_TAG=$(echo "$DOCKER_TAG" | cut -d. -f1-2)
        IMAGE="${REGISTRY}/${USERNAME}/kindred-caddy"

        echo "Building kindred-caddy with VERSION=${VERSION}..."
        docker build \
          -f docker/Dockerfile.caddy \
          -t "${IMAGE}:${DOCKER_TAG}" \
          --build-arg VERSION="${VERSION}" \
          --build-arg BUILD_DATE="${BUILD_DATE}" \
          .

        docker tag "${IMAGE}:${DOCKER_TAG}" "${IMAGE}:${MINOR_TAG}"
        docker tag "${IMAGE}:${DOCKER_TAG}" "${IMAGE}:latest"
        docker push "${IMAGE}:${DOCKER_TAG}"
        docker push "${IMAGE}:${MINOR_TAG}"
        docker push "${IMAGE}:latest"

        echo "kindred-caddy rebuilt and pushed with release version"

    - name: Promote non-frontend images via crane
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SHA_TAG: ${{ steps.find-images.outputs.sha_tag }}
      run: |
        # Strip v prefix for Docker tags (git tag v3.2.0 -> Docker tag 3.2.0)
        DOCKER_TAG=${VERSION#v}
        MINOR_TAG=$(echo "$DOCKER_TAG" | cut -d. -f1-2)
        IMAGES=("kindred-pocketbase" "kindred-api" "kindred-init")

        echo "Promoting images: ${SHA_TAG} -> ${DOCKER_TAG}, ${MINOR_TAG}, latest"

        for IMAGE in "${IMAGES[@]}"; do
          SRC="${REGISTRY}/${USERNAME}/${IMAGE}:${SHA_TAG}"
          echo "Promoting ${IMAGE}..."
          crane tag "$SRC" "$DOCKER_TAG"
          crane tag "$SRC" "$MINOR_TAG"
          crane tag "$SRC" "latest"
        done

        echo "Non-frontend images promoted successfully"

    - name: Summarize Docker image promotion
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SHA_TAG: ${{ steps.find-images.outputs.sha_tag }}
        LOOKBACK: ${{ steps.find-images.outputs.lookback }}
      run: |
        DOCKER_TAG=${VERSION#v}
        MINOR_TAG=$(echo "$DOCKER_TAG" | cut -d. -f1-2)
        HEAD_SHA_TAG="sha-$(git rev-parse HEAD | cut -c1-7)"

        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### Docker Images" >> "$GITHUB_STEP_SUMMARY"
        if [ "$LOOKBACK" = "true" ]; then
          echo "> **Note:** HEAD (${HEAD_SHA_TAG}) had no images (CD skipped build). Promoting from ${SHA_TAG} instead — application code is identical." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "| Image | Method | Source |" >> "$GITHUB_STEP_SUMMARY"
        echo "|-------|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| kindred-caddy | Rebuilt | VERSION=${VERSION} |" >> "$GITHUB_STEP_SUMMARY"
        echo "| kindred-pocketbase | Promoted | :${SHA_TAG} |" >> "$GITHUB_STEP_SUMMARY"
        echo "| kindred-api | Promoted | :${SHA_TAG} |" >> "$GITHUB_STEP_SUMMARY"
        echo "| kindred-init | Promoted | :${SHA_TAG} |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Tags: \`:${DOCKER_TAG}\`, \`:${MINOR_TAG}\`, \`:latest\`" >> "$GITHUB_STEP_SUMMARY"

    - name: Create tag and release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Create annotated tag
        git tag -a "$VERSION" -m "$(cat RELEASE_NOTES.md)"
        git push origin "$VERSION"

        # Create GitHub release
        gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md
