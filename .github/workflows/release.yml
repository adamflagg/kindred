name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty for auto-bump from git-cliff)'
        required: false
        type: string

permissions:
  contents: write
  checks: read
  actions: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Configure git identity
      run: |
        git config user.name "adamflagg"
        git config user.email "115844481+adamflagg@users.noreply.github.com"

    - uses: kenji-miyake/setup-git-cliff@v2

    - name: Calculate version
      id: version
      run: |
        # Get last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

        if [ -n "${{ inputs.version }}" ]; then
          # Custom version — normalize v prefix
          VER="${{ inputs.version }}"
          [[ "$VER" != v* ]] && VER="v$VER"
        else
          # Auto-bump via git-cliff
          VER=$(git cliff --bumped-version 2>/dev/null | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [[ -z "$VER" ]] && { echo "::error::git-cliff could not determine version"; exit 1; }
          [[ "$VER" != v* ]] && VER="v$VER"
        fi

        # Check tag doesn't already exist
        if git rev-parse "$VER" &>/dev/null; then
          echo "::error::Tag $VER already exists"
          exit 1
        fi

        # Check for release-worthy commits (skip if only docs/test/refactor)
        if [ -z "${{ inputs.version }}" ]; then
          RANGE="${LAST_TAG:+$LAST_TAG..HEAD}"
          RANGE="${RANGE:-HEAD}"
          WORTHY=$(git log $RANGE --oneline | grep -cE '^[a-f0-9]+ (feat|fix|perf)(\(.+\))?(!)?:' || true)
          if [ "$WORTHY" -eq 0 ]; then
            echo "::error::No release-worthy commits (feat/fix/perf) since $LAST_TAG. Use version override to force."
            exit 1
          fi
        fi

        echo "version=$VER" >> "$GITHUB_OUTPUT"
        echo "### Version: $VER" >> "$GITHUB_STEP_SUMMARY"

    - name: Generate changelog
      id: changelog
      run: |
        git cliff --unreleased --strip header > RELEASE_NOTES.md
        echo "### Release Notes" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Ensure CI passed on HEAD
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        HEAD_SHA=$(git rev-parse HEAD)
        echo "Checking CI Summary for $HEAD_SHA..."

        # Check if CI Summary already passed
        EXISTING=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
          --jq '[.check_runs[] | select(.name == "CI Summary" and .conclusion == "success")] | sort_by(.started_at) | last | .id' 2>/dev/null || echo "")

        if [ -n "$EXISTING" ]; then
          echo "✅ CI Summary already passed"
          exit 0
        fi

        # CI hasn't run on this commit — dispatch it
        echo "⚠️ CI Summary not found, dispatching CI..."
        gh workflow run ci.yml --ref main

        # Poll for CI Summary (up to ~5 min)
        for i in {1..20}; do
          sleep 15
          RESULT=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI Summary")] | sort_by(.started_at) | last | {status: .status, conclusion: .conclusion}' 2>/dev/null || echo "")

          if [ -z "$RESULT" ]; then
            echo "  Attempt $i/20: CI not started yet..."
            continue
          fi

          STATUS=$(echo "$RESULT" | jq -r '.status')
          CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion')

          if [ "$STATUS" = "completed" ]; then
            if [ "$CONCLUSION" = "success" ]; then
              echo "✅ CI Summary passed"
              exit 0
            else
              echo "❌ CI Summary failed (conclusion: $CONCLUSION)"
              exit 1
            fi
          fi

          echo "  Attempt $i/20: CI in progress..."
        done

        echo "❌ CI did not complete within 5 minutes"
        exit 1

    - name: Create tag and release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"

        # Create annotated tag
        git tag -a "$VERSION" -m "$(cat RELEASE_NOTES.md)"
        git push origin "$VERSION"

        # Create GitHub release
        gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md
