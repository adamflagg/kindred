name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty for auto-bump from git-cliff)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  USERNAME: adamflagg

permissions:
  contents: write
  checks: read
  actions: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Configure git identity
      run: |
        git config user.name "adamflagg"
        git config user.email "115844481+adamflagg@users.noreply.github.com"

    - uses: kenji-miyake/setup-git-cliff@2778609c643a39a2576c4bae2e493b855eb4aee8 # v2

    - name: Calculate version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # Get last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

        if [ -n "$INPUT_VERSION" ]; then
          # Custom version — normalize v prefix
          VER="$INPUT_VERSION"
          [[ "$VER" != v* ]] && VER="v$VER"
        else
          # Auto-bump via git-cliff
          VER=$(git cliff --bumped-version 2>/dev/null | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [[ -z "$VER" ]] && { echo "::error::git-cliff could not determine version"; exit 1; }
          [[ "$VER" != v* ]] && VER="v$VER"
        fi

        # Check tag doesn't already exist
        if git rev-parse "$VER" &>/dev/null; then
          echo "::error::Tag $VER already exists"
          exit 1
        fi

        # Check for release-worthy commits (skip if only docs/test/refactor)
        if [ -z "$INPUT_VERSION" ]; then
          RANGE="${LAST_TAG:+$LAST_TAG..HEAD}"
          RANGE="${RANGE:-HEAD}"
          WORTHY=$(git log $RANGE --oneline | grep -cE '^[a-f0-9]+ (feat|fix|perf)(\(.+\))?(!)?:' || true)
          if [ "$WORTHY" -eq 0 ]; then
            echo "::error::No release-worthy commits (feat/fix/perf) since $LAST_TAG. Use version override to force."
            exit 1
          fi
        fi

        echo "version=$VER" >> "$GITHUB_OUTPUT"
        echo "### Version: $VER" >> "$GITHUB_STEP_SUMMARY"

    - name: Generate changelog
      id: changelog
      run: |
        git cliff --unreleased --strip header > RELEASE_NOTES.md
        echo "### Release Notes" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Ensure CI passed on HEAD
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        HEAD_SHA=$(git rev-parse HEAD)
        echo "Checking CI Summary for $HEAD_SHA..."

        # Check if CI Summary already passed
        EXISTING=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
          --jq '[.check_runs[] | select(.name == "CI Summary" and .conclusion == "success")] | sort_by(.started_at) | last | .id' 2>/dev/null || echo "")

        if [ -n "$EXISTING" ]; then
          echo "CI Summary already passed"
          exit 0
        fi

        # Check if a CI workflow is already running on main (e.g., push-triggered)
        # We check workflow runs, not check-runs, because the CI Summary job
        # won't appear until its dependencies complete.
        CI_IN_PROGRESS=$(gh run list --workflow ci.yml --branch main --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
        CI_QUEUED=$(gh run list --workflow ci.yml --branch main --status queued --json databaseId --jq 'length' 2>/dev/null || echo "0")

        if [ "$CI_IN_PROGRESS" = "0" ] && [ "$CI_QUEUED" = "0" ]; then
          # No CI running — dispatch one
          echo "No CI running on main, dispatching CI..."
          gh workflow run ci.yml --ref main
        else
          echo "CI already running on main (in_progress: $CI_IN_PROGRESS, queued: $CI_QUEUED), waiting..."
        fi

        # Poll for a successful CI Summary (up to ~5 min)
        # Note: After dispatching, the new CI may cancel an in-progress push-triggered CI
        # (same concurrency group). The cancelled run produces a failed CI Summary.
        # We must keep polling until either a success appears or all runs finish as failures.
        for i in {1..20}; do
          sleep 15

          # Check for any successful CI Summary
          SUCCESS=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI Summary" and .conclusion == "success")] | length' 2>/dev/null || echo "0")

          if [ "$SUCCESS" != "0" ]; then
            echo "CI Summary passed"
            exit 0
          fi

          # Check if any CI Summary is still pending/in-progress
          PENDING=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI Summary" and .status != "completed")] | length' 2>/dev/null || echo "0")

          TOTAL=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI Summary")] | length' 2>/dev/null || echo "0")

          if [ "$TOTAL" != "0" ] && [ "$PENDING" = "0" ]; then
            # All CI Summary checks completed, none succeeded
            echo "::error::All CI Summary checks failed (total: $TOTAL, none succeeded)"
            exit 1
          fi

          echo "  Attempt $i/20: waiting for CI... (total: $TOTAL, pending: $PENDING)"
        done

        echo "::error::CI did not complete within 5 minutes"
        exit 1

    - name: Ensure CD passed on HEAD
      id: cd-check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        HEAD_SHA=$(git rev-parse HEAD)
        SHA_TAG="sha-$(echo "$HEAD_SHA" | cut -c1-7)"
        echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
        echo "Waiting for CD to complete for $HEAD_SHA (need :${SHA_TAG} images)..."

        # Poll for up to 15 minutes (45 attempts x 20s)
        for i in {1..45}; do
          # Find CD runs for this exact commit on main
          RUN_INFO=$(gh run list \
            --workflow cd.yml \
            --branch main \
            --limit 5 \
            --json headSha,status,conclusion,databaseId \
            --jq ".[] | select(.headSha == \"$HEAD_SHA\")" | head -1 2>/dev/null || echo "")

          if [ -z "$RUN_INFO" ]; then
            echo "  Attempt $i/45: No CD run found for this commit yet, waiting..."
            sleep 20
            continue
          fi

          STATUS=$(echo "$RUN_INFO" | jq -r '.status')
          CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')
          RUN_ID=$(echo "$RUN_INFO" | jq -r '.databaseId')

          if [ "$STATUS" = "completed" ]; then
            if [ "$CONCLUSION" = "success" ]; then
              echo "CD run $RUN_ID completed successfully"
              exit 0
            else
              echo "::error::CD run $RUN_ID completed with conclusion: $CONCLUSION"
              echo "Fix the CD failure and re-run this release workflow."
              exit 1
            fi
          fi

          echo "  Attempt $i/45: CD run $RUN_ID is $STATUS, waiting..."
          sleep 20
        done

        echo "::error::CD did not complete within 15 minutes"
        echo "The CD workflow may still be running. Wait for it to finish, then re-run this release."
        exit 1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Promote Docker images to release tags
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SHA_TAG: ${{ steps.cd-check.outputs.sha_tag }}
      run: |
        # Strip v prefix for Docker tags (git tag v3.2.0 -> Docker tag 3.2.0)
        DOCKER_TAG=${VERSION#v}
        MINOR_TAG=$(echo "$DOCKER_TAG" | cut -d. -f1-2)
        IMAGES=("kindred-caddy" "kindred-pocketbase" "kindred-api" "kindred-init")

        echo "Promoting images: ${SHA_TAG} -> ${DOCKER_TAG}, ${MINOR_TAG}"

        for IMAGE in "${IMAGES[@]}"; do
          SRC="${REGISTRY}/${USERNAME}/${IMAGE}:${SHA_TAG}"
          echo "Promoting ${IMAGE}..."
          docker buildx imagetools create "$SRC" \
            --tag "${REGISTRY}/${USERNAME}/${IMAGE}:${DOCKER_TAG}" \
            --tag "${REGISTRY}/${USERNAME}/${IMAGE}:${MINOR_TAG}"
        done

        echo "All images promoted successfully"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### Docker Images Promoted" >> "$GITHUB_STEP_SUMMARY"
        echo "Source: \`:${SHA_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "Tags: \`:${DOCKER_TAG}\`, \`:${MINOR_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        for IMAGE in "${IMAGES[@]}"; do
          echo "- \`${REGISTRY}/${USERNAME}/${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
        done

    - name: Create tag and release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Create annotated tag
        git tag -a "$VERSION" -m "$(cat RELEASE_NOTES.md)"
        git push origin "$VERSION"

        # Create GitHub release
        gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md
