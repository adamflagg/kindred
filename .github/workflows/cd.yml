name: CD - Build & Deploy Docker Images

on:
  # Weekly Trivy scan to catch new CVEs even without releases
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC

  # Manual trigger - use dry_run to test without pushing
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional additional tag (latest is always pushed)'
        required: false
        type: string
      no_cache:
        description: 'Disable Docker layer cache (force full rebuild)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build and test only - do NOT push to registry'
        required: false
        type: boolean
        default: false

  # Auto-validate CD changes on PRs (dry-run mode, no push)
  # This catches CD breakage BEFORE it merges to main
  pull_request:
    paths:
      - 'docker/multi/**'
      - '.github/workflows/cd.yml'

  # On version tags only (semver pattern)
  # Use: git tag -a v0.1.0 -m "Release message" && git push --tags
  # Note: release.sh creates the GitHub release, so we don't trigger on release events
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  USERNAME: adamflagg

# Prevent multiple CD runs for the same ref
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what changed to optimize builds
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      docker: ${{ steps.filter.outputs.docker }}
      initial_commit: ${{ steps.get-base-sha.outputs.initial_commit }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Get base SHA for comparison
      id: get-base-sha
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Checking for last successful CD run..."
        echo "Current commit SHA: ${{ github.sha }}"

        LAST_SUCCESS_SHA=$(gh run list \
          --workflow cd.yml \
          --branch main \
          --status success \
          --limit 5 \
          --json headSha \
          --jq '.[] | select(.headSha != "${{ github.sha }}") | .headSha' | head -1 || echo "")

        if [ -n "$LAST_SUCCESS_SHA" ]; then
          echo "Found previous successful run: $LAST_SUCCESS_SHA"
          BASE_SHA=$LAST_SUCCESS_SHA
          echo "initial_commit=false" >> $GITHUB_OUTPUT
        elif git rev-parse HEAD~1 >/dev/null 2>&1; then
          echo "No previous successful runs found, falling back to HEAD~1"
          BASE_SHA=$(git rev-parse HEAD~1)
          echo "Using previous commit: $BASE_SHA"
          echo "initial_commit=false" >> $GITHUB_OUTPUT
        else
          echo "Initial commit detected (no parent) - building all images"
          # For initial commit, use HEAD as base (no changes detected by paths-filter)
          # but set flag to force all builds
          BASE_SHA=${{ github.sha }}
          echo "initial_commit=true" >> $GITHUB_OUTPUT
        fi

        echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
        echo "Comparing changes from $BASE_SHA to ${{ github.sha }}"

        if [ "$BASE_SHA" != "${{ github.sha }}" ]; then
          echo "=== Change Detection Summary ==="
          echo "Files changed:"
          git diff --name-only $BASE_SHA HEAD 2>/dev/null | head -20
          echo "Total files changed: $(git diff --name-only $BASE_SHA HEAD 2>/dev/null | wc -l)"
        else
          echo "=== Initial commit - all files are new ==="
        fi

    - name: Check for file changes
      uses: dorny/paths-filter@v3
      id: filter
      with:
        base: ${{ steps.get-base-sha.outputs.base_sha }}
        filters: |
          api:
            - 'api/**'
            - 'bunking/**'
            - 'campminder/**'
            - 'pocketbase/**'
            - 'frontend/**'
            - 'config/*.json'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'docker/multi/**'
          docker:
            - 'docker/multi/**'
            - 'docker-compose*.yml'
            - '.dockerignore'

  # Verify CI and docs checks passed for tag pushes
  # This reuses results from the branch push - no duplicate runs
  verify-ci:
    name: Verify CI Passed
    needs: detect-changes
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
    - name: Check CI and docs status for this commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # For PRs, github.sha is the merge commit (virtual), not the PR head commit
        # CI runs on the PR head commit, so we need to check that instead
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          CHECK_SHA="${{ github.event.pull_request.head.sha }}"
          echo "PR event: checking PR head commit $CHECK_SHA"
        else
          CHECK_SHA="${{ github.sha }}"
          echo "Checking check runs for $CHECK_SHA..."
        fi

        # Helper: returns a JSON summary for a named check
        # Always returns valid JSON: {"total":N, "success":N, "failed":N, "pending":N}
        get_check_summary() {
          local check_name="$1"
          gh api "repos/${{ github.repository }}/commits/${CHECK_SHA}/check-runs" \
            --jq "
              [.check_runs[] | select(.name == \"$check_name\")] |
              {
                total: length,
                success: [.[] | select(.status == \"completed\" and .conclusion == \"success\")] | length,
                failed: [.[] | select(.status == \"completed\" and .conclusion != \"success\")] | length,
                pending: [.[] | select(.status != \"completed\")] | length
              }
            "
        }

        # For tag pushes, check if CI already passed (commit was tested on branch)
        # This saves ~1-5 minutes when tagging a commit that already passed CI
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          EXISTING_SUCCESS=$(gh api "repos/${{ github.repository }}/commits/${CHECK_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI Summary" and .conclusion == "success")] | sort_by(.started_at) | last | .id' 2>/dev/null || echo "")
          if [ -n "$EXISTING_SUCCESS" ]; then
            echo "CI Summary already passed for this commit - skipping wait"
            exit 0
          fi
        fi

        # Wait for CI Summary (required)
        echo "=== Verifying CI Summary ==="
        CI_PASSED=false
        for i in {1..20}; do
          SUMMARY=$(get_check_summary "CI Summary")
          TOTAL=$(echo "$SUMMARY" | jq -r '.total')
          SUCCESS=$(echo "$SUMMARY" | jq -r '.success')
          FAILED=$(echo "$SUMMARY" | jq -r '.failed')
          PENDING=$(echo "$SUMMARY" | jq -r '.pending')

          echo "  Attempt $i/20: CI runs: $TOTAL (Success: $SUCCESS, Failed: $FAILED, Pending: $PENDING)"

          if [ "$TOTAL" -eq 0 ]; then
            echo "  No CI Summary checks found yet, waiting..."
            sleep 30
            continue
          fi

          if [ "$SUCCESS" -gt 0 ]; then
            echo "CI Summary passed"
            CI_PASSED=true
            break
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "CI Summary failed"
            exit 1
          fi

          sleep 30
        done

        if [ "$CI_PASSED" != "true" ]; then
          echo "CI timed out after 10 minutes"
          exit 1
        fi

        # Check docs if Documentation Linting check exists (means docs were changed)
        echo ""
        echo "=== Checking Documentation Linting (if applicable) ==="
        DOCS_SUMMARY=$(get_check_summary "Documentation Linting")
        DOCS_TOTAL=$(echo "$DOCS_SUMMARY" | jq -r '.total')

        if [ "$DOCS_TOTAL" -eq 0 ]; then
          echo "No docs check found (no doc changes in this commit)"
        else
          DOCS_SUCCESS=$(echo "$DOCS_SUMMARY" | jq -r '.success')
          DOCS_FAILED=$(echo "$DOCS_SUMMARY" | jq -r '.failed')

          if [ "$DOCS_SUCCESS" -gt 0 ]; then
            echo "Documentation Linting passed"
          elif [ "$DOCS_FAILED" -gt 0 ]; then
            echo "Documentation Linting failed"
            exit 1
          else
            echo "Documentation Linting still running, waiting..."
            for j in {1..10}; do
              sleep 15
              DOCS_SUMMARY=$(get_check_summary "Documentation Linting")
              DOCS_SUCCESS=$(echo "$DOCS_SUMMARY" | jq -r '.success')
              DOCS_FAILED=$(echo "$DOCS_SUMMARY" | jq -r '.failed')
              if [ "$DOCS_SUCCESS" -gt 0 ]; then
                echo "Documentation Linting passed"
                break
              fi
              if [ "$DOCS_FAILED" -gt 0 ]; then
                echo "Documentation Linting failed"
                exit 1
              fi
            done
            if [ "$DOCS_SUCCESS" -eq 0 ]; then
              echo "Documentation Linting did not complete successfully"
              exit 1
            fi
          fi
        fi

        echo ""
        echo "All required checks passed for this commit"

  # Smoke test for manual triggers
  smoke-test:
    name: Smoke Test (Manual)
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Clone private config
      env:
        DEPLOY_KEY: ${{ secrets.KINDRED_LOCAL_DEPLOY_KEY }}
      run: |
        if [ -n "$DEPLOY_KEY" ]; then
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:adamflagg/kindred-local.git /tmp/kindred-local

          # Copy files to expected locations
          cp /tmp/kindred-local/config/* config/ 2>/dev/null || true
          cp -r /tmp/kindred-local/local . 2>/dev/null || true
          cp /tmp/kindred-local/frontend/vite.config.local.ts frontend/ 2>/dev/null || true

          rm -rf /tmp/kindred-local ~/.ssh/id_ed25519
          echo "Private config loaded"
        else
          echo "KINDRED_LOCAL_DEPLOY_KEY not set - using default branding"
        fi

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Verify Python imports
      run: |
        uv sync --frozen -q
        uv run python -c "import bunking; import api; print('Python imports OK')"

    - name: Verify TypeScript compiles
      working-directory: ./frontend
      run: |
        npm ci
        npm run type-check
        echo "TypeScript OK"

  # Build, test, then push all 4 Docker images (multi-container architecture)
  # All images built in one job so integration test can use them together
  # Following Docker's "test before push" pattern:
  # https://docs.docker.com/build/ci/github-actions/test-before-push/
  build-test-push:
    name: Build, Test & Push
    needs: [detect-changes, verify-ci, smoke-test]
    if: |
      always() &&
      (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped') &&
      (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped') &&
      !(needs.verify-ci.result == 'failure' || needs.smoke-test.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Check if build needed
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # For tag pushes, check if all images were already pushed by release.sh
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          TAG_NAME=${GITHUB_REF#refs/tags/}
          DOCKER_TAG=${TAG_NAME#v}
          ALL_EXIST=true

          for IMAGE in kindred-caddy kindred-pocketbase kindred-api kindred-init; do
            echo "Checking if ${IMAGE}:${DOCKER_TAG} already exists..."
            if gh api "/users/${{ env.USERNAME }}/packages/container/${IMAGE}/versions" \
                 --jq ".[] | select(.metadata.container.tags[] == \"${DOCKER_TAG}\") | .id" \
                 > /tmp/existing_id 2>/dev/null; then
              EXISTING=$(head -1 /tmp/existing_id)
            else
              EXISTING=""
            fi

            if [ -z "$EXISTING" ]; then
              ALL_EXIST=false
              echo "  ${IMAGE}:${DOCKER_TAG} not found, will build..."
            else
              echo "  ${IMAGE}:${DOCKER_TAG} exists"
            fi
          done

          if [ "$ALL_EXIST" = "true" ]; then
            echo "build=false" >> $GITHUB_OUTPUT
            echo "All images already exist (pushed by local release) - skipping build"
            exit 0
          fi
        fi

        # Standard change detection
        if [ "${{ needs.detect-changes.outputs.api }}" == "true" ] || \
           [ "${{ github.event_name }}" == "workflow_dispatch" ] || \
           [ "${{ github.event_name }}" == "schedule" ] || \
           [[ "${{ github.ref }}" == refs/tags/* ]] || \
           [ "${{ needs.detect-changes.outputs.docker }}" == "true" ] || \
           [ "${{ needs.detect-changes.outputs.initial_commit }}" == "true" ]; then
          echo "build=true" >> $GITHUB_OUTPUT
        else
          echo "build=false" >> $GITHUB_OUTPUT
          echo "Skipping build - no changes detected"
        fi

    - name: Checkout code
      if: steps.check.outputs.build == 'true'
      uses: actions/checkout@v6

    - name: Clone private config for branding assets
      if: steps.check.outputs.build == 'true'
      env:
        DEPLOY_KEY: ${{ secrets.KINDRED_LOCAL_DEPLOY_KEY }}
      run: |
        if [ -n "$DEPLOY_KEY" ]; then
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:adamflagg/kindred-local.git /tmp/kindred-local

          # Copy files to expected locations
          cp /tmp/kindred-local/config/* config/ 2>/dev/null || true
          cp -r /tmp/kindred-local/local . 2>/dev/null || true
          cp /tmp/kindred-local/frontend/vite.config.local.ts frontend/ 2>/dev/null || true

          rm -rf /tmp/kindred-local ~/.ssh/id_ed25519
          echo "Private config loaded - branding assets available"
        else
          echo "KINDRED_LOCAL_DEPLOY_KEY not set - using default branding"
        fi

    - name: Prepare local assets for Docker build
      if: steps.check.outputs.build == 'true'
      run: |
        # Ensure local/ directory exists for Docker COPY (even if empty)
        mkdir -p local/assets
        if [ -f local/assets/camp-logo.png ]; then
          echo "Local assets found (from kindred-local)"
          ls -la local/assets/
        else
          echo "No local assets (kindred-local not available)"
          echo "Using default branding"
        fi

    - name: Log in to GitHub Container Registry
      if: steps.check.outputs.build == 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hardened Images registry
      if: steps.check.outputs.build == 'true'
      uses: docker/login-action@v4
      with:
        registry: dhi.io
        username: ${{ secrets.DHI_USERNAME }}
        password: ${{ secrets.DHI_TOKEN }}

    - name: Get version and build date
      if: steps.check.outputs.build == 'true'
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="dev"
        fi
        BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        echo "Build Date: $BUILD_DATE"

    - name: Build all Docker images (local only)
      if: steps.check.outputs.build == 'true'
      run: |
        IMAGES=("kindred-caddy" "kindred-pocketbase" "kindred-api" "kindred-init")
        DOCKERFILES=("docker/multi/Dockerfile.caddy" "docker/multi/Dockerfile.pocketbase" "docker/multi/Dockerfile.api" "docker/multi/Dockerfile.init")

        NO_CACHE_FLAG=""
        if [ "${{ github.event.inputs.no_cache }}" == "true" ]; then
          NO_CACHE_FLAG="--no-cache"
        fi

        for i in "${!IMAGES[@]}"; do
          echo "=== Building ${IMAGES[$i]} ==="
          docker build \
            -f "${DOCKERFILES[$i]}" \
            -t "${{ env.REGISTRY }}/${{ env.USERNAME }}/${IMAGES[$i]}:test" \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --build-arg BUILD_DATE=${{ steps.version.outputs.build_date }} \
            $NO_CACHE_FLAG \
            .
          echo "${IMAGES[$i]} built"
        done

        echo "All 4 images built successfully"

    - name: Determine tag suffixes
      if: steps.check.outputs.build == 'true'
      id: tags
      run: |
        TAG_SUFFIXES="latest"
        if [ -n "${{ github.event.inputs.tag }}" ]; then
          TAG_SUFFIXES="${TAG_SUFFIXES},${{ github.event.inputs.tag }}"
        fi
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          # Strip 'refs/tags/' prefix, then strip 'v' prefix for Docker tag
          # Git tags remain v0.7.0, Docker tags become 0.7.0, 0.7, latest
          TAG_NAME=${GITHUB_REF#refs/tags/}
          DOCKER_TAG=${TAG_NAME#v}
          TAG_SUFFIXES="${TAG_SUFFIXES},${DOCKER_TAG}"

          # Add minor version tag (e.g., 1.0 from 1.0.0)
          MINOR_TAG=$(echo "$DOCKER_TAG" | cut -d. -f1-2)
          if [[ "$MINOR_TAG" != "$DOCKER_TAG" ]]; then
            TAG_SUFFIXES="${TAG_SUFFIXES},${MINOR_TAG}"
          fi
        fi
        echo "tag_suffixes=$TAG_SUFFIXES" >> $GITHUB_OUTPUT
        echo "Using tag suffixes: $TAG_SUFFIXES"

    # === Integration Tests (run before push) ===
    - name: Create CI environment file
      if: steps.check.outputs.build == 'true'
      run: |
        CI_DIR="/tmp/kindred-ci-${{ github.run_id }}"
        cat > .env.ci << 'EOF'
        COMPOSE_PROJECT_NAME=kindred-ci-${{ github.run_id }}
        IMAGE_TAG=test
        POCKETBASE_ADMIN_EMAIL=ci@test.local
        POCKETBASE_ADMIN_PASSWORD=ci-test-password
        # Optional vars (empty to suppress warnings)
        CAMPMINDER_API_KEY=
        CAMPMINDER_PRIMARY_KEY=
        CAMPMINDER_CLIENT_ID=
        CAMPMINDER_SEASON_ID=
        SUB_BUNKING=
        DOMAIN_NAME=
        EOF
        # APPDATA_DIR needs shell expansion, add separately
        echo "APPDATA_DIR=${CI_DIR}" >> .env.ci
        # Remove leading whitespace from heredoc
        sed -i 's/^[[:space:]]*//' .env.ci
        # Create data directories with correct ownership (65532 = nonroot in distroless)
        mkdir -p ${CI_DIR}/kindred/pocketbase ${CI_DIR}/kindred/config
        sudo chown -R 65532:65532 ${CI_DIR}/kindred

    - name: Start test stack
      if: steps.check.outputs.build == 'true'
      run: |
        # Use multi-container compose with CI override
        # --wait uses Docker's native healthcheck polling
        # --wait-timeout 180 allows time for all 4 containers (init runs first, then api/caddy)
        if docker compose --env-file .env.ci -f docker/multi/docker-compose.yml -f docker/multi/docker-compose.ci.yml up -d --wait --wait-timeout 180; then
          echo "All services healthy!"
        else
          echo "Services failed to become healthy within 180 seconds"
          docker compose --env-file .env.ci -f docker/multi/docker-compose.yml -f docker/multi/docker-compose.ci.yml ps
          docker compose --env-file .env.ci -f docker/multi/docker-compose.yml -f docker/multi/docker-compose.ci.yml logs --tail=50
          exit 1
        fi
        docker compose --env-file .env.ci -f docker/multi/docker-compose.yml -f docker/multi/docker-compose.ci.yml ps

    - name: Test service endpoints
      if: steps.check.outputs.build == 'true'
      run: |
        # Use localhost since port 8080 is exposed directly in docker-compose.ci.yml
        # (Avoids issues with multiple networks causing concatenated IPs)

        test_endpoint() {
          local url=$1
          local name=$2
          local max_retries=5
          local retry_delay=2

          echo "Testing $name..."
          for i in $(seq 1 $max_retries); do
            if curl -f -s -o /dev/null -w "%{http_code}" "$url" | grep -q "200"; then
              echo "  $name is responding correctly"
              return 0
            else
              echo "  Attempt $i/$max_retries failed for $name"
              if [ $i -lt $max_retries ]; then
                sleep $retry_delay
              fi
            fi
          done
          echo "$name failed after $max_retries attempts"
          curl -v "$url" || true
          return 1
        }

        echo "=== Testing via Caddy (main entry point) ==="
        test_endpoint "http://localhost:8080/health" "Health check" || exit 1
        test_endpoint "http://localhost:8080/api/config" "FastAPI config" || exit 1

        echo "All integration tests passed!"

    - name: Verify non-root user and distroless containers
      if: steps.check.outputs.build == 'true'
      run: |
        COMPOSE_CMD="docker compose --env-file .env.ci -f docker/multi/docker-compose.yml -f docker/multi/docker-compose.ci.yml"

        # API container has a shell (Wolfi-based for Python) - verify non-root
        CONTAINER_USER=$($COMPOSE_CMD exec -T api id -u)
        if [ "$CONTAINER_USER" = "0" ]; then
          echo "API container is running as root!"
          exit 1
        fi
        echo "API container running as UID: $CONTAINER_USER"

        # Verify distroless containers have no shell
        if $COMPOSE_CMD exec -T pocketbase /bin/sh -c "echo" 2>/dev/null; then
          echo "PocketBase container has a shell (should be distroless)"
          exit 1
        fi
        echo "PocketBase is distroless (no shell)"

        if $COMPOSE_CMD exec -T caddy /bin/sh -c "echo" 2>/dev/null; then
          echo "Caddy container has a shell (should be distroless)"
          exit 1
        fi
        echo "Caddy is distroless (no shell)"

    - name: Show logs on test failure
      if: failure() && steps.check.outputs.build == 'true'
      run: |
        echo "=== Docker Compose Status ==="
        docker compose --env-file .env.ci -f docker/multi/docker-compose.yml -f docker/multi/docker-compose.ci.yml ps
        echo ""
        echo "=== All Container Logs ==="
        docker compose --env-file .env.ci -f docker/multi/docker-compose.yml -f docker/multi/docker-compose.ci.yml logs

    - name: Stop test stack
      if: always() && steps.check.outputs.build == 'true'
      run: |
        docker compose --env-file .env.ci -f docker/multi/docker-compose.yml -f docker/multi/docker-compose.ci.yml down -v || true
        # Use sudo to clean up files created by container (runs as UID 65532, different from runner)
        sudo rm -rf /tmp/kindred-ci-${{ github.run_id }}

    # === Security Scan (run before push) ===
    # Scan the two images with custom code (caddy has frontend, api has Python deps)
    # PocketBase and init are distroless/minimal - lower risk
    - name: Run Trivy vulnerability scanner (Caddy)
      if: steps.check.outputs.build == 'true'
      uses: aquasecurity/trivy-action@0.34.2
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.USERNAME }}/kindred-caddy:test
        version: 'v0.68.2'
        format: 'sarif'
        output: 'trivy-results-kindred-caddy.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    - name: Run Trivy vulnerability scanner (API)
      if: steps.check.outputs.build == 'true'
      uses: aquasecurity/trivy-action@0.34.2
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.USERNAME }}/kindred-api:test
        version: 'v0.68.2'
        format: 'sarif'
        output: 'trivy-results-kindred-api.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    - name: Run Trivy vulnerability scanner (PocketBase)
      if: steps.check.outputs.build == 'true'
      uses: aquasecurity/trivy-action@0.34.2
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.USERNAME }}/kindred-pocketbase:test
        version: 'v0.68.2'
        format: 'sarif'
        output: 'trivy-results-kindred-pocketbase.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    - name: Run Trivy vulnerability scanner (Init)
      if: steps.check.outputs.build == 'true'
      uses: aquasecurity/trivy-action@0.34.2
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.USERNAME }}/kindred-init:test
        version: 'v0.68.2'
        format: 'sarif'
        output: 'trivy-results-kindred-init.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    - name: Upload Trivy results - Caddy
      if: steps.check.outputs.build == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results-kindred-caddy.sarif'
        category: 'trivy-kindred-caddy'
        ref: ${{ startsWith(github.ref, 'refs/tags/') && 'refs/heads/main' || github.ref }}
        sha: ${{ github.sha }}

    - name: Upload Trivy results - API
      if: steps.check.outputs.build == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results-kindred-api.sarif'
        category: 'trivy-kindred-api'
        ref: ${{ startsWith(github.ref, 'refs/tags/') && 'refs/heads/main' || github.ref }}
        sha: ${{ github.sha }}

    - name: Upload Trivy results - PocketBase
      if: steps.check.outputs.build == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results-kindred-pocketbase.sarif'
        category: 'trivy-kindred-pocketbase'
        ref: ${{ startsWith(github.ref, 'refs/tags/') && 'refs/heads/main' || github.ref }}
        sha: ${{ github.sha }}

    - name: Upload Trivy results - Init
      if: steps.check.outputs.build == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results-kindred-init.sarif'
        category: 'trivy-kindred-init'
        ref: ${{ startsWith(github.ref, 'refs/tags/') && 'refs/heads/main' || github.ref }}
        sha: ${{ github.sha }}

    # === Push to Registry (only if tests pass and not dry-run/PR) ===
    # Tag and push the already-built :test images instead of rebuilding
    - name: Push Docker images
      if: |
        steps.check.outputs.build == 'true' &&
        github.event_name != 'pull_request' &&
        github.event.inputs.dry_run != 'true'
      run: |
        IMAGES=("kindred-caddy" "kindred-pocketbase" "kindred-api" "kindred-init")
        IFS=',' read -ra SUFFIXES <<< "${{ steps.tags.outputs.tag_suffixes }}"

        for IMAGE in "${IMAGES[@]}"; do
          TEST_IMAGE="${{ env.REGISTRY }}/${{ env.USERNAME }}/${IMAGE}:test"
          for SUFFIX in "${SUFFIXES[@]}"; do
            FULL_TAG="${{ env.REGISTRY }}/${{ env.USERNAME }}/${IMAGE}:${SUFFIX}"
            echo "Pushing: ${FULL_TAG}"
            docker tag "$TEST_IMAGE" "$FULL_TAG"
            docker push "$FULL_TAG"
          done
        done

        echo "All images pushed successfully"

    - name: Skip push (dry-run or PR)
      if: |
        steps.check.outputs.build == 'true' &&
        (github.event_name == 'pull_request' || github.event.inputs.dry_run == 'true')
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "PR validation mode - images built and tested but NOT pushed"
        else
          echo "Dry-run mode - images built and tested but NOT pushed"
        fi
        echo "   To push, trigger manually without dry_run or create a release tag"

  # Summary job
  summary:
    name: Build Summary
    needs: [build-test-push]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.build-test-push.result }}" != "success" ] && [ "${{ needs.build-test-push.result }}" != "skipped" ]; then
          echo "Build, test, or push failed!"
          exit 1
        fi

        if [ "${{ needs.build-test-push.result }}" == "skipped" ]; then
          echo "Docker build skipped (no relevant file changes)"
        elif [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "CD validation passed (PR mode - no push)"
          echo ""
          echo "This PR's CD changes have been validated:"
          echo "- All 4 Docker images built successfully"
          echo "- Integration tests passed (multi-container stack)"
          echo "- Security scan completed"
          echo ""
          echo "Images will be pushed when this PR merges and a release is created."
        elif [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
          echo "CD dry-run passed (no push)"
          echo ""
          echo "Validated:"
          echo "- All 4 Docker images built successfully"
          echo "- Integration tests passed (multi-container stack)"
          echo "- Security scan completed"
          echo ""
          echo "To push, run again without dry_run or create a release tag."
        else
          echo "All CD checks passed successfully!"
          echo ""
          echo "Images pushed:"
          echo "- ghcr.io/${{ env.USERNAME }}/kindred-caddy (Caddy reverse proxy + frontend)"
          echo "- ghcr.io/${{ env.USERNAME }}/kindred-pocketbase (PocketBase database)"
          echo "- ghcr.io/${{ env.USERNAME }}/kindred-api (FastAPI solver/metrics)"
          echo "- ghcr.io/${{ env.USERNAME }}/kindred-init (One-shot admin + OIDC setup)"
        fi

  # Auto-generate release notes from conventional commits
  create-release:
    name: Create GitHub Release
    needs: [build-test-push]
    runs-on: ubuntu-latest
    # Only run on tag pushes, not release events (release already exists) or manual triggers
    if: success() && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Need full history for git-cliff

    - name: Install git-cliff
      uses: kenji-miyake/setup-git-cliff@v2

    - name: Generate changelog
      id: changelog
      run: |
        # Get the current tag
        CURRENT_TAG=${GITHUB_REF#refs/tags/}
        echo "Current tag: $CURRENT_TAG"

        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        echo "Previous tag: $PREV_TAG"

        if [ -n "$PREV_TAG" ]; then
          echo "Generating changelog from $PREV_TAG to $CURRENT_TAG"
          git cliff $PREV_TAG..$CURRENT_TAG --strip header > RELEASE_NOTES.md
        else
          echo "No previous tag found, generating changelog for all commits"
          git cliff --latest --strip header > RELEASE_NOTES.md
        fi

        echo "=== Generated Release Notes ==="
        cat RELEASE_NOTES.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: RELEASE_NOTES.md
        generate_release_notes: false
