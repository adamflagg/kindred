name: CD - Build & Deploy Docker Images

on:
  # Weekly Trivy scan to catch new CVEs even without releases
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC

  # Manual trigger - use dry_run to test without pushing
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional additional tag (latest is always pushed)'
        required: false
        type: string
      no_cache:
        description: 'Disable Docker layer cache (force full rebuild)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build and test only - do NOT push to registry'
        required: false
        type: boolean
        default: false

  # Auto-validate CD changes on PRs (dry-run mode, no push)
  # This catches CD breakage BEFORE it merges to main
  pull_request:
    paths:
      - 'docker/**'
      - 'docker-compose*.yml'
      - '.github/workflows/cd.yml'

  # Continuous delivery: build and push on every merge to main
  # Version tags are NOT triggered here — the Release workflow handles promotion
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  USERNAME: adamflagg

# Restrict default permissions; jobs that need more declare their own
permissions:
  contents: read

# Prevent multiple CD runs for the same ref
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what changed to optimize builds
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      initial_commit: ${{ steps.get-base-sha.outputs.initial_commit }}
      short_sha: ${{ steps.short-sha.outputs.short_sha }}
      # Per-image rebuild decisions — matrix entries read these to choose
      # between full rebuild and a fast retag from :latest.
      build_caddy: ${{ steps.decide-builds.outputs.build_caddy }}
      build_pocketbase: ${{ steps.decide-builds.outputs.build_pocketbase }}
      build_api: ${{ steps.decide-builds.outputs.build_api }}
      build_init: ${{ steps.decide-builds.outputs.build_init }}
      # Global gate — true if any image rebuild OR deployment-metadata changes
      # warrant running the matrix + integration-test + promote pipeline at all.
      should_build: ${{ steps.decide-builds.outputs.should_build }}
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Get base SHA for comparison
      id: get-base-sha
      env:
        GH_TOKEN: ${{ github.token }}
        GH_SHA: ${{ github.sha }}
      run: |
        echo "Checking for last successful CD run..."
        echo "Current commit SHA: $GH_SHA"

        LAST_SUCCESS_SHA=$(gh run list \
          --workflow cd.yml \
          --branch main \
          --status success \
          --limit 5 \
          --json headSha \
          --jq ".[] | select(.headSha != \"$GH_SHA\") | .headSha" | head -1 || echo "")

        if [ -n "$LAST_SUCCESS_SHA" ]; then
          echo "Found previous successful run: $LAST_SUCCESS_SHA"
          BASE_SHA=$LAST_SUCCESS_SHA
          echo "initial_commit=false" >> $GITHUB_OUTPUT
        elif git rev-parse HEAD~1 >/dev/null 2>&1; then
          echo "No previous successful runs found, falling back to HEAD~1"
          BASE_SHA=$(git rev-parse HEAD~1)
          echo "Using previous commit: $BASE_SHA"
          echo "initial_commit=false" >> $GITHUB_OUTPUT
        else
          echo "Initial commit detected (no parent) - building all images"
          # For initial commit, use HEAD as base (no changes detected by paths-filter)
          # but set flag to force all builds
          BASE_SHA=$GH_SHA
          echo "initial_commit=true" >> $GITHUB_OUTPUT
        fi

        echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
        echo "Comparing changes from $BASE_SHA to $GH_SHA"

        if [ "$BASE_SHA" != "$GH_SHA" ]; then
          echo "=== Change Detection Summary ==="
          echo "Files changed:"
          git diff --name-only $BASE_SHA HEAD 2>/dev/null | head -20
          echo "Total files changed: $(git diff --name-only $BASE_SHA HEAD 2>/dev/null | wc -l)"
        else
          echo "=== Initial commit - all files are new ==="
        fi

    - name: Check for file changes
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
      id: filter
      with:
        base: ${{ steps.get-base-sha.outputs.base_sha }}
        filters: |
          # Per-image triggers — used to decide whether each matrix runner
          # does a full rebuild or just retags :latest -> :test-<sha>.
          # Be conservative: anything COPY'd into the Dockerfile triggers a rebuild.
          # .dockerignore controls what gets COPY'd into every image, so an
          # edit (especially one that excludes a previously-included file) must
          # trigger a rebuild for every image to catch the regression.
          caddy:
            - 'frontend/**'
            - 'config/branding*.json'
            - 'docker/Caddyfile'
            - 'docker/Dockerfile.caddy'
            - 'docker/healthcheck/**'
            - '.dockerignore'
          pocketbase:
            - 'pocketbase/**'
            - 'docker/Dockerfile.pocketbase'
            - 'docker/healthcheck/**'
            - '.dockerignore'
          api:
            - 'api/**'
            - 'bunking/**'
            - 'campminder/**'
            - 'config/**'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'docker/Dockerfile.api'
            - '.dockerignore'
          init:
            - 'pocketbase/**'
            - 'docker/init-entrypoint.sh'
            - 'docker/Dockerfile.init'
            - '.dockerignore'
          # Deployment-metadata changes — affect how images run together but not
          # image content. Triggers integration-test + promote without rebuilds.
          deployment:
            - 'docker-compose*.yml'

    - name: Compute short SHA for staging tag
      id: short-sha
      # Run even if earlier steps failed. short_sha only reads github.* context,
      # not prior step outputs, so it can always compute. Required so the
      # should-build safety fallback (which also uses always()) doesn't produce
      # a should_build=true / short_sha="" inconsistency that would let
      # downstream jobs push to malformed :test- tags.
      if: always()
      env:
        # On PR, github.sha is the merge-commit SHA; use the PR head SHA so the
        # staging tag matches what's actually built and matches GIT_SHA build-arg.
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        GH_SHA: ${{ github.sha }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          FULL_SHA="$PR_HEAD"
        else
          FULL_SHA="$GH_SHA"
        fi
        SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "Staging tag will be: :test-$SHORT_SHA"

    - name: Decide per-image build vs retag
      id: decide-builds
      # Always-run + safety fallback: if per-image filter outputs are empty
      # (detect failed), force all rebuilds. Otherwise compute per-image
      # build flags from filter outputs + the "rebuild everything" triggers
      # (initial commit, workflow_dispatch, schedule).
      if: always()
      env:
        CHANGES_CADDY: ${{ steps.filter.outputs.caddy }}
        CHANGES_POCKETBASE: ${{ steps.filter.outputs.pocketbase }}
        CHANGES_API: ${{ steps.filter.outputs.api }}
        CHANGES_INIT: ${{ steps.filter.outputs.init }}
        CHANGES_DEPLOYMENT: ${{ steps.filter.outputs.deployment }}
        CHANGES_INITIAL: ${{ steps.get-base-sha.outputs.initial_commit }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        # Safety fallback: empty filter outputs mean detection failed.
        DETECT_FAILED=false
        if [ -z "$CHANGES_CADDY" ] && [ -z "$CHANGES_POCKETBASE" ] && \
           [ -z "$CHANGES_API" ] && [ -z "$CHANGES_INIT" ]; then
          echo "::warning::Per-image filter outputs empty — forcing all rebuilds as safety fallback"
          DETECT_FAILED=true
        fi

        # "Rebuild everything" triggers: first commit, manual dispatch, weekly
        # CVE scan, or detect-changes failure. These force build_X=true for every image.
        REBUILD_ALL=false
        if [ "$DETECT_FAILED" == "true" ] || [ "$CHANGES_INITIAL" == "true" ] || \
           [ "$EVENT_NAME" == "workflow_dispatch" ] || [ "$EVENT_NAME" == "schedule" ]; then
          REBUILD_ALL=true
        fi

        ANY_REBUILD=false
        for IMG in caddy pocketbase api init; do
          UPPER=$(echo "$IMG" | tr a-z A-Z)
          VAR="CHANGES_${UPPER}"
          if [ "$REBUILD_ALL" == "true" ] || [ "${!VAR}" == "true" ]; then
            echo "build_${IMG}=true" >> $GITHUB_OUTPUT
            ANY_REBUILD=true
            echo "  ${IMG}: REBUILD"
          else
            echo "build_${IMG}=false" >> $GITHUB_OUTPUT
            echo "  ${IMG}: retag from :latest"
          fi
        done

        # should_build (global gate): run the matrix pipeline if any image needs
        # a rebuild OR deployment metadata (compose/dockerignore) changed
        # (we re-test the existing :latest images against the new compose).
        if [ "$ANY_REBUILD" == "true" ] || [ "$CHANGES_DEPLOYMENT" == "true" ]; then
          echo "should_build=true" >> $GITHUB_OUTPUT
          echo "Matrix pipeline will run"
        else
          echo "should_build=false" >> $GITHUB_OUTPUT
          echo "No relevant changes — entire matrix pipeline skips"
        fi

  # Verify CI passed before building/pushing images
  # CI runs concurrently with CD on main pushes; this polls until it completes.
  # No `needs:` — verify-ci reads no detect-changes outputs, so it can start
  # polling in parallel with detect-changes (saves ~15s of slop).
  verify-ci:
    name: Verify CI Passed
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Check CI and docs status for this commit
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_SHA: ${{ github.sha }}
        GH_REPO: ${{ github.repository }}
      run: |
        # For PRs, github.sha is the merge commit (virtual), not the PR head commit
        # CI runs on the PR head commit, so we need to check that instead
        if [ "$EVENT_NAME" = "pull_request" ]; then
          CHECK_SHA="$PR_HEAD_SHA"
          echo "PR event: checking PR head commit $CHECK_SHA"
        else
          CHECK_SHA="$GH_SHA"
          echo "Checking check runs for $CHECK_SHA..."
        fi

        # Helper: returns a JSON summary for a named check
        # Always returns valid JSON: {"total":N, "success":N, "failed":N, "pending":N}
        get_check_summary() {
          local check_name="$1"
          gh api "repos/${GH_REPO}/commits/${CHECK_SHA}/check-runs" \
            --jq "
              [.check_runs[] | select(.name == \"$check_name\")] |
              {
                total: length,
                success: [.[] | select(.status == \"completed\" and .conclusion == \"success\")] | length,
                failed: [.[] | select(.status == \"completed\" and .conclusion != \"success\")] | length,
                pending: [.[] | select(.status != \"completed\")] | length
              }
            "
        }

        # Wait for CI Summary (required). Adaptive backoff: tight early polls
        # (CI on main reliably finishes in 90-150s), looser after.
        # Schedule: 6x5s, 4x15s, 30s thereafter -> covers up to ~10 min total.
        echo "=== Verifying CI Summary ==="
        CI_PASSED=false
        for i in {1..30}; do
          SUMMARY=$(get_check_summary "CI Summary")
          TOTAL=$(echo "$SUMMARY" | jq -r '.total')
          SUCCESS=$(echo "$SUMMARY" | jq -r '.success')
          FAILED=$(echo "$SUMMARY" | jq -r '.failed')
          PENDING=$(echo "$SUMMARY" | jq -r '.pending')

          echo "  Attempt $i/30: CI runs: $TOTAL (Success: $SUCCESS, Failed: $FAILED, Pending: $PENDING)"

          if [ "$SUCCESS" -gt 0 ]; then
            echo "CI Summary passed"
            CI_PASSED=true
            break
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "CI Summary failed"
            exit 1
          fi

          # Adaptive sleep: short for first 30s, medium for next 60s, long after.
          # Skip on final iteration — no point sleeping before the timeout exit.
          if [ "$i" -lt 30 ]; then
            if [ "$i" -le 6 ]; then
              sleep 5
            elif [ "$i" -le 10 ]; then
              sleep 15
            else
              sleep 30
            fi
          fi
        done

        if [ "$CI_PASSED" != "true" ]; then
          echo "CI timed out (max ~10 min wait)"
          exit 1
        fi

        # Check docs if Documentation Linting check exists (means docs were changed)
        echo ""
        echo "=== Checking Documentation Linting (if applicable) ==="
        DOCS_SUMMARY=$(get_check_summary "Documentation Linting")
        DOCS_TOTAL=$(echo "$DOCS_SUMMARY" | jq -r '.total')

        if [ "$DOCS_TOTAL" -eq 0 ]; then
          echo "No docs check found (no doc changes in this commit)"
        else
          DOCS_SUCCESS=$(echo "$DOCS_SUMMARY" | jq -r '.success')
          DOCS_FAILED=$(echo "$DOCS_SUMMARY" | jq -r '.failed')

          if [ "$DOCS_SUCCESS" -gt 0 ]; then
            echo "Documentation Linting passed"
          elif [ "$DOCS_FAILED" -gt 0 ]; then
            echo "Documentation Linting failed"
            exit 1
          else
            echo "Documentation Linting still running, waiting..."
            for j in {1..15}; do
              # Adaptive: 5s for first 5 polls, 15s after
              if [ "$j" -le 5 ]; then sleep 5; else sleep 15; fi
              DOCS_SUMMARY=$(get_check_summary "Documentation Linting")
              DOCS_SUCCESS=$(echo "$DOCS_SUMMARY" | jq -r '.success')
              DOCS_FAILED=$(echo "$DOCS_SUMMARY" | jq -r '.failed')
              if [ "$DOCS_SUCCESS" -gt 0 ]; then
                echo "Documentation Linting passed"
                break
              fi
              if [ "$DOCS_FAILED" -gt 0 ]; then
                echo "Documentation Linting failed"
                exit 1
              fi
            done
            if [ "$DOCS_SUCCESS" -eq 0 ]; then
              echo "Documentation Linting did not complete successfully"
              exit 1
            fi
          fi
        fi

        echo ""
        echo "All required checks passed for this commit"

  # Smoke test for manual triggers
  smoke-test:
    name: Smoke Test (Manual)
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Clone private config
      uses: ./.github/actions/clone-kindred-local
      with:
        deploy-key: ${{ secrets.KINDRED_LOCAL_DEPLOY_KEY }}

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Verify Python imports
      run: |
        uv sync --frozen -q
        uv run python -c "import bunking; import api; print('Python imports OK')"

    - name: Verify TypeScript compiles
      working-directory: ./frontend
      run: |
        npm ci
        npm run type-check
        echo "TypeScript OK"


  # Build, scan, and push to per-SHA staging tag.
  # Four matrix runners build in parallel. Each pushes :test-<short-sha> to ghcr
  # so the downstream integration-test job can pull all four. The :latest and
  # :sha-NNN tags are NOT pushed here — that happens in the promote job after
  # integration tests pass.
  build-and-scan:
    name: Build & Scan (${{ matrix.image }})
    # SPECULATIVE: runs in parallel with verify-ci. CI on main almost always
    # passes (PR CI gated the merge; squash-merge produces a tree-equal commit),
    # so the EV strongly favors building now. The push gate (promote) still
    # requires verify-ci, so a CI failure here just wastes runner-minutes on
    # a build that won't ship.
    needs: [detect-changes, smoke-test]
    if: |
      always() &&
      needs.detect-changes.outputs.should_build == 'true' &&
      (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped') &&
      !(needs.smoke-test.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kindred-caddy
            dockerfile: docker/Dockerfile.caddy
            should_build: ${{ needs.detect-changes.outputs.build_caddy }}
          - image: kindred-pocketbase
            dockerfile: docker/Dockerfile.pocketbase
            should_build: ${{ needs.detect-changes.outputs.build_pocketbase }}
          - image: kindred-api
            dockerfile: docker/Dockerfile.api
            should_build: ${{ needs.detect-changes.outputs.build_api }}
          - image: kindred-init
            dockerfile: docker/Dockerfile.init
            should_build: ${{ needs.detect-changes.outputs.build_init }}
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    # Always needed: GHCR login for both build-push and imagetools-create.
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # === Fast path: source unchanged, retag :latest -> :test-<sha> ===
    # Skips checkout, kindred-local clone, DHI login, buildx setup, full build.
    # Assumes :latest is single-platform linux/amd64 (see build step --platform);
    # imagetools create copies the manifest reference verbatim, so a multi-arch
    # :latest would carry through unchanged.
    # Errors loudly if :latest doesn't exist (e.g. brand-new image) — workflow_dispatch
    # forces should_build=true via REBUILD_ALL, so this only hits when an existing
    # image had its :latest deleted manually.
    - name: Retag ${{ matrix.image }} from :latest
      if: matrix.should_build == 'false'
      env:
        SHORT_SHA: ${{ needs.detect-changes.outputs.short_sha }}
        IMAGE: ${{ matrix.image }}
      run: |
        STAGING_TAG="${REGISTRY}/${USERNAME}/${IMAGE}:test-${SHORT_SHA}"
        LATEST_TAG="${REGISTRY}/${USERNAME}/${IMAGE}:latest"
        echo "Source unchanged — retagging $LATEST_TAG -> $STAGING_TAG"
        if ! docker buildx imagetools create -t "$STAGING_TAG" "$LATEST_TAG"; then
          echo "::error::Retag failed. :latest may not exist for ${IMAGE}. Rerun with workflow_dispatch to force a full build."
          exit 1
        fi
        echo "Retagged"

    # === Slow path: source changed, full build ===
    - name: Checkout code
      if: matrix.should_build == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Clone private config for branding assets
      if: matrix.should_build == 'true'
      uses: ./.github/actions/clone-kindred-local
      with:
        deploy-key: ${{ secrets.KINDRED_LOCAL_DEPLOY_KEY }}

    - name: Prepare local assets for Docker build
      if: matrix.should_build == 'true'
      run: |
        mkdir -p local/assets
        if [ -f local/assets/camp-logo.png ]; then
          echo "Local assets found (from kindred-local)"
        else
          echo "No local assets (kindred-local not available); using default branding"
        fi

    - name: Log in to Docker Hardened Images registry
      if: matrix.should_build == 'true'
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: dhi.io
        username: ${{ secrets.DHI_USERNAME }}
        password: ${{ secrets.DHI_TOKEN }}

    - name: Get version and build date
      if: matrix.should_build == 'true'
      id: version
      run: |
        VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
        BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      if: matrix.should_build == 'true'
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

    - name: Build and push ${{ matrix.image }} to staging tag
      if: matrix.should_build == 'true'
      env:
        INPUT_NO_CACHE: ${{ github.event.inputs.no_cache }}
        BUILD_VERSION: ${{ steps.version.outputs.version }}
        BUILD_DATE: ${{ steps.version.outputs.build_date }}
        # On pull_request runs, github.sha is the merge-commit SHA; use the PR head
        # SHA so build-arg GIT_SHA stamps the image with the exact source commit.
        BUILD_GIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        SHORT_SHA: ${{ needs.detect-changes.outputs.short_sha }}
        IMAGE: ${{ matrix.image }}
        DOCKERFILE: ${{ matrix.dockerfile }}
      run: |
        STAGING_TAG="${REGISTRY}/${USERNAME}/${IMAGE}:test-${SHORT_SHA}"
        echo "Building -> $STAGING_TAG"

        NO_CACHE_FLAG=""
        USE_CACHE=true
        if [ "$INPUT_NO_CACHE" == "true" ]; then
          NO_CACHE_FLAG="--no-cache"
          USE_CACHE=false
        fi

        CACHE_FROM=""
        if [ "$USE_CACHE" == "true" ]; then
          CACHE_FROM="--cache-from type=gha,scope=${IMAGE}"
        fi
        CACHE_TO="--cache-to type=gha,mode=max,scope=${IMAGE}"

        # --push instead of --load: ferries the image to integration-test via ghcr.
        docker buildx build \
          --platform linux/amd64 \
          -f "$DOCKERFILE" \
          -t "$STAGING_TAG" \
          --build-arg VERSION="$BUILD_VERSION" \
          --build-arg BUILD_DATE="$BUILD_DATE" \
          --build-arg GIT_SHA="$BUILD_GIT_SHA" \
          $CACHE_FROM \
          $CACHE_TO \
          $NO_CACHE_FLAG \
          --push \
          .
        echo "Pushed $STAGING_TAG"

    # Trivy gated on full-build path only. Retag path reuses an already-scanned
    # :latest digest; the weekly cron-triggered REBUILD_ALL re-scans against the
    # current CVE DB. Also: .trivyignore lives at the repo root, so without the
    # checkout from the build path, --ignorefile would silently no-op and the
    # currently-suppressed CRITICAL CVEs would block every retag run.
    # SARIF upload step below auto-skips via `steps.trivy-scan.outcome != 'skipped'`.
    - name: Install Trivy
      if: matrix.should_build == 'true'
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: v0.69.3

    - name: Scan ${{ matrix.image }} with Trivy
      if: matrix.should_build == 'true'
      id: trivy-scan
      env:
        SHORT_SHA: ${{ needs.detect-changes.outputs.short_sha }}
        IMAGE: ${{ matrix.image }}
      run: |
        STAGING_TAG="${REGISTRY}/${USERNAME}/${IMAGE}:test-${SHORT_SHA}"
        trivy version

        # SARIF report (HIGH + CRITICAL, non-blocking)
        trivy image --format sarif --output "trivy-results-${IMAGE}.sarif" \
          --severity CRITICAL,HIGH --exit-code 0 --ignorefile .trivyignore "$STAGING_TAG"

        # Block on CRITICAL
        if ! trivy image --format table --severity CRITICAL --exit-code 1 \
             --skip-db-update --ignorefile .trivyignore "$STAGING_TAG"; then
          echo "::error::CRITICAL vulnerabilities found in ${IMAGE}"
          exit 1
        fi
        echo "No CRITICAL vulnerabilities in ${IMAGE}"

    - name: Upload Trivy SARIF
      if: always() && steps.trivy-scan.outcome != 'skipped'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
      with:
        sarif_file: 'trivy-results-${{ matrix.image }}.sarif'
        category: 'trivy-${{ matrix.image }}'
        ref: ${{ github.ref }}
        sha: ${{ github.sha }}

  # Pull all 4 staging-tagged images and run the multi-container compose stack.
  integration-test:
    name: Integration Test
    needs: [detect-changes, build-and-scan]
    if: |
      always() &&
      needs.detect-changes.outputs.should_build == 'true' &&
      needs.build-and-scan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Checkout code (for compose files)
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create CI environment file
      env:
        GH_RUN_ID: ${{ github.run_id }}
        SHORT_SHA: ${{ needs.detect-changes.outputs.short_sha }}
      run: |
        CI_DIR="/tmp/kindred-ci-${GH_RUN_ID}"
        cat > .env.ci << EOF
        COMPOSE_PROJECT_NAME=kindred-ci-${GH_RUN_ID}
        IMAGE_TAG=test-${SHORT_SHA}
        POCKETBASE_ADMIN_EMAIL=ci@test.local
        POCKETBASE_ADMIN_PASSWORD=ci-test-password
        CAMPMINDER_API_KEY=
        CAMPMINDER_PRIMARY_KEY=
        CAMPMINDER_CLIENT_ID=
        CAMPMINDER_SEASON_ID=
        SUB_BUNKING=
        DOMAIN_NAME=
        ADMIN_ALLOWLIST="0.0.0.0/0 ::/0"
        EOF
        echo "APPDATA_DIR=${CI_DIR}" >> .env.ci
        sed -i 's/^[[:space:]]*//' .env.ci
        mkdir -p ${CI_DIR}/kindred/pocketbase ${CI_DIR}/kindred/config
        sudo chown -R 65532:65532 ${CI_DIR}/kindred

    - name: Pull staging images
      env:
        SHORT_SHA: ${{ needs.detect-changes.outputs.short_sha }}
      run: |
        for IMAGE in kindred-caddy kindred-pocketbase kindred-api kindred-init; do
          docker pull "${REGISTRY}/${USERNAME}/${IMAGE}:test-${SHORT_SHA}"
        done

    - name: Start test stack
      run: |
        if docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --wait-timeout 180; then
          echo "All services healthy"
        else
          echo "Services failed to become healthy"
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml ps
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml logs --tail=50
          exit 1
        fi

    - name: Test service endpoints
      run: |
        test_endpoint() {
          local url=$1
          local name=$2
          local max_retries=5
          for i in $(seq 1 $max_retries); do
            if curl -f -s -o /dev/null -w "%{http_code}" "$url" | grep -q "200"; then
              echo "$name responding"
              return 0
            fi
            sleep 2
          done
          echo "$name failed"
          curl -v "$url" || true
          return 1
        }
        test_endpoint "http://localhost:8080/health" "Health check" || exit 1
        test_endpoint "http://localhost:8080/api/config" "FastAPI config" || exit 1

    - name: Run server contract tests against the stack
      env:
        SKIP_POCKETBASE_TESTS: "false"
        # PB (:8090) and FastAPI (:8000) are internal-only; reach PocketBase through caddy
        # (:8080), which proxies /api/collections/* to PB. Admin creds match .env.ci above.
        POCKETBASE_URL: http://127.0.0.1:8080
        POCKETBASE_ADMIN_EMAIL: ci@test.local
        POCKETBASE_ADMIN_PASSWORD: ci-test-password
        # The orchestrator/full-pipeline smoke tests construct an AI provider; its init is a
        # *presence* check on the key. CD's PB is empty ⇒ the dry-run has 0 requests ⇒ no real
        # AI call is made, so a placeholder satisfies init without a secret or API spend
        # (verified: both pass with a deliberately-invalid key against an empty PB). When
        # #1623 seeds data the pipeline would actually call the provider — a real key (secret)
        # is needed then.
        AI_PROVIDER: openai
        AI_API_KEY: ci-placeholder-not-called
      run: |
        uv sync --frozen -q
        # Connectivity/wiring contract tests against the booted stack; pass against an empty
        # PB. Data-dependent suites (e2e CLI, the 27 requires_pb_db metrics tests, performance)
        # need a seeded dataset CD lacks — tracked in #1623.
        uv run pytest tests/integration/sync -v --tb=short -p no:cacheprovider

    - name: Verify non-root user and distroless containers
      run: |
        COMPOSE_CMD="docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml"
        CONTAINER_USER=$($COMPOSE_CMD exec -T api id -u)
        if [ "$CONTAINER_USER" = "0" ]; then
          echo "API running as root!"; exit 1
        fi
        echo "API running as UID: $CONTAINER_USER"

        if $COMPOSE_CMD exec -T pocketbase /bin/sh -c "echo" 2>/dev/null; then
          echo "PocketBase has a shell (should be distroless)"; exit 1
        fi
        echo "PocketBase is distroless"

        if $COMPOSE_CMD exec -T caddy /bin/sh -c "echo" 2>/dev/null; then
          echo "Caddy has a shell (should be distroless)"; exit 1
        fi
        echo "Caddy is distroless"

    - name: Show logs on failure
      if: failure()
      run: docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml logs

    - name: Stop test stack
      if: always()
      env:
        GH_RUN_ID: ${{ github.run_id }}
      run: |
        docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml down -v || true
        sudo rm -rf "/tmp/kindred-ci-${GH_RUN_ID}"

  # Retag :test-<sha> -> :latest + :sha-<NNN> (+ optional input tag).
  # Uses docker buildx imagetools create for in-registry retag (no pull/push of
  # layers, just manifest copies). Skipped on PR validation and dry-run.
  promote:
    name: Promote staging tags
    # SAFETY GATE: build-and-scan now runs speculatively (no verify-ci dep),
    # so promote MUST explicitly require verify-ci to succeed before shipping.
    # The `|| skipped` is intentional and load-bearing — verify-ci is skipped
    # on workflow_dispatch and schedule events, which are legitimate non-PR
    # triggers where we trust the operator/scheduler. On `push` to main,
    # verify-ci runs and must succeed.
    needs: [detect-changes, verify-ci, build-and-scan, integration-test]
    if: |
      always() &&
      needs.detect-changes.outputs.should_build == 'true' &&
      (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped') &&
      needs.build-and-scan.result == 'success' &&
      needs.integration-test.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

    - name: Retag staging -> release tags
      env:
        INPUT_TAG: ${{ github.event.inputs.tag }}
        SHORT_SHA: ${{ needs.detect-changes.outputs.short_sha }}
      run: |
        TARGETS=("latest" "sha-${SHORT_SHA}")
        if [ -n "$INPUT_TAG" ]; then
          TARGETS+=("$INPUT_TAG")
        fi

        for IMAGE in kindred-caddy kindred-pocketbase kindred-api kindred-init; do
          SOURCE="${REGISTRY}/${USERNAME}/${IMAGE}:test-${SHORT_SHA}"
          for TARGET in "${TARGETS[@]}"; do
            DEST="${REGISTRY}/${USERNAME}/${IMAGE}:${TARGET}"
            echo "Retagging ${SOURCE} -> ${DEST}"
            docker buildx imagetools create -t "$DEST" "$SOURCE"
          done
        done

        echo "All images promoted"

  # Summary job
  summary:
    name: Build Summary
    # verify-ci is in needs so a CI failure (which would skip promote via the
    # gate above) surfaces here as a workflow failure instead of being masked
    # by the promote=skipped branch below logging "passed".
    needs: [verify-ci, build-and-scan, integration-test, promote]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Check build status
      env:
        VERIFY_CI_RESULT: ${{ needs.verify-ci.result }}
        BUILD_RESULT: ${{ needs.build-and-scan.result }}
        TEST_RESULT: ${{ needs.integration-test.result }}
        PROMOTE_RESULT: ${{ needs.promote.result }}
        EVENT_NAME: ${{ github.event_name }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
        GH_USERNAME: ${{ env.USERNAME }}
      run: |
        # Treat skipped as OK (no-changes path, PR/dry-run for promote, or
        # workflow_dispatch/schedule for verify-ci).
        for RES_NAME in VERIFY_CI_RESULT BUILD_RESULT TEST_RESULT PROMOTE_RESULT; do
          RES="${!RES_NAME}"
          if [ "$RES" != "success" ] && [ "$RES" != "skipped" ]; then
            echo "$RES_NAME failed: $RES"
            exit 1
          fi
        done

        if [ "$BUILD_RESULT" == "skipped" ]; then
          echo "Docker build skipped (no relevant file changes)"
        elif [ "$EVENT_NAME" == "pull_request" ]; then
          echo "CD validation passed (PR mode - staging tags pushed, no promote)"
        elif [ "$DRY_RUN" == "true" ]; then
          echo "CD dry-run passed (staging tags pushed, no promote)"
        elif [ "$PROMOTE_RESULT" == "success" ]; then
          echo "All CD checks passed; images promoted to :latest and :sha-NNN"
          for IMG in kindred-caddy kindred-pocketbase kindred-api kindred-init; do
            echo "  - ghcr.io/${GH_USERNAME}/${IMG}"
          done
        else
          # build/test succeeded but promote was skipped — most commonly because
          # verify-ci failed (its gate on promote). Surface this clearly.
          echo "Build + integration-test succeeded but promote was skipped (verify_ci=$VERIFY_CI_RESULT, promote=$PROMOTE_RESULT). Images NOT promoted to :latest."
        fi
