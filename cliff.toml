[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
* {{ commit.id }}: {{ commit.raw_message | split(pat="\n") | first | trim }}{% if commit.remote.username %} (@{{ commit.remote.username }}){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[remote.github]
owner = "adamflagg"
repo = "kindred"

[git]
conventional_commits = true
filter_unconventional = false
# Rewrites applied to every message BEFORE parsing, grouping and the bump.
commit_preprocessors = [
    # Majors are cut by hand (`gh workflow run release.yml -f version=X`), never
    # by a marker. Kindred has no external consumer for a breaking change to
    # break, and all five majors to date (v2-v6) came from a `!`. Dropping the
    # marker here, before git-cliff reads it, is what stops the bump: verified
    # on git-cliff 2.14.2, `feat(api)!:` bumps v1.0.0 -> v1.1.0, not v2.0.0.
    { pattern = '^([a-z]+)(\([^)]*\))?!:', replace = "${1}${2}:" },
    { pattern = '(?m)^BREAKING[ -]CHANGE:', replace = "Breaking-note:" },
    # "(Phase 2 of 3)" orients the PR's reviewer; it means nothing in release notes.
    { pattern = '\s*\((?:[Pp]hase|[Pp]art|[Ss]tage) \d+[^)]*\)', replace = "" },
]
# Parser order matters - first match wins. Every type in commitlint.config.js's
# type-enum needs its own parser here (tests/unit/scripts/test_commit_type_config.py).
#
# Group names carry a zero-padded `<!-- NN -->` sort key, which the template's
# `striptags` removes: git-cliff orders groups by name, so without it Features
# sorted after Bug Fixes. Two digits, because "<!-- 10 -->" sorts before
# "<!-- 9 -->" as a string.
commit_parsers = [
    # Skip merge commits (both "Merge pull request" and "Merge branch" styles)
    { message = "^Merge", skip = true },

    # Reverts - catch these before the type they reference. Both spellings:
    # `revert(scope):` is the conventional form the title check accepts, and
    # `Revert "..."` is what GitHub's Revert button writes.
    { message = "^[Rr]evert", group = "<!-- 10 -->Reverts" },

    # Security is a scope, not a type: `fix(pb,security)`, `build(deps,security)`.
    # The type still says what changed (and drives the bump); the scope routes
    # it here. Placed before the skips so CI and harness hardening appear too.
    { field = "scope", pattern = "(^|,)security(,|$)", group = "<!-- 03 -->Security" },

    # All conventional commits by type
    { message = "^feat", group = "<!-- 00 -->Features" },
    { message = "^improve", group = "<!-- 01 -->Improvements" },
    { message = "^fix", group = "<!-- 02 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 04 -->Performance" },
    { message = "^build", group = "<!-- 05 -->Dependencies & Build" },
    # Includes dark groundwork: the early phases of a feature staff cannot use yet.
    { message = "^refactor", group = "<!-- 06 -->Internal" },

    # Never reach an image, so never reach the release notes. A release window
    # holding only these has nothing to release: git-cliff bumps nothing, and
    # release.yml says so.
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^docs", skip = true },
    { message = "^test", skip = true },

    # Catch-all for non-conventional commits (safety net so they appear under "Other"
    # instead of being silently dropped from changelog)
    { message = ".*", group = "<!-- 99 -->Other" },
]
tag_pattern = "v[0-9].*"

# No [bump] section. Its two flags (features_always_bump_minor,
# breaking_always_bump_major) only change anything below 1.0.0. At v1+ the rule
# is fixed: any `feat` -> minor, anything else released -> patch, and the
# preprocessors above remove breaking markers before they can force a major.
