# Kindred Multi-Container Local Testing Docker Compose
# Usage: docker compose -f docker-compose.local.yml up -d --build

services:
  # One-shot service to fix volume ownership (Docker named volumes default to root)
  init-permissions:
    image: busybox:latest
    container_name: kindred-init-permissions
    command: ["sh", "-c", "chown -R 65532:65532 /pb_data /api_logs"]
    volumes:
      - kindred-pb-data:/pb_data
      - kindred-api-logs:/api_logs
    restart: "no"
    networks:
      - kindred-local

  pocketbase:
    build:
      context: .
      dockerfile: docker/Dockerfile.pocketbase
    image: kindred-pocketbase:local
    container_name: kindred-pocketbase
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    volumes:
      - kindred-pb-data:/pb_data
    tmpfs:
      - /tmp:size=8m,uid=65532,gid=65532
    environment:
      - CAMPMINDER_API_KEY=${CAMPMINDER_API_KEY:-}
      - CAMPMINDER_PRIMARY_KEY=${CAMPMINDER_PRIMARY_KEY:-}
      - CAMPMINDER_CLIENT_ID=${CAMPMINDER_CLIENT_ID:-}
      - CAMPMINDER_SEASON_ID=${CAMPMINDER_SEASON_ID:-2025}
      - SKIP_CAMPMINDER=${SKIP_CAMPMINDER:-false}
      - API_URL=http://api:8000
      - TZ=${TZ:-America/Los_Angeles}
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck, "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kindred-local

  init:
    build:
      context: .
      dockerfile: docker/Dockerfile.init
    image: kindred-init:local
    container_name: kindred-init
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - kindred-pb-data:/pb_data
    tmpfs:
      - /tmp:size=8m,uid=65532,gid=65532
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@test.local}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-testpassword123}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
    networks:
      - kindred-local

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: kindred-api:local
    container_name: kindred-api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      pocketbase:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    volumes:
      - kindred-pb-data:/pb_data:ro
      # Solver run logs read back via /api/solver/logs/{session_id}; must persist across restarts.
      - kindred-api-logs:/app/logs
    tmpfs:
      - /tmp:size=64m,uid=65532,gid=65532
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@test.local}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-testpassword123}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AUTH_MODE=${AUTH_MODE:-bypass}
      # Allow bypass mode in local Docker (without faking CI signals)
      - ALLOW_AUTH_BYPASS=true
      - TZ=${TZ:-America/Los_Angeles}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: [CMD, curl, -f, "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - kindred-local

  caddy:
    build:
      context: .
      dockerfile: docker/Dockerfile.caddy
    image: kindred-caddy:local
    container_name: kindred-caddy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      pocketbase:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - POCKETBASE_HOST=${POCKETBASE_HOST:-pocketbase}
      - API_HOST=${API_HOST:-api}
    ports:
      - "${CADDY_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=8m,uid=65532,gid=65532
      - /app/.config/caddy:size=8m,uid=65532,gid=65532
      - /app/.local/share/caddy:size=8m,uid=65532,gid=65532
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck, "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - kindred-local

networks:
  kindred-local:
    driver: bridge

volumes:
  kindred-pb-data:
  kindred-api-logs:
