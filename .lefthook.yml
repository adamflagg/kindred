# lefthook.yml
# Git hooks manager — replaces .githooks/ and scripts/ci/quick_check.sh
# Docs: https://github.com/evilmartians/lefthook
#
# Stages:
#   pre-commit  — formatters + validators on staged files (<1s)
#   commit-msg  — conventional commit validation
#   pre-push    — fast type checks + linters (~15s, parallel). CI is the full gate.
#   post-merge  — worktree cleanup notifications
#
# Philosophy:
#   pre-commit  = auto-format (fix it for me)
#   pre-push    = "does it compile/type-check?" + fast linters (~2s each) + auto-sync generated artifacts
#   CI          = comprehensive gate (all linters, all tests, security audits)
#
# Escape hatches:
#   LEFTHOOK=0 git commit    — bypass all hooks
#   git commit --no-verify   — bypass all hooks (git-native)

# ─── Pre-commit: formatters + validators on staged files ─────────────
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "frontend/src/**/*.{ts,tsx,js,jsx,json,css}"
      root: "frontend/"
      run: npx prettier --write {staged_files}
      stage_fixed: true

    ruff-format:
      glob: "**/*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true

    gofmt:
      glob: "pocketbase/**/*.go"
      root: "pocketbase/"
      run: gofmt -w {staged_files}
      stage_fixed: true

    large-files:
      glob: "**/*"
      run: |
        for f in {staged_files}; do
          if [ -f "$f" ]; then
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            if [ "$size" -gt 5242880 ]; then
              echo "File too large (>5MB): $f ($size bytes)"
              exit 1
            fi
          fi
        done

    synthetic-seed-leak-scan:
      # #1623: never let a regenerated synthetic fixture be committed with PII.
      # Runs only when the artifact is staged; artifact-only mode needs no real DB.
      glob: "tests/fixtures/synthetic_pb/data.db.gz"
      run: |
        tmp="$(mktemp -d)/data.db"
        gunzip -c tests/fixtures/synthetic_pb/data.db.gz > "$tmp"
        uv run python -m scripts.setup.synthetic.scan_leaks --artifact "$tmp" --artifact-only

    json-validate:
      glob:
        - "config/*.json"
        - "bunking/**/*.json"
      run: |
        for f in {staged_files}; do
          if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
            echo "Invalid JSON: $f"
            exit 1
          fi
        done

    markdownlint:
      glob: "**/*.md"
      run: npx markdownlint-cli2 {staged_files}
      stage_fixed: true


# ─── Commit-msg: conventional commit validation ──────────────────────
commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}
      skip:
        - run: "! command -v npx >/dev/null 2>&1 || [ ! -d node_modules ]"

# ─── Pre-push: fast type checks + linters (parallel) ─────────────────
# Keeps: type checkers (mypy, tsc), compilation (go build), fast linters (<1s each)
# Moved to CI-only: eslint, golangci-lint, hadolint, caddy-validate
# (pytest was added back below in #1617 — it is NOT CI-only; it also runs here)
#
# kindred#1937: lefthook 2.1.6 never reads the pre-push stdin refs (its only
# file query at this stage is `git diff --name-only --cached`, which is
# empty on a normal push). That makes `{files}` empty and `{push_files}`
# fall back to "every tracked file in the repo", so every `glob:` below
# always matches and never actually gates — a single-commit, markdown-only
# branch was measured still running `go-build`. The `glob:` keys are kept
# only as documentation of each command's intended scope; the real gate is
# the `skip:` condition on each command, computed over the actual push range
# (`origin/main...HEAD`, three-dot/merge-base form — two-dot misreports once
# `main` moves). Each condition best-effort fetches `origin/main` first
# (mirroring `behind-origin` below) and fails OPEN — i.e. runs the check —
# if `origin/main` can't be resolved at all, so a missing/unfetchable ref
# never silently skips every check. This mirrors the in-repo precedent of
# `shellcheck` guarding itself with a `skip: - run:` condition below.
pre-push:
  parallel: true
  commands:
    ruff-check:
      glob:
        - "**/*.py"
        - "ruff.toml"
        - "pyproject.toml"
      run: uv run ruff check .
      skip:
        - run: "git fetch origin main --quiet 2>/dev/null || true; git rev-parse -q --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '\\.py$|(^|/)ruff\\.toml$|(^|/)pyproject\\.toml$'"

    # Full mockable Python suite, parallelized (~37s on 12 cores via xdist
    # worksteal). SKIP_POCKETBASE_TESTS gates the server/DB-dependent suites;
    # runs in parallel with the checks below. CI runs the same suite serially
    # (deterministic merge gate); pre-push optimizes for local speed.
    pytest:
      glob:
        - "**/*.py"
        - "pyproject.toml"
        - "conftest.py"
      run: SKIP_POCKETBASE_TESTS=true uv run pytest tests/ -n auto --dist worksteal -q -p no:cacheprovider
      skip:
        - run: "git fetch origin main --quiet 2>/dev/null || true; git rev-parse -q --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '\\.py$|(^|/)pyproject\\.toml$|(^|/)conftest\\.py$'"

    mypy:
      glob:
        - "**/*.py"
        - "pyproject.toml"
      run: uv run mypy . --explicit-package-bases
      skip:
        - run: "git fetch origin main --quiet 2>/dev/null || true; git rev-parse -q --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '\\.py$|(^|/)pyproject\\.toml$'"

    type-check:
      root: "frontend/"
      glob:
        - "frontend/**/*.{ts,tsx}"
        - "frontend/tsconfig.json"
        - "frontend/tsconfig.node.json"
      run: npm run type-check
      skip:
        - run: "git fetch origin main --quiet 2>/dev/null || true; git rev-parse -q --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^frontend/.*\\.(ts|tsx)$|^frontend/tsconfig(\\.node)?\\.json$'"

    go-build:
      root: "pocketbase/"
      glob:
        - "pocketbase/*.go"
        - "pocketbase/**/*.go"
        - "pocketbase/go.mod"
        - "pocketbase/go.sum"
      run: go build .
      skip:
        - run: "git fetch origin main --quiet 2>/dev/null || true; git rev-parse -q --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^pocketbase/.*\\.go$|^pocketbase/go\\.(mod|sum)$'"

    shellcheck:
      glob: "**/*.sh"
      run: find scripts/ docker/ frontend/ tests/shell/ -maxdepth 3 -name '*.sh' 2>/dev/null | xargs shellcheck --severity=warning
      skip:
        - run: "! command -v shellcheck >/dev/null 2>&1"
        - run: "git fetch origin main --quiet 2>/dev/null || true; git rev-parse -q --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '\\.sh$'"

    pb-js-lint:
      root: "pocketbase/"
      glob:
        - "pocketbase/pb_migrations/*.js"
        - "pocketbase/pb_hooks/*.js"
        - "pocketbase/package.json"
      run: npm run lint
      skip:
        - run: "git fetch origin main --quiet 2>/dev/null || true; git rev-parse -q --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^pocketbase/pb_(migrations|hooks)/.*\\.js$|^pocketbase/package\\.json$'"

    markdownlint:
      glob: "**/*.md"
      run: npx markdownlint-cli2 "**/*.md"
      skip:
        - run: "git fetch origin main --quiet 2>/dev/null || true; git rev-parse -q --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '\\.md$'"

    # Verify generated API types match the current Python schema.
    # Regenerates to a temp directory (no on-disk mutation) so this can run
    # safely alongside `type-check` in the parallel group.
    # Regen failure → hard block; drift → hard block with regen instructions.
    api-types-freshness:
      glob:
        - "api/**/*.py"
        - "bunking/**/*.py"
      skip:
        - run: "git fetch origin main --quiet 2>/dev/null || true; git rev-parse -q --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(api|bunking)/.*\\.py$'"
      run: |
        REGEN_LOG=$(mktemp)
        REGEN_DIR=$(mktemp -d)
        REGEN_OUT="$REGEN_DIR/api-generated"
        trap 'rm -rf "$REGEN_LOG" "$REGEN_DIR"' EXIT
        if ! node frontend/scripts/generate-api-types.js --output "$REGEN_OUT" > "$REGEN_LOG" 2>&1; then
          echo ""
          echo "❌  API types regen failed — fix schema errors before pushing."
          tail -n 10 "$REGEN_LOG" | sed 's/^/   /'
          echo ""
          exit 1
        fi
        if ! diff -rq "$REGEN_OUT" frontend/src/types/api-generated >/dev/null 2>&1; then
          echo ""
          echo "❌  API types are stale — generated types don't match current Python schemas."
          echo "   Run: cd frontend && npm run generate:api-types"
          echo "   Then commit the updated src/types/api-generated/ and re-push."
          echo ""
          exit 1
        fi

    behind-origin:
      only:
        - ref: main
      run: |
        git fetch origin main --quiet 2>/dev/null || exit 0
        LOCAL=$(git rev-parse HEAD)
        REMOTE=$(git rev-parse origin/main 2>/dev/null || echo "")
        BASE=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
        [ -z "$REMOTE" ] || [ -z "$BASE" ] && exit 0
        if [ "$LOCAL" != "$REMOTE" ] && [ "$LOCAL" = "$BASE" ]; then
          BEHIND_COUNT=$(git rev-list --count HEAD..origin/main)
          echo "PUSH BLOCKED: Local main is ${BEHIND_COUNT} commit(s) behind origin"
          echo "Run: git pull --rebase origin main"
          exit 1
        elif [ "$LOCAL" != "$REMOTE" ] && [ "$REMOTE" != "$BASE" ] && [ "$LOCAL" != "$BASE" ]; then
          BEHIND_COUNT=$(git rev-list --count HEAD..origin/main)
          AHEAD_COUNT=$(git rev-list --count origin/main..HEAD)
          echo "PUSH BLOCKED: Local and origin/main have diverged (${AHEAD_COUNT} ahead, ${BEHIND_COUNT} behind)"
          echo "Run: git pull --rebase origin main"
          exit 1
        fi

# ─── Post-merge: worktree cleanup notifications ──────────────────────
post-merge:
  commands:
    worktree-cleanup:
      run: |
        # --git-common-dir, not --show-toplevel: post-merge fires in whichever
        # worktree was merged into, and --show-toplevel would then look for
        # sibling worktrees inside that worktree. See scripts/worktree/new.sh.
        MAIN_REPO="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
        WORKTREES_DIR="$MAIN_REPO/.worktrees"
        [ -d "$WORKTREES_DIR" ] || exit 0
        MERGED=""
        COUNT=0
        for dir in "$WORKTREES_DIR"/*/; do
          [ -d "$dir" ] || continue
          name=$(basename "$dir")
          branch="feature/$name"
          state=$(gh pr list --head "$branch" --state merged --json state --jq '.[0].state' 2>/dev/null)
          if [ "$state" = "MERGED" ]; then
            MERGED="$MERGED $name"
            COUNT=$((COUNT + 1))
          fi
        done
        if [ "$COUNT" -gt 0 ]; then
          echo ""
          echo "Worktrees ready for cleanup (PR merged):"
          for name in $MERGED; do
            echo "  $name"
          done
          echo ""
          if [ "$COUNT" -eq 1 ]; then
            echo "Run: ./scripts/worktree/cleanup.sh${MERGED}"
          else
            echo "Run: ./scripts/worktree/cleanup.sh --all-merged"
          fi
          echo ""
        fi
