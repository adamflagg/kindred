# zizmor configuration - GitHub Actions security auditor
# https://docs.zizmor.sh/configuration

rules:
  self-hosted-runner:
    ignore:
      - ci.yml
      - cd.yml
      - claude.yml
      - release.yml
      - docs-check.yml
      - setup-labels.yml
      - dependabot-auto-merge.yml

  undocumented-permissions:
    ignore:
      - ci.yml
      - cd.yml
      - claude.yml
      - release.yml
      - docs-check.yml
      - setup-labels.yml
      - dependabot-auto-merge.yml

  artipacked:
    # claude.yml: claude-code-action needs credentials to push commits to PRs
    # release.yml: pushes tags via git push, needs credentials
    # dependabot-lockfile-fixup.yml: needs credentials to push lock file fixes
    ignore:
      - claude.yml
      - release.yml
      - dependabot-lockfile-fixup.yml

  cache-poisoning:
    # CI never publishes release artifacts - caching is internal only
    ignore:
      - ci.yml
      - cd.yml

  secrets-outside-env:
    # Solo repo — GitHub Environments add overhead with no security benefit
    ignore:
      - cd.yml
      - claude.yml
      - release.yml
      - dependabot-lockfile-fixup.yml

  bot-conditions:
    # dependabot-auto-merge.yml: actor check is an optimization gate;
    # the actual validation is done by dependabot/fetch-metadata which
    # verifies the PR was genuinely created by Dependabot
    # dependabot-lockfile-fixup.yml: same pattern — actor gate ensures
    # only Dependabot PRs trigger lock file regeneration
    ignore:
      - dependabot-auto-merge.yml
      - dependabot-lockfile-fixup.yml

  ref-injection:
    # dependabot-lockfile-fixup.yml: uses github.head_ref to checkout
    # the Dependabot branch for pushing fixes back; gated by actor check
    ignore:
      - dependabot-lockfile-fixup.yml
